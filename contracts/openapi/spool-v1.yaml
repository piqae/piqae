openapi: 3.1.0
info:
  title: Spool API
  version: 1.0.0
  description: |
    Durable local and remote printing API.
    Every response, including framework 404/405 responses, carries `X-Request-Id`.
    A caller value is preserved only when it matches `^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$`;
    otherwise Spool generates `req_<ULID>`. Native `error.request_id` and
    PrintNode-compatible error `uid` exactly match the response header.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://api.example.invalid
    description: Replace with the deployment API origin.
security:
  - bearer: []
tags:
  - name: API Keys
    description: Create and revoke environment-scoped developer credentials.
  - name: Jobs
    description: Register and observe durable print jobs.
  - name: Printers
    description: Inspect installed printer queues and driver capabilities.
  - name: Agents
    description: Enrol and observe local Spool agents.
  - name: Events
    description: Consume immutable state changes.
  - name: Webhooks
    description: Deliver signed event notifications.
  - name: PrintNode Compatibility
    description: PrintNode-shaped migration surface at the API origin root.
paths:
  /whoami:
    get:
      summary: Inspect the PrintNode-compatible account projection
      tags: [PrintNode Compatibility]
      operationId: compatibilityWhoAmI
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Compatibility account details for the authenticated environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatibilityWhoAmI" }
        "401": { $ref: "#/components/responses/Error" }
  /ping:
    get:
      summary: Check authenticated PrintNode compatibility access
      tags: [PrintNode Compatibility]
      operationId: compatibilityPing
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Authenticated compatibility API is reachable.
          content:
            text/plain:
              schema: { type: string, const: pong }
        "401": { $ref: "#/components/responses/Error" }
  /noop:
    get:
      summary: Perform an authenticated no-op
      tags: [PrintNode Compatibility]
      operationId: compatibilityNoop
      security: [{ compatibilityBasic: [] }]
      responses:
        "204":
          description: Authentication succeeded; no content is returned.
        "401": { $ref: "#/components/responses/Error" }
  /computers:
    get:
      summary: List PrintNode-compatible computers
      tags: [PrintNode Compatibility]
      operationId: compatibilityListComputers
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Computers in the authenticated environment.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityComputer" }
        "401": { $ref: "#/components/responses/Error" }
  /computers/{computer_set}:
    parameters:
      - $ref: "#/components/parameters/ComputerSet"
    get:
      summary: Get a set of PrintNode-compatible computers
      tags: [PrintNode Compatibility]
      operationId: compatibilityGetComputers
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Sorted, deduplicated computer set.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityComputer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /computers/{computer_set}/printers:
    parameters:
      - $ref: "#/components/parameters/ComputerSet"
    get:
      summary: List printers attached to a computer set
      tags: [PrintNode Compatibility]
      operationId: compatibilityListComputerPrinters
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Matching printers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrinter" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /computers/{computer_set}/printers/{printer_set}:
    parameters:
      - $ref: "#/components/parameters/ComputerSet"
      - $ref: "#/components/parameters/PrinterSet"
    get:
      summary: Intersect computer and printer sets
      tags: [PrintNode Compatibility]
      operationId: compatibilityGetComputerPrinters
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Matching printers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrinter" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printers:
    get:
      summary: List PrintNode-compatible printers
      tags: [PrintNode Compatibility]
      operationId: compatibilityListPrinters
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Printers in the authenticated environment.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrinter" }
        "401": { $ref: "#/components/responses/Error" }
  /printers/{printer_set}:
    parameters:
      - $ref: "#/components/parameters/PrinterSet"
    get:
      summary: Get a set of PrintNode-compatible printers
      tags: [PrintNode Compatibility]
      operationId: compatibilityGetPrinters
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Sorted, deduplicated printer set.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrinter" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printjobs:
    post:
      summary: Create a PrintNode-compatible print job
      tags: [PrintNode Compatibility]
      operationId: compatibilityCreatePrintJob
      security: [{ compatibilityBasic: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatibilityCreatePrintJob"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CompatibilityCreatePrintJob"
      responses:
        "201":
          description: Numeric compatibility job ID.
          content:
            application/json:
              schema: { type: integer, minimum: 1 }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      summary: List PrintNode-compatible print jobs
      tags: [PrintNode Compatibility]
      operationId: compatibilityListPrintJobs
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Print jobs in the authenticated environment.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel all eligible pre-delivery print jobs
      tags: [PrintNode Compatibility]
      operationId: compatibilityCancelPrintJobs
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CompatibilityCancelledIds"
        "401": { $ref: "#/components/responses/Error" }
  /printjobs/{job_set}:
    parameters:
      - $ref: "#/components/parameters/JobSet"
    get:
      summary: Get a set of PrintNode-compatible print jobs
      tags: [PrintNode Compatibility]
      operationId: compatibilityGetPrintJobs
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Sorted, deduplicated job set.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJob" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel an eligible set of pre-delivery print jobs
      tags: [PrintNode Compatibility]
      operationId: compatibilityCancelPrintJobSet
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CompatibilityCancelledIds"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printjobs/states:
    get:
      summary: List PrintNode-compatible job states
      tags: [PrintNode Compatibility]
      operationId: compatibilityListPrintJobStates
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: States for the newest 500 jobs in the authenticated environment.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJobState" }
        "401": { $ref: "#/components/responses/Error" }
  /printjobs/{job_set}/states:
    parameters:
      - $ref: "#/components/parameters/JobSet"
    get:
      summary: Get PrintNode-compatible states for a job set
      tags: [PrintNode Compatibility]
      operationId: compatibilityGetPrintJobStates
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: States for the requested job set.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJobState" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printers/{printer_set}/printjobs:
    parameters:
      - $ref: "#/components/parameters/PrinterSet"
    get:
      summary: List print jobs for a printer set
      tags: [PrintNode Compatibility]
      operationId: compatibilityListPrinterPrintJobs
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Matching print jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJob" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel eligible pre-delivery jobs for a printer set
      tags: [PrintNode Compatibility]
      operationId: compatibilityCancelPrinterPrintJobs
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CompatibilityCancelledIds"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printers/{printer_set}/printjobs/{job_set}:
    parameters:
      - $ref: "#/components/parameters/PrinterSet"
      - $ref: "#/components/parameters/JobSet"
    get:
      summary: Intersect printer and print-job sets
      tags: [PrintNode Compatibility]
      operationId: compatibilityGetPrinterPrintJobs
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Matching print jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJob" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel the eligible intersection of printer and print-job sets
      tags: [PrintNode Compatibility]
      operationId: compatibilityCancelPrinterPrintJobSet
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CompatibilityCancelledIds"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/health:
    get:
      summary: Check process health
      security: []
      operationId: health
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/ready:
    get:
      summary: Check dependency readiness
      security: []
      operationId: ready
      responses:
        "200":
          description: Required dependencies and migrations are ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /v1/api-keys:
    get:
      summary: List API key metadata for the current environment
      tags: [API Keys]
      operationId: listApiKeys
      responses:
        "200":
          description: API key metadata. Secrets and password hashes are never returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create an API key
      description: Requested scopes must be a subset of the authenticated caller's scopes.
      tags: [API Keys]
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: API key created. The plaintext secret is returned exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Revoke an API key
      description: Revocation is idempotent. The key record is retained and never hard-deleted.
      tags: [API Keys]
      operationId: revokeApiKey
      responses:
        "200":
          description: Revoked API key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/jobs:
    post:
      summary: Register a print job
      tags: [Jobs]
      operationId: createJob
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJob"
      responses:
        "201":
          description: Job registered durably.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    get:
      summary: List print jobs
      tags: [Jobs]
      operationId: listJobs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Cursor-paginated jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Get a print job
      tags: [Jobs]
      operationId: getJob
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: List immutable job events
      tags: [Jobs, Events]
      operationId: listJobEvents
      responses:
        "200":
          description: Immutable event sequence.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobEvent"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Request job cancellation
      tags: [Jobs]
      operationId: cancelJob
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/printers:
    get:
      summary: List printers
      tags: [Printers]
      operationId: listPrinters
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Printers visible in the active environment.
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Printer"
                  next_cursor:
                    type: [string, "null"]
                  has_more:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/agents:
    get:
      summary: List agents
      tags: [Agents]
      operationId: listAgents
      responses:
        "200":
          description: Agents visible in the active environment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/agent-enrolments:
    post:
      summary: Create a single-use agent enrolment
      tags: [Agents]
      operationId: createAgentEnrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                expires_in_seconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
                  default: 600
      responses:
        "201":
          description: Single-use enrolment token. The token is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expires_at]
                properties:
                  id:
                    type: string
                  token:
                    type: string
                    pattern: ^spl_enr_
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/agents/enrol:
    post:
      summary: Consume a single-use enrolment and register an agent key
      tags: [Agents]
      operationId: enrolAgent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolRequest"
      responses:
        "201":
          description: Agent enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/uploads:
    post:
      summary: Create a content upload
      tags: [Jobs]
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpload"
      responses:
        "201":
          description: Pending server-proxy upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/uploads/{upload_id}/content:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    put:
      summary: Upload content through the Spool server
      tags: [Jobs]
      operationId: putUploadContent
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              contentEncoding: base64
          application/pdf:
            schema:
              type: string
              contentMediaType: application/pdf
              contentEncoding: base64
      responses:
        "200":
          description: Upload verified and completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      summary: Verify and complete a directly stored upload
      tags: [Jobs]
      operationId: completeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, byte_length]
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                byte_length:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 52428800
      responses:
        "200":
          description: Upload verified and completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/events/stream:
    get:
      summary: Stream environment events
      tags: [Events]
      operationId: streamEvents
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: SSE stream with resumable event identifiers.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/webhooks:
    get:
      summary: List webhook endpoints
      tags: [Webhooks]
      operationId: listWebhooks
      responses:
        "200":
          description: Webhook endpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a webhook endpoint
      tags: [Webhooks]
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        "201":
          description: Created webhook. The signing secret is shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Webhook"
                  - type: object
                    required: [secret]
                    properties:
                      secret:
                        type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/webhooks/{webhook_id}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    delete:
      summary: Delete a webhook endpoint
      tags: [Webhooks]
      operationId: deleteWebhook
      responses:
        "204":
          description: Webhook deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/webhooks/{webhook_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      summary: List webhook delivery attempts
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      responses:
        "200":
          description: Most recent delivery records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/webhook-deliveries/{delivery_id}/replay:
    parameters:
      - $ref: "#/components/parameters/DeliveryId"
    post:
      summary: Replay a webhook delivery
      tags: [Webhooks]
      operationId: replayWebhookDelivery
      responses:
        "202":
          description: Delivery scheduled for replay.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/agent/sync:
    post:
      summary: Synchronize agent health, printers, events, and job offers
      tags: [Agents]
      operationId: syncAgent
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSyncRequest"
      responses:
        "200":
          description: Commands and leased job candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSyncResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/accept:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Durably accept a leased job
      tags: [Agents, Jobs]
      operationId: acceptAgentJob
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAcceptRequest"
      responses:
        "200":
          description: Job accepted by the local queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAcceptResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/lease:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Renew an active job lease
      tags: [Agents, Jobs]
      operationId: renewAgentLease
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseCapability"
      responses:
        "200":
          description: Lease renewed.
          content:
            application/json:
              schema:
                type: object
                required: [lease_expires_at]
                properties:
                  lease_expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/release:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Release an active job lease
      tags: [Agents, Jobs]
      operationId: releaseAgentLease
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/LeaseCapability"
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      minLength: 1
      responses:
        "204":
          description: Lease released.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/content:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/LeaseIdHeader"
      - $ref: "#/components/parameters/LeaseTokenHeader"
    get:
      summary: Download uploaded job content under an active lease
      tags: [Agents, Jobs]
      operationId: downloadAgentJobContent
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      responses:
        "200":
          description: Original PDF or RAW bytes.
          headers:
            Digest:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
                contentEncoding: base64
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
                contentEncoding: base64
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  headers:
    RequestId:
      description: Request correlation ID used by response bodies and structured completion logs.
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: Spool API key or OIDC JWT
      description: API keys are scope-limited. OIDC JWTs require issuer, expiry, organization, permissions, and either audience or an exact configured claim/value application binding.
    compatibilityBasic:
      type: http
      scheme: basic
      description: Spool compatibility API key as the username with an empty password.
    agentId:
      type: apiKey
      in: header
      name: x-spool-agent-id
    agentTimestamp:
      type: apiKey
      in: header
      name: x-spool-timestamp
    agentNonce:
      type: apiKey
      in: header
      name: x-spool-nonce
    agentBodyDigest:
      type: apiKey
      in: header
      name: x-spool-body-sha256
    agentSignature:
      type: apiKey
      in: header
      name: x-spool-signature
  parameters:
    CompatibilityLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    CompatibilityDirection:
      name: dir
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: desc }
    CompatibilityAfter:
      name: after
      in: query
      required: false
      description: Exclusive positive integer compatibility-ID cursor. Printer and job collections are bounded to the newest 500 hydrated records in V1.
      schema: { type: integer, minimum: 1 }
    ComputerSet:
      name: computer_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    PrinterSet:
      name: printer_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    JobSet:
      name: job_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 255
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^job_[0-9A-HJKMNP-TV-Z]{26}$
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^upl_[0-9A-HJKMNP-TV-Z]{26}$
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whk_[0-9A-HJKMNP-TV-Z]{26}$
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whd_[0-9A-HJKMNP-TV-Z]{26}$
    LeaseIdHeader:
      name: x-spool-lease-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    LeaseTokenHeader:
      name: x-spool-lease-token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    After:
      name: after
      in: query
      schema:
        type: string
  responses:
    CompatibilityCancelledIds:
      description: Numeric IDs successfully cancelled before durable agent acceptance. Unqualified collection deletion examines at most the newest 500 jobs in V1.
      content:
        application/json:
          schema:
            type: array
            items: { type: integer, minimum: 1 }
    Error:
      description: Request failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    CompatibilityWhoAmI:
      type: object
      required: [id, email, canCreateSubAccounts, credits, numComputers, totalPrints, versions]
      properties:
        id: { type: integer, minimum: 1 }
        email: { type: string, format: email }
        canCreateSubAccounts: { type: boolean }
        credits: { type: integer }
        numComputers: { type: integer, minimum: 0 }
        totalPrints: { type: integer, minimum: 0 }
        versions:
          type: array
          items: { type: string }
    CompatibilityComputer:
      type: object
      required: [id, name, state, version]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        state: { type: string, enum: [connected, disconnected] }
        version: { type: string }
    CompatibilityPrinter:
      type: object
      required: [id, name, computer, default, state, capabilities]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        computer:
          type: object
          required: [id]
          properties:
            id: { type: integer, minimum: 1 }
        default: { type: boolean }
        state: { type: string, enum: [online, offline] }
        capabilities: { type: object, additionalProperties: true }
    CompatibilityPrintJob:
      type: object
      required: [id, printer, title, contentType, state, createTimestamp]
      properties:
        id: { type: integer, minimum: 1 }
        printer:
          type: object
          required: [id]
          properties:
            id: { type: integer, minimum: 1 }
        title: { type: string }
        contentType: { type: string, enum: [pdf, raw] }
        source: { type: [string, "null"] }
        state: { type: string, enum: [new, sent_to_client, done, error, expired] }
        createTimestamp: { type: integer }
    CompatibilityPrintJobState:
      type: object
      required: [id, state, age]
      properties:
        id: { type: integer, minimum: 1 }
        state: { type: string, enum: [new, sent_to_client, done, error, expired] }
        age: { type: integer, minimum: 0 }
    CompatibilityCreatePrintJob:
      type: object
      required: [printerId, title, contentType, content]
      properties:
        printerId: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1 }
        contentType:
          type: string
          enum: [pdf_base64, raw_base64, pdf_uri, raw_uri]
        content: { type: string }
        source: { type: string }
        qty: { type: integer, minimum: 1, maximum: 100, default: 1 }
        expireAfter: { type: integer, minimum: 1, maximum: 1209600 }
        options: { type: object, additionalProperties: true }
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    ApiKeyScope:
      type: string
      enum:
        - api_keys_read
        - api_keys_write
        - agents_read
        - agents_write
        - printers_read
        - printers_write
        - jobs_read
        - jobs_write
        - webhooks_read
        - webhooks_write
        - usage_read
        - audit_read
    CreateApiKey:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Optional expiry no more than 365 days in the future.
    ApiKey:
      type: object
      required:
        [id, name, lookup_prefix, scopes, expires_at, last_used_at, revoked_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lookup_prefix:
          type: string
          description: Non-secret prefix suitable for identifying the key.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              writeOnly: true
              description: Plaintext API key returned only by the create operation.
    Sha256:
      type: string
      pattern: ^[0-9a-fA-F]{64}$
    CreateUpload:
      type: object
      additionalProperties: false
      required: [media_type, byte_length, sha256]
      properties:
        media_type:
          type: string
          enum: [application/pdf, application/octet-stream]
        byte_length:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
        sha256:
          $ref: "#/components/schemas/Sha256"
    Upload:
      type: object
      required:
        [id, object_key, media_type, expected_sha256, expected_bytes, state, expires_at]
      properties:
        id:
          type: string
        object_key:
          type: string
        media_type:
          type: string
          enum: [application/pdf, application/octet-stream]
        expected_sha256:
          $ref: "#/components/schemas/Sha256"
        expected_bytes:
          type: integer
          format: int64
        state:
          type: string
          enum: [pending, complete, expired]
        expires_at:
          type: string
          format: date-time
    UploadResponse:
      allOf:
        - $ref: "#/components/schemas/Upload"
        - type: object
          required: [upload_url]
          properties:
            upload_url:
              type: [string, "null"]
    EnrolRequest:
      type: object
      additionalProperties: false
      required:
        [token, public_key, name, hostname, platform, architecture, installation_mode, agent_version, protocol_version]
      properties:
        token:
          type: string
          pattern: ^spl_enr_
        public_key:
          type: string
          description: Base64url or standard Base64 Ed25519 public key (32 decoded bytes).
        name:
          type: string
        hostname:
          type: string
        platform:
          type: string
        architecture:
          type: string
        installation_mode:
          type: string
          enum: [machine, user, local]
        agent_version:
          type: string
        protocol_version:
          type: integer
          enum: [1]
    EnrolResponse:
      type: object
      required: [agent_id, environment, server_time, sync_after_ms]
      properties:
        agent_id:
          type: string
        environment:
          type: string
        server_time:
          type: string
          format: date-time
        sync_after_ms:
          type: integer
          format: int64
          minimum: 0
    QueueSnapshot:
      type: object
      additionalProperties: false
      required: [queued_jobs, active_jobs, content_bytes, accepts_jobs]
      properties:
        queued_jobs:
          type: integer
          minimum: 0
        active_jobs:
          type: integer
          minimum: 0
        content_bytes:
          type: integer
          format: int64
          minimum: 0
        accepts_jobs:
          type: boolean
    AgentHealth:
      type: object
      additionalProperties: false
      required:
        [started_at, observed_at, sqlite_integrity_ok, executor_crashes, last_error_code]
      properties:
        started_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        sqlite_integrity_ok:
          type: boolean
        executor_crashes:
          type: integer
          format: int64
          minimum: 0
        last_error_code:
          type: [string, "null"]
    PrinterSnapshot:
      type: object
      additionalProperties: false
      required: [id, native_id, name, state, is_default, capabilities]
      properties:
        id:
          type: string
        native_id:
          type: string
        name:
          type: string
        state:
          $ref: "#/components/schemas/PrinterState"
        is_default:
          type: boolean
        capabilities:
          type: object
    AgentSyncRequest:
      type: object
      additionalProperties: false
      required:
        [agent_id, protocol_version, agent_version, printer_revision, acknowledged_command_cursor, event_cursor, queue, health, printers, events]
      properties:
        agent_id:
          type: string
        protocol_version:
          type: integer
          enum: [1]
        agent_version:
          type: string
        printer_revision:
          type: integer
          format: int64
          minimum: 0
        acknowledged_command_cursor:
          type: [string, "null"]
        event_cursor:
          type: [string, "null"]
        queue:
          $ref: "#/components/schemas/QueueSnapshot"
        health:
          $ref: "#/components/schemas/AgentHealth"
        printers:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PrinterSnapshot"
        events:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/JobEvent"
    AgentSyncResponse:
      type: object
      required:
        [server_time, acknowledged_event_cursor, command_cursor, commands, candidate_jobs, next_poll_after_ms]
      properties:
        server_time:
          type: string
          format: date-time
        acknowledged_event_cursor:
          type: [string, "null"]
        command_cursor:
          type: [string, "null"]
        commands:
          type: array
          items:
            type: object
        candidate_jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobOffer"
        next_poll_after_ms:
          type: integer
          format: int64
          minimum: 0
    JobOffer:
      type: object
      required: [job, lease_id, lease_token, lease_expires_at, content]
      properties:
        job:
          $ref: "#/components/schemas/AgentJob"
        lease_id:
          type: string
          format: uuid
        lease_token:
          type: string
          writeOnly: true
        lease_expires_at:
          type: string
          format: date-time
        content:
          $ref: "#/components/schemas/ContentDescriptor"
    ContentDescriptor:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, url, sha256, bytes]
          properties:
            type:
              const: download
            url:
              type: string
            sha256:
              $ref: "#/components/schemas/Sha256"
            bytes:
              type: integer
              format: int64
              minimum: 0
        - type: object
          additionalProperties: false
          required: [type, data, sha256, bytes]
          properties:
            type:
              const: inline_base64
            data:
              type: string
              contentEncoding: base64
            sha256:
              oneOf:
                - $ref: "#/components/schemas/Sha256"
                - type: "null"
            bytes:
              type: [integer, "null"]
              format: int64
              minimum: 0
        - type: object
          additionalProperties: false
          required: [type, uri, authentication, sha256, bytes]
          properties:
            type:
              const: uri
            uri:
              type: string
              format: uri
            authentication:
              type: "null"
            sha256:
              oneOf:
                - $ref: "#/components/schemas/Sha256"
                - type: "null"
            bytes:
              type: [integer, "null"]
              format: int64
              minimum: 0
    AgentJob:
      type: object
      required:
        [id, workspace_id, environment_id, printer_id, title, source, content_kind, content, options, deliveries, state, created_at, expires_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        environment_id:
          type: string
        printer_id:
          type: string
        title:
          type: string
        source:
          type: [string, "null"]
        content_kind:
          type: string
          enum: [pdf, raw]
        content:
          type: object
        options:
          $ref: "#/components/schemas/JobOptions"
        deliveries:
          type: integer
        state:
          $ref: "#/components/schemas/JobState"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    LeaseCapability:
      type: object
      additionalProperties: false
      required: [lease_id, lease_token]
      properties:
        lease_id:
          type: string
          format: uuid
        lease_token:
          type: string
          writeOnly: true
    AgentAcceptRequest:
      allOf:
        - $ref: "#/components/schemas/LeaseCapability"
        - type: object
          required: [content_sha256, local_sequence]
          properties:
            content_sha256:
              $ref: "#/components/schemas/Sha256"
            local_sequence:
              type: integer
              format: int64
              minimum: 0
    AgentAcceptResponse:
      type: object
      required: [accepted_at, state]
      properties:
        accepted_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/JobState"
    CreateJob:
      type: object
      additionalProperties: false
      required: [printer_id, title, content_type, content]
      properties:
        printer_id:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 255
        source:
          type: [string, "null"]
          maxLength: 255
        content_type:
          type: string
          enum: [pdf, raw]
        content:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, upload_id]
              properties:
                type:
                  const: upload
                upload_id:
                  type: string
            - type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type:
                  const: base64
                data:
                  type: string
                  contentEncoding: base64
            - type: object
              additionalProperties: false
              required: [type, uri]
              properties:
                type:
                  const: uri
                uri:
                  type: string
                  format: uri
        options:
          $ref: "#/components/schemas/JobOptions"
        deliveries:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        expire_after_seconds:
          type: integer
          minimum: 1
          maximum: 1209600
          default: 1209600
        metadata:
          type: object
          additionalProperties:
            type: string
    JobOptions:
      type: object
      additionalProperties: false
      properties:
        bin:
          type: string
        collate:
          type: boolean
        color:
          type: boolean
        copies:
          type: integer
          minimum: 1
        dpi:
          type: string
        duplex:
          enum: [one-sided, long-edge, short-edge]
        fit_to_page:
          type: boolean
        media:
          type: string
        nup:
          type: integer
          minimum: 1
        pages:
          type: string
        paper:
          type: string
        rotate:
          type: integer
          enum: [0, 90, 180, 270]
        native_options:
          type: object
          description: Driver-native option selections keyed by the stable driver option name.
          additionalProperties:
            type: string
    Job:
      type: object
      required:
        [id, printer_id, title, content_type, deliveries, state, created_at, expires_at]
      properties:
        id:
          type: string
        printer_id:
          type: string
        title:
          type: string
        source:
          type: [string, "null"]
        content_type:
          enum: [pdf, raw]
        deliveries:
          type: integer
        state:
          $ref: "#/components/schemas/JobState"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    JobPage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    JobState:
      type: string
      enum:
        - registered
        - content_pending
        - waiting_for_agent
        - agent_downloading
        - agent_accepted
        - queued_local
        - preparing
        - rendering
        - spool_intent
        - accepted_by_spooler
        - spooling
        - printing
        - blocked
        - completed_reported
        - delivery_uncertain
        - cancel_requested
        - cancelled
        - expired
        - failed_retryable
        - failed_terminal
    JobEvent:
      type: object
      required: [id, job_id, sequence, state, occurred_at]
      properties:
        id:
          type: string
        job_id:
          type: string
        sequence:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/JobState"
        reason:
          type: [string, "null"]
        message:
          type: [string, "null"]
        occurred_at:
          type: string
          format: date-time
    Printer:
      type: object
      required:
        [
          id,
          agent_id,
          name,
          state,
          capabilities,
          capability_revision,
          native_options,
          profiles,
          updated_at,
        ]
      properties:
        id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        state:
          $ref: "#/components/schemas/PrinterState"
        capabilities:
          $ref: "#/components/schemas/PrinterCapabilities"
        capability_revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic revision of the synced driver capability snapshot.
        native_options:
          type: object
          description: Complete driver-native option definitions keyed by stable driver option name.
          additionalProperties:
            $ref: "#/components/schemas/NativePrinterOption"
        profiles:
          type: array
          description: Named, immutable printer option snapshots synced from the agent.
          items:
            $ref: "#/components/schemas/PrinterProfileSnapshot"
        updated_at:
          type: string
          format: date-time
    PrinterCapabilities:
      type: object
      additionalProperties: false
      required:
        [
          bins,
          collate,
          color,
          copies,
          dpis,
          duplex,
          extent,
          medias,
          nup,
          papers,
          printrate,
          supports_custom_paper_size,
        ]
      properties:
        bins:
          type: array
          items:
            type: string
        collate:
          type: boolean
        color:
          type: boolean
        copies:
          type: integer
          minimum: 0
        dpis:
          type: array
          items:
            type: string
        duplex:
          type: boolean
        extent:
          type: array
          items:
            $ref: "#/components/schemas/PrinterExtent"
        medias:
          type: array
          items:
            type: string
        nup:
          type: array
          items:
            type: integer
            minimum: 0
        papers:
          type: object
          description: Paper dimensions keyed by driver paper name.
          additionalProperties:
            $ref: "#/components/schemas/PrinterPaperDimensions"
        printrate:
          anyOf:
            - $ref: "#/components/schemas/PrintRate"
            - type: "null"
        supports_custom_paper_size:
          type: boolean
    PrinterExtent:
      type: array
      description: A two-dimensional driver-reported printer extent.
      prefixItems:
        - type: integer
          minimum: 0
        - type: integer
          minimum: 0
      items: false
      minItems: 2
      maxItems: 2
    PrinterPaperDimensions:
      type: array
      description: Optional driver-reported width and height.
      prefixItems:
        - type: [integer, "null"]
          minimum: 0
        - type: [integer, "null"]
          minimum: 0
      items: false
      minItems: 2
      maxItems: 2
    PrintRate:
      type: object
      additionalProperties: false
      required: [unit, rate]
      properties:
        unit:
          type: string
          enum: [ppm, ipm, lmp, cpm]
        rate:
          type: number
          format: float
    NativePrinterOption:
      type: object
      additionalProperties: false
      required: [display_name, default_choice, selected_choice, choices]
      properties:
        display_name:
          type: string
        default_choice:
          type: [string, "null"]
        selected_choice:
          type: [string, "null"]
        choices:
          type: array
          items:
            $ref: "#/components/schemas/NativePrinterChoice"
    NativePrinterChoice:
      type: object
      additionalProperties: false
      required: [value, display_name]
      properties:
        value:
          type: string
        display_name:
          type: string
    PrinterProfileSnapshot:
      type: object
      additionalProperties: false
      required: [profile_id, revision, name, is_default, options]
      properties:
        profile_id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
        is_default:
          type: boolean
        options:
          $ref: "#/components/schemas/JobOptions"
        status:
          type: string
          enum:
            [
              draft,
              capturing,
              ready,
              needs_test,
              stale,
              driver_mismatch,
              destination_missing,
              dependency_missing,
              interactive_only,
              invalid,
              retired,
            ]
        native_kind:
          type: string
          enum:
            [
              portable_options,
              cups_options,
              cups_instance,
              macos_printcore,
              windows_devmode,
              windows_printticket,
            ]
        native_digest:
          type: [string, "null"]
          description: Digest of the node-local opaque native configuration. The native blob is never returned.
        driver_fingerprint:
          anyOf:
            - $ref: "#/components/schemas/DriverFingerprint"
            - type: "null"
        summary:
          $ref: "#/components/schemas/PrintProfileSummary"
        stock_id:
          type: [string, "null"]
        safe_overrides:
          type: array
          items:
            type: string
        last_validated_at:
          type: [string, "null"]
          format: date-time
        last_test_job_id:
          type: [string, "null"]
        published:
          type: boolean
    DriverFingerprint:
      type: object
      additionalProperties: false
      required:
        [
          platform,
          driver_name,
          driver_version,
          architecture,
          native_queue_id,
          device_fingerprint,
        ]
      properties:
        platform:
          type: string
        driver_name:
          type: string
        driver_version:
          type: [string, "null"]
        architecture:
          type: [string, "null"]
        native_queue_id:
          type: string
        device_fingerprint:
          type: [string, "null"]
    PrintProfileSummary:
      type: object
      additionalProperties: false
      properties:
        paper:
          type: [string, "null"]
        dimensions_mm:
          type: [array, "null"]
          prefixItems:
            - type: number
            - type: number
          items: false
          minItems: 2
          maxItems: 2
        source:
          type: [string, "null"]
        media:
          type: [string, "null"]
        color:
          type: [string, "null"]
        duplex:
          type: [string, "null"]
        resolution:
          type: [string, "null"]
        copies:
          type: [integer, "null"]
          minimum: 0
        native:
          type: object
          additionalProperties:
            type: string
    PrinterState:
      type: string
      enum: [online, offline, paused, busy, paper_out, error, unknown]
    Agent:
      type: object
      required: [id, name, platform, state, version, last_seen_at]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        state:
          enum: [connected, disconnected, paused, degraded]
        version:
          type: string
        last_seen_at:
          type: string
          format: date-time
    Webhook:
      type: object
      required: [id, url, events, enabled, created_at]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      required:
        [id, event_id, attempt, next_attempt_at, response_status, delivered_at, dead_lettered_at]
      properties:
        id:
          type: string
        event_id:
          type: string
        attempt:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        response_status:
          type: [integer, "null"]
        delivered_at:
          type: [string, "null"]
          format: date-time
        dead_lettered_at:
          type: [string, "null"]
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            retryable:
              type: boolean
            details:
              type: object
