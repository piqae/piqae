openapi: 3.1.0
info:
  title: Spool API
  version: 1.0.0
  description: Durable local and remote printing API.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://api.example.invalid
    description: Replace with the deployment API origin.
security:
  - bearer: []
tags:
  - name: Jobs
    description: Register and observe durable print jobs.
  - name: Printers
    description: Inspect installed printer queues and driver capabilities.
  - name: Agents
    description: Enrol and observe local Spool agents.
  - name: Events
    description: Consume immutable state changes.
  - name: Webhooks
    description: Deliver signed event notifications.
paths:
  /v1/health:
    get:
      summary: Check process health
      security: []
      operationId: health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/ready:
    get:
      summary: Check dependency readiness
      security: []
      operationId: ready
      responses:
        "200":
          description: Required dependencies and migrations are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /v1/jobs:
    post:
      summary: Register a print job
      tags: [Jobs]
      operationId: createJob
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJob"
      responses:
        "201":
          description: Job registered durably.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    get:
      summary: List print jobs
      tags: [Jobs]
      operationId: listJobs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Cursor-paginated jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Get a print job
      tags: [Jobs]
      operationId: getJob
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: List immutable job events
      tags: [Jobs, Events]
      operationId: listJobEvents
      responses:
        "200":
          description: Immutable event sequence.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobEvent"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Request job cancellation
      tags: [Jobs]
      operationId: cancelJob
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/printers:
    get:
      summary: List printers
      tags: [Printers]
      operationId: listPrinters
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Printers visible in the active environment.
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Printer"
                  next_cursor:
                    type: [string, "null"]
                  has_more:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/agents:
    get:
      summary: List agents
      tags: [Agents]
      operationId: listAgents
      responses:
        "200":
          description: Agents visible in the active environment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/agent-enrolments:
    post:
      summary: Create a single-use agent enrolment
      tags: [Agents]
      operationId: createAgentEnrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                expires_in_seconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
                  default: 600
      responses:
        "201":
          description: Single-use enrolment token. The token is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expires_at]
                properties:
                  id:
                    type: string
                  token:
                    type: string
                    pattern: ^spl_enr_
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/agents/enrol:
    post:
      summary: Consume a single-use enrolment and register an agent key
      tags: [Agents]
      operationId: enrolAgent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolRequest"
      responses:
        "201":
          description: Agent enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/uploads:
    post:
      summary: Create a content upload
      tags: [Jobs]
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpload"
      responses:
        "201":
          description: Pending server-proxy upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/uploads/{upload_id}/content:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    put:
      summary: Upload content through the Spool server
      tags: [Jobs]
      operationId: putUploadContent
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              contentEncoding: base64
          application/pdf:
            schema:
              type: string
              contentMediaType: application/pdf
              contentEncoding: base64
      responses:
        "200":
          description: Upload verified and completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      summary: Verify and complete a directly stored upload
      tags: [Jobs]
      operationId: completeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, byte_length]
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                byte_length:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 52428800
      responses:
        "200":
          description: Upload verified and completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/events/stream:
    get:
      summary: Stream environment events
      tags: [Events]
      operationId: streamEvents
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: SSE stream with resumable event identifiers.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/webhooks:
    get:
      summary: List webhook endpoints
      tags: [Webhooks]
      operationId: listWebhooks
      responses:
        "200":
          description: Webhook endpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a webhook endpoint
      tags: [Webhooks]
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        "201":
          description: Created webhook. The signing secret is shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Webhook"
                  - type: object
                    required: [secret]
                    properties:
                      secret:
                        type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/webhooks/{webhook_id}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    delete:
      summary: Delete a webhook endpoint
      tags: [Webhooks]
      operationId: deleteWebhook
      responses:
        "204":
          description: Webhook deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/webhooks/{webhook_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      summary: List webhook delivery attempts
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      responses:
        "200":
          description: Most recent delivery records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/webhook-deliveries/{delivery_id}/replay:
    parameters:
      - $ref: "#/components/parameters/DeliveryId"
    post:
      summary: Replay a webhook delivery
      tags: [Webhooks]
      operationId: replayWebhookDelivery
      responses:
        "202":
          description: Delivery scheduled for replay.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/agent/sync:
    post:
      summary: Synchronize agent health, printers, events, and job offers
      tags: [Agents]
      operationId: syncAgent
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSyncRequest"
      responses:
        "200":
          description: Commands and leased job candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSyncResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/accept:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Durably accept a leased job
      tags: [Agents, Jobs]
      operationId: acceptAgentJob
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAcceptRequest"
      responses:
        "200":
          description: Job accepted by the local queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAcceptResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/lease:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Renew an active job lease
      tags: [Agents, Jobs]
      operationId: renewAgentLease
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseCapability"
      responses:
        "200":
          description: Lease renewed.
          content:
            application/json:
              schema:
                type: object
                required: [lease_expires_at]
                properties:
                  lease_expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/release:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Release an active job lease
      tags: [Agents, Jobs]
      operationId: releaseAgentLease
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/LeaseCapability"
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      minLength: 1
      responses:
        "204":
          description: Lease released.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/content:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/LeaseIdHeader"
      - $ref: "#/components/parameters/LeaseTokenHeader"
    get:
      summary: Download uploaded job content under an active lease
      tags: [Agents, Jobs]
      operationId: downloadAgentJobContent
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      responses:
        "200":
          description: Original PDF or RAW bytes.
          headers:
            Digest:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
                contentEncoding: base64
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
                contentEncoding: base64
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: Spool API key or OIDC JWT
      description: API keys are scope-limited. OIDC JWTs require issuer, expiry, organization, permissions, and either audience or an exact configured claim/value application binding.
    agentId:
      type: apiKey
      in: header
      name: x-spool-agent-id
    agentTimestamp:
      type: apiKey
      in: header
      name: x-spool-timestamp
    agentNonce:
      type: apiKey
      in: header
      name: x-spool-nonce
    agentBodyDigest:
      type: apiKey
      in: header
      name: x-spool-body-sha256
    agentSignature:
      type: apiKey
      in: header
      name: x-spool-signature
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 255
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^job_[0-9A-HJKMNP-TV-Z]{26}$
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^upl_[0-9A-HJKMNP-TV-Z]{26}$
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whk_[0-9A-HJKMNP-TV-Z]{26}$
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whd_[0-9A-HJKMNP-TV-Z]{26}$
    LeaseIdHeader:
      name: x-spool-lease-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    LeaseTokenHeader:
      name: x-spool-lease-token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    After:
      name: after
      in: query
      schema:
        type: string
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    Sha256:
      type: string
      pattern: ^[0-9a-fA-F]{64}$
    CreateUpload:
      type: object
      additionalProperties: false
      required: [media_type, byte_length, sha256]
      properties:
        media_type:
          type: string
          enum: [application/pdf, application/octet-stream]
        byte_length:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
        sha256:
          $ref: "#/components/schemas/Sha256"
    Upload:
      type: object
      required:
        [id, object_key, media_type, expected_sha256, expected_bytes, state, expires_at]
      properties:
        id:
          type: string
        object_key:
          type: string
        media_type:
          type: string
          enum: [application/pdf, application/octet-stream]
        expected_sha256:
          $ref: "#/components/schemas/Sha256"
        expected_bytes:
          type: integer
          format: int64
        state:
          type: string
          enum: [pending, complete, expired]
        expires_at:
          type: string
          format: date-time
    UploadResponse:
      allOf:
        - $ref: "#/components/schemas/Upload"
        - type: object
          required: [upload_url]
          properties:
            upload_url:
              type: [string, "null"]
    EnrolRequest:
      type: object
      additionalProperties: false
      required:
        [token, public_key, name, hostname, platform, architecture, installation_mode, agent_version, protocol_version]
      properties:
        token:
          type: string
          pattern: ^spl_enr_
        public_key:
          type: string
          description: Base64url or standard Base64 Ed25519 public key (32 decoded bytes).
        name:
          type: string
        hostname:
          type: string
        platform:
          type: string
        architecture:
          type: string
        installation_mode:
          type: string
          enum: [machine, user, local]
        agent_version:
          type: string
        protocol_version:
          type: integer
          enum: [1]
    EnrolResponse:
      type: object
      required: [agent_id, environment, server_time, sync_after_ms]
      properties:
        agent_id:
          type: string
        environment:
          type: string
        server_time:
          type: string
          format: date-time
        sync_after_ms:
          type: integer
          format: int64
          minimum: 0
    QueueSnapshot:
      type: object
      additionalProperties: false
      required: [queued_jobs, active_jobs, content_bytes, accepts_jobs]
      properties:
        queued_jobs:
          type: integer
          minimum: 0
        active_jobs:
          type: integer
          minimum: 0
        content_bytes:
          type: integer
          format: int64
          minimum: 0
        accepts_jobs:
          type: boolean
    AgentHealth:
      type: object
      additionalProperties: false
      required:
        [started_at, observed_at, sqlite_integrity_ok, executor_crashes, last_error_code]
      properties:
        started_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        sqlite_integrity_ok:
          type: boolean
        executor_crashes:
          type: integer
          format: int64
          minimum: 0
        last_error_code:
          type: [string, "null"]
    PrinterSnapshot:
      type: object
      additionalProperties: false
      required: [id, native_id, name, state, is_default, capabilities]
      properties:
        id:
          type: string
        native_id:
          type: string
        name:
          type: string
        state:
          $ref: "#/components/schemas/PrinterState"
        is_default:
          type: boolean
        capabilities:
          type: object
    AgentSyncRequest:
      type: object
      additionalProperties: false
      required:
        [agent_id, protocol_version, agent_version, printer_revision, acknowledged_command_cursor, event_cursor, queue, health, printers, events]
      properties:
        agent_id:
          type: string
        protocol_version:
          type: integer
          enum: [1]
        agent_version:
          type: string
        printer_revision:
          type: integer
          format: int64
          minimum: 0
        acknowledged_command_cursor:
          type: [string, "null"]
        event_cursor:
          type: [string, "null"]
        queue:
          $ref: "#/components/schemas/QueueSnapshot"
        health:
          $ref: "#/components/schemas/AgentHealth"
        printers:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PrinterSnapshot"
        events:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/JobEvent"
    AgentSyncResponse:
      type: object
      required:
        [server_time, acknowledged_event_cursor, command_cursor, commands, candidate_jobs, next_poll_after_ms]
      properties:
        server_time:
          type: string
          format: date-time
        acknowledged_event_cursor:
          type: [string, "null"]
        command_cursor:
          type: [string, "null"]
        commands:
          type: array
          items:
            type: object
        candidate_jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobOffer"
        next_poll_after_ms:
          type: integer
          format: int64
          minimum: 0
    JobOffer:
      type: object
      required: [job, lease_id, lease_token, lease_expires_at, content]
      properties:
        job:
          $ref: "#/components/schemas/AgentJob"
        lease_id:
          type: string
          format: uuid
        lease_token:
          type: string
          writeOnly: true
        lease_expires_at:
          type: string
          format: date-time
        content:
          $ref: "#/components/schemas/ContentDescriptor"
    ContentDescriptor:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, url, sha256, bytes]
          properties:
            type:
              const: download
            url:
              type: string
            sha256:
              $ref: "#/components/schemas/Sha256"
            bytes:
              type: integer
              format: int64
              minimum: 0
        - type: object
          additionalProperties: false
          required: [type, data, sha256, bytes]
          properties:
            type:
              const: inline_base64
            data:
              type: string
              contentEncoding: base64
            sha256:
              oneOf:
                - $ref: "#/components/schemas/Sha256"
                - type: "null"
            bytes:
              type: [integer, "null"]
              format: int64
              minimum: 0
        - type: object
          additionalProperties: false
          required: [type, uri, authentication, sha256, bytes]
          properties:
            type:
              const: uri
            uri:
              type: string
              format: uri
            authentication:
              type: "null"
            sha256:
              oneOf:
                - $ref: "#/components/schemas/Sha256"
                - type: "null"
            bytes:
              type: [integer, "null"]
              format: int64
              minimum: 0
    AgentJob:
      type: object
      required:
        [id, workspace_id, environment_id, printer_id, title, source, content_kind, content, options, deliveries, state, created_at, expires_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        environment_id:
          type: string
        printer_id:
          type: string
        title:
          type: string
        source:
          type: [string, "null"]
        content_kind:
          type: string
          enum: [pdf, raw]
        content:
          type: object
        options:
          $ref: "#/components/schemas/JobOptions"
        deliveries:
          type: integer
        state:
          $ref: "#/components/schemas/JobState"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    LeaseCapability:
      type: object
      additionalProperties: false
      required: [lease_id, lease_token]
      properties:
        lease_id:
          type: string
          format: uuid
        lease_token:
          type: string
          writeOnly: true
    AgentAcceptRequest:
      allOf:
        - $ref: "#/components/schemas/LeaseCapability"
        - type: object
          required: [content_sha256, local_sequence]
          properties:
            content_sha256:
              $ref: "#/components/schemas/Sha256"
            local_sequence:
              type: integer
              format: int64
              minimum: 0
    AgentAcceptResponse:
      type: object
      required: [accepted_at, state]
      properties:
        accepted_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/JobState"
    CreateJob:
      type: object
      additionalProperties: false
      required: [printer_id, title, content_type, content]
      properties:
        printer_id:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 255
        source:
          type: [string, "null"]
          maxLength: 255
        content_type:
          type: string
          enum: [pdf, raw]
        content:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, upload_id]
              properties:
                type:
                  const: upload
                upload_id:
                  type: string
            - type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type:
                  const: base64
                data:
                  type: string
                  contentEncoding: base64
            - type: object
              additionalProperties: false
              required: [type, uri]
              properties:
                type:
                  const: uri
                uri:
                  type: string
                  format: uri
        options:
          $ref: "#/components/schemas/JobOptions"
        deliveries:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        expire_after_seconds:
          type: integer
          minimum: 1
          maximum: 1209600
          default: 1209600
        metadata:
          type: object
          additionalProperties:
            type: string
    JobOptions:
      type: object
      additionalProperties: false
      properties:
        bin:
          type: string
        collate:
          type: boolean
        color:
          type: boolean
        copies:
          type: integer
          minimum: 1
        dpi:
          type: string
        duplex:
          enum: [one-sided, long-edge, short-edge]
        fit_to_page:
          type: boolean
        media:
          type: string
        nup:
          type: integer
          minimum: 1
        pages:
          type: string
        paper:
          type: string
        rotate:
          type: integer
          enum: [0, 90, 180, 270]
    Job:
      type: object
      required:
        [id, printer_id, title, content_type, deliveries, state, created_at, expires_at]
      properties:
        id:
          type: string
        printer_id:
          type: string
        title:
          type: string
        source:
          type: [string, "null"]
        content_type:
          enum: [pdf, raw]
        deliveries:
          type: integer
        state:
          $ref: "#/components/schemas/JobState"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    JobPage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    JobState:
      type: string
      enum:
        - registered
        - content_pending
        - waiting_for_agent
        - agent_downloading
        - agent_accepted
        - queued_local
        - preparing
        - rendering
        - spool_intent
        - accepted_by_spooler
        - spooling
        - printing
        - blocked
        - completed_reported
        - delivery_uncertain
        - cancel_requested
        - cancelled
        - expired
        - failed_retryable
        - failed_terminal
    JobEvent:
      type: object
      required: [id, job_id, sequence, state, occurred_at]
      properties:
        id:
          type: string
        job_id:
          type: string
        sequence:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/JobState"
        reason:
          type: [string, "null"]
        message:
          type: [string, "null"]
        occurred_at:
          type: string
          format: date-time
    Printer:
      type: object
      required: [id, agent_id, name, state, capabilities, updated_at]
      properties:
        id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        state:
          $ref: "#/components/schemas/PrinterState"
        capabilities:
          type: object
        updated_at:
          type: string
          format: date-time
    PrinterState:
      type: string
      enum: [online, offline, paused, busy, paper_out, error, unknown]
    Agent:
      type: object
      required: [id, name, platform, state, version, last_seen_at]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        state:
          enum: [connected, disconnected, paused, degraded]
        version:
          type: string
        last_seen_at:
          type: string
          format: date-time
    Webhook:
      type: object
      required: [id, url, events, enabled, created_at]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      required:
        [id, event_id, attempt, next_attempt_at, response_status, delivered_at, dead_lettered_at]
      properties:
        id:
          type: string
        event_id:
          type: string
        attempt:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        response_status:
          type: [integer, "null"]
        delivered_at:
          type: [string, "null"]
          format: date-time
        dead_lettered_at:
          type: [string, "null"]
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
