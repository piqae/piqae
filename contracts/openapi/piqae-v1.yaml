    ContentDescriptor:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, policy, render, fallback, fallback_allowed, decision_reason]
          properties:
            type: { const: business_document }
            policy: { $ref: "#/components/schemas/BusinessDocumentRenderPolicy" }
            render:
              type: object
              additionalProperties: false
              required: [renderer_abi, resource_abi, specification, input, resources, expected_pdf_sha256, expected_pdf_bytes]
              properties:
                renderer_abi: { type: string, const: piqae.business-document-pdf/v1 }
                resource_abi: { type: string, const: piqae.document-resources/v1 }
                specification: { $ref: "#/components/schemas/BusinessDocumentV1" }
                input: { type: object, additionalProperties: true }
                resources:
                  type: array
                  maxItems: 64
                  items: { $ref: "#/components/schemas/BusinessDocumentResourceDescriptor" }
                expected_pdf_sha256: { $ref: "#/components/schemas/Sha256Hex" }
                expected_pdf_bytes: { type: integer, format: int64, minimum: 1 }
            fallback: { $ref: "#/components/schemas/ContentDescriptor" }
            fallback_allowed: { type: boolean }
            decision_reason: { type: string, maxLength: 128 }
        - type: object
          additionalProperties: false
          required: [type, url, sha256, bytes]
          properties:
            type:
              const: download
            url:
              type: string
            sha256:
              $ref: "#/components/schemas/Sha256"
            bytes:
              type: integer
              format: int64
              minimum: 0
        - type: object
          additionalProperties: false
          required: [type, url, sha256, bytes, manifest]
          properties:
            type:
              const: encrypted_download
            url:
              type: string
            sha256:
              $ref: "#/components/schemas/Sha256"
            bytes:
              type: integer
              format: int64
              minimum: 0
            manifest:
              $ref: "#/components/schemas/EncryptedJobManifest"
        - type: object
          additionalProperties: false
          required: [type, data, sha256, bytes]
          properties:
            type:
              const: inline_base64
            data:
              type: string
              contentEncoding: base64
            sha256:
              oneOf:
                - $ref: "#/components/schemas/Sha256"
                - type: "null"
            bytes:
              type: [integer, "null"]
              format: int64
              minimum: 0
        - type: object
          additionalProperties: false
          required: [type, uri, authentication, sha256, bytes]
          properties:
            type:
              const: uri
            uri:
              type: string
              format: uri
            authentication:
              type: "null"
            sha256:
              oneOf:
                - $ref: "#/components/schemas/Sha256"
                - type: "null"
            bytes:
              type: [integer, "null"]
              format: int64
              minimum: 0
    AgentJob:
      type: object
      required:
        [id, workspace_id, environment_id, printer_id, title, source, content_kind, content, options, deliveries, state, created_at, expires_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        environment_id:
          type: string
        printer_id:
          type: string
        title:
          type: string
        source:
          type: [string, "null"]
        content_kind:
          type: string
          enum: [pdf, raw]
        content:
          type: object
        options:
          $ref: "#/components/schemas/JobOptions"
        deliveries:
          type: integer
        state:
          $ref: "#/components/schemas/JobState"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    LeaseCapability:
      type: object
      additionalProperties: false
      required: [lease_id, lease_token]
      properties:
        lease_id:
          type: string
          format: uuid
        lease_token:
          type: string
          writeOnly: true
    AgentAcceptRequest:
      allOf:
        - $ref: "#/components/schemas/LeaseCapability"
        - type: object
          required: [content_sha256, local_sequence]
          properties:
            content_sha256:
              $ref: "#/components/schemas/Sha256"
            local_sequence:
              type: integer
              format: int64
              minimum: 0
    AgentAcceptResponse:
      type: object
      required: [accepted_at, state]
      properties:
        accepted_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/JobState"
    CreateJob:
      type: object
      additionalProperties: false
      required: [title, content_type, content]
      oneOf:
        - required: [printer_id]
          not: { required: [target_id] }
        - required: [target_id]
          not: { required: [printer_id] }
      properties:
        printer_id:
          type: string
          description: Concrete printer destination. Mutually exclusive with target_id.
        target_id:
          type: string
          description: Logical primary/standby destination. Mutually exclusive with printer_id.
        title:
          type: string
          minLength: 1
          maxLength: 255
        source:
          type: [string, "null"]
          maxLength: 255
        content_type:
          type: string
          enum: [pdf, raw]
        content:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, upload_id]
              properties:
                type:
                  const: upload
                upload_id:
                  type: string
            - type: object
              additionalProperties: false
              required: [type, upload_id, manifest]
              properties:
                type:
                  const: encrypted_upload
                upload_id:
                  type: string
                manifest:
                  $ref: "#/components/schemas/EncryptedJobManifest"
            - type: object
              additionalProperties: false
              required: [type, data]
              properties:
                type:
                  const: base64
                data:
                  type: string
                  contentEncoding: base64
            - type: object
              additionalProperties: false
              required: [type, uri]
              properties:
                type:
                  const: uri
                uri:
                  type: string
                  format: uri
        options:
          $ref: "#/components/schemas/JobOptions"
        deliveries:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        expire_after_seconds:
          type: integer
          minimum: 1
          maximum: 1209600
          default: 1209600
        metadata:
          type: object
          additionalProperties:
            type: string
        resolved_ticket_digest:
          $ref: "#/components/schemas/Sha256Hex"
          description: Digest returned by resolvePrintIntent. Required when submitting a resolved professional workflow.
    EncryptedJobRecipientKey:
      type: object
      additionalProperties: false
      description: >-
        A dedicated node content-encryption public key. This is not, and must
        never be substituted with, the node's Ed25519 authentication/signing key.
        Recipient discovery and encrypted-job submission are Preview contracts;
        the plaintext job endpoint does not accept this object.
      required: [key_id, algorithm, public_key_spki]
      properties:
        key_id:
          type: string
          minLength: 8
          maxLength: 255
        algorithm:
          const: ECDH-P256-HKDF-SHA256
        public_key_spki:
          type: string
          description: DER SubjectPublicKeyInfo encoded as unpadded base64url.
          minLength: 100
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
    EncryptedJobBinding:
      type: object
      additionalProperties: false
      description: Production constraints authenticated as AES-GCM additional data.
      required: [envelope_id, workspace_id, environment_id, content_type, printer_id, target_id, profile_revision, options, deliveries, expires_at, raw_authorized]
      properties:
        envelope_id: { type: string, pattern: '^env_[A-Za-z0-9_-]{20,255}$' }
        workspace_id: { type: string }
        environment_id: { type: string }
        content_type:
          enum: [pdf, raw]
        printer_id: { type: string }
        target_id:
          type: string
          minLength: 1
        profile_revision:
          type: string
          minLength: 1
        options: { $ref: "#/components/schemas/EncryptedJobOptions" }
        deliveries: { type: integer, minimum: 1, maximum: 100 }
        expires_at:
          type: string
          format: date-time
        raw_authorized: { type: boolean }
    EncryptedJobEnvelope:
      type: object
      additionalProperties: false
      description: >-
        Preview, versioned client-encrypted content envelope. AES-256-GCM
        authenticates the canonical binding and each fresh content key is
        wrapped independently using ephemeral P-256 ECDH, HKDF-SHA256, and
        authenticated AES-256-GCM key wrap to dedicated node keys.
        The ciphertext digest is checked before transport/decryption. This
        foundation does not make the existing plaintext PDF/RAW job API
        content-confidential and is not a zero-knowledge claim.
      required:
        [version, suite, binding, ciphertext_sha256, iv, ciphertext, recipients]
      properties:
        version:
          const: piqae-encrypted-job-v3
        suite:
          const: ECDH-ES-P256+HKDF-SHA256+A256GCMKW+A256GCM
        binding:
          $ref: "#/components/schemas/EncryptedJobBinding"
        ciphertext_sha256:
          type: string
          description: SHA-256 of ciphertext and authentication tag, as unpadded base64url.
          pattern: "^[A-Za-z0-9_-]{43}$"
        iv:
          type: string
          description: Fresh 96-bit AES-GCM IV, as unpadded base64url.
          pattern: "^[A-Za-z0-9_-]{16}$"
        ciphertext:
          type: string
          description: AES-GCM ciphertext with its 128-bit authentication tag, as unpadded base64url.
          pattern: "^[A-Za-z0-9_-]+$"
        recipients:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [key_id, algorithm, ephemeral_public_key, hkdf_salt, key_wrap_iv, encrypted_content_key]
            properties:
              key_id:
                type: string
                minLength: 1
                maxLength: 255
              algorithm:
                const: ECDH-ES-P256+HKDF-SHA256+A256GCMKW
              ephemeral_public_key:
                type: string
                description: Ephemeral P-256 public key as a 65-byte uncompressed SEC1 point, encoded as unpadded base64url.
                pattern: "^[A-Za-z0-9_-]{87}$"
              hkdf_salt:
                type: string
                description: Fresh 256-bit HKDF salt, encoded as unpadded base64url.
                pattern: "^[A-Za-z0-9_-]{43}$"
              key_wrap_iv:
                type: string
                description: Fresh 96-bit AES-GCM key-wrap IV, encoded as unpadded base64url.
                pattern: "^[A-Za-z0-9_-]{16}$"
              encrypted_content_key:
                type: string
                description: 32-byte content key ciphertext and 16-byte AES-GCM tag, encoded as unpadded base64url.
                pattern: "^[A-Za-z0-9_-]{64}$"
    EncryptedJobManifest:
      type: object
      additionalProperties: false
      required: [version, suite, binding, ciphertext_sha256, iv, recipients]
      properties:
        version: { const: piqae-encrypted-job-v3 }
        suite: { const: ECDH-ES-P256+HKDF-SHA256+A256GCMKW+A256GCM }
        binding: { $ref: "#/components/schemas/EncryptedJobBinding" }
        ciphertext_sha256:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        iv:
          type: string
          pattern: "^[A-Za-z0-9_-]{16}$"
        recipients:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [key_id, algorithm, ephemeral_public_key, hkdf_salt, key_wrap_iv, encrypted_content_key]
            properties:
              key_id: { type: string, minLength: 1, maxLength: 255 }
              algorithm: { const: ECDH-ES-P256+HKDF-SHA256+A256GCMKW }
              ephemeral_public_key: { type: string, pattern: "^[A-Za-z0-9_-]{87}$" }
              hkdf_salt: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
              key_wrap_iv: { type: string, pattern: "^[A-Za-z0-9_-]{16}$" }
              encrypted_content_key:
                type: string
                pattern: "^[A-Za-z0-9_-]{64}$"
    RegisterNodeContentEncryptionKey:
      type: object
      additionalProperties: false
      required: [key_id, algorithm, public_key_spki]
      properties:
        key_id: { type: string, minLength: 8, maxLength: 255 }
        algorithm: { const: ECDH-P256-HKDF-SHA256 }
        public_key_spki:
          type: string
          minLength: 100
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
    NodeContentEncryptionKey:
      type: object
      additionalProperties: false
      description: The active dedicated content-encryption recipient key for a node.
      required: [key_id, algorithm, public_key_spki, node_id, lifecycle_state, state_changed_at, created_at]
      properties:
        key_id: { type: string, minLength: 8, maxLength: 255 }
        algorithm: { const: ECDH-P256-HKDF-SHA256 }
        public_key_spki:
          type: string
          description: DER SubjectPublicKeyInfo encoded as unpadded base64url.
          minLength: 100
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
        node_id: { type: string }
        lifecycle_state:
          type: string
          enum: [active, decrypt_only, revoked]
          description: >-
            Server-managed key lifecycle state. Printer recipient discovery
            returns only active keys; retired generations remain node-internal.
        state_changed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    EncryptedJobOptions:
      type: object
      additionalProperties: false
      required: [bin, collate, color, copies, dpi, duplex, fit_to_page, media, nup, pages, paper, rotate, native_options]
      properties:
        bin: { type: [string, "null"] }
        collate: { type: [boolean, "null"] }
        color: { type: [boolean, "null"] }
        copies: { type: [integer, "null"], minimum: 1 }
        dpi: { type: [string, "null"] }
        duplex:
          type: [string, "null"]
          enum: [one-sided, long-edge, short-edge, null]
        fit_to_page: { type: [boolean, "null"] }
        media: { type: [string, "null"] }
        nup: { type: [integer, "null"], minimum: 1 }
        pages: { type: [string, "null"] }
        paper: { type: [string, "null"] }
        rotate:
          type: [integer, "null"]
          enum: [0, 90, 180, 270, null]
        native_options:
          type: object
          additionalProperties: { type: string }
    Sha256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
    ResourceRevision:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        revision: { type: integer, format: int64, minimum: 1 }
    CapabilityEvidence:
      type: object
      additionalProperties: false
      required: [level, source]
      properties:
        level:
          type: string
          enum: [discovered, mapped, replay_tested, physically_certified]
        source: { type: string, minLength: 1, maxLength: 255 }
        support_pack_id: { type: [string, "null"], maxLength: 255 }
        support_pack_digest:
          oneOf:
            - { $ref: "#/components/schemas/Sha256Hex" }
            - { type: "null" }
    CapabilityFacet:
      type: object
      additionalProperties: false
      required: [type, mutability, supported, evidence]
      properties:
        type: { type: string, enum: [boolean, integer, number, string, enum, dimensions, object] }
        mutability: { type: string, enum: [read_only, job_override, profile_only, operator_only, unsupported] }
        supported: { type: boolean }
        unit: { type: [string, "null"], maxLength: 64 }
        values:
          type: array
          maxItems: 512
          items: { type: [string, number, integer, boolean] }
        writable_values:
          type: array
          maxItems: 512
          description: Subset of values proven safe for job-scoped writes; absent values are display-only.
          items: { type: [string, number, integer, boolean] }
        minimum: { type: [number, "null"] }
        maximum: { type: [number, "null"] }
        default_value: {}
        dependencies:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 255 }
        conflicts:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 255 }
        evidence: { $ref: "#/components/schemas/CapabilityEvidence" }
    CapabilityDocument:
      type: object
      additionalProperties: false
      required: [schema_version, printer_id, revision, driver_fingerprint_sha256, facets, created_at]
      properties:
        schema_version: { type: integer, const: 1 }
        printer_id: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        driver_fingerprint_sha256: { $ref: "#/components/schemas/Sha256Hex" }
        facets:
          type: object
          description: Versioned normalized semantic facets keyed by canonical dotted name. Unknown keys must be preserved.
          additionalProperties: { $ref: "#/components/schemas/CapabilityFacet" }
        created_at: { type: string, format: date-time }
    DocumentManifest:
      type: object
      additionalProperties: false
      required: [page_count, page_boxes, color_spaces, separations, scaling]
      properties:
        page_count: { type: integer, minimum: 1, maximum: 100000 }
        page_boxes:
          type: array
          maxItems: 100000
          items:
            type: object
            additionalProperties: false
            required: [width_mm, height_mm]
            properties:
              width_mm: { type: number, exclusiveMinimum: 0, maximum: 100000 }
              height_mm: { type: number, exclusiveMinimum: 0, maximum: 100000 }
              bleed_mm: { type: number, minimum: 0, maximum: 1000 }
        color_spaces: { type: array, maxItems: 64, items: { type: string, maxLength: 128 } }
        separations: { type: array, maxItems: 64, items: { type: string, maxLength: 128 } }
        scaling: { type: string, enum: [none, fit, fill] }
        pdf_version: { type: [string, "null"], maxLength: 32 }
        has_transparency: { type: [boolean, "null"] }
    PrintIntent:
      type: object
      additionalProperties: false
      required: [schema_version, printer_id, capability_revision, document_manifest]
      properties:
        schema_version: { type: integer, const: 1 }
        printer_id: { type: string }
        capability_revision: { type: integer, format: int64, minimum: 1 }
        workflow:
          oneOf:
            - { $ref: "#/components/schemas/ResourceRevision" }
            - { type: "null" }
        stock:
          oneOf:
            - { $ref: "#/components/schemas/ResourceRevision" }
            - { type: "null" }
        portable_options:
          allOf: [{ $ref: "#/components/schemas/JobOptions" }]
          default: {}
        semantic_options:
          type: object
          default: {}
          maxProperties: 128
          description: Values keyed only by normalized capability facet name; native driver keys are rejected.
          additionalProperties: true
        document_manifest: { $ref: "#/components/schemas/DocumentManifest" }
    PrintIntentValidationRequest:
      type: object
      additionalProperties: false
      required: [intent]
      properties:
        intent: { $ref: "#/components/schemas/PrintIntent" }
    PrintIntentFinding:
      type: object
      additionalProperties: false
      required: [code, path, message]
      properties:
        code: { type: string, pattern: "^[a-z0-9_]+$" }
        path: { type: string, maxLength: 255 }
        message: { type: string, maxLength: 1000 }
    PrintIntentValidation:
      type: object
      additionalProperties: false
      required: [status, capability_revision, errors, warnings]
      properties:
        status: { type: string, enum: [valid, invalid, operator_action_required] }
        capability_revision: { type: integer, format: int64, minimum: 1 }
        errors: { type: array, maxItems: 128, items: { $ref: "#/components/schemas/PrintIntentFinding" } }
        warnings: { type: array, maxItems: 128, items: { $ref: "#/components/schemas/PrintIntentFinding" } }
        normalized_intent:
          oneOf:
            - { $ref: "#/components/schemas/PrintIntent" }
            - { type: "null" }
    ResolvedPrintTicket:
      type: object
      additionalProperties: false
      required: [digest, printer_id, capability_revision, resolved_options, semantic_options, provenance, expires_at]
      properties:
        digest: { $ref: "#/components/schemas/Sha256Hex" }
        printer_id: { type: string }
        capability_revision: { type: integer, format: int64, minimum: 1 }
        workflow:
          oneOf:
            - { $ref: "#/components/schemas/ResourceRevision" }
            - { type: "null" }
        stock:
          oneOf:
            - { $ref: "#/components/schemas/ResourceRevision" }
            - { type: "null" }
        resolved_options: { $ref: "#/components/schemas/JobOptions" }
        semantic_options:
          type: object
          maxProperties: 128
          additionalProperties: true
        provenance:
          type: object
          maxProperties: 128
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
    CreatePrintWorkflow:
      type: object
      additionalProperties: false
      required: [name, printer_id, capability_revision, definition, safe_overrides]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        printer_id: { type: string }
        capability_revision: { type: integer, format: int64, minimum: 1 }
        profile:
          oneOf:
            - { $ref: "#/components/schemas/ResourceRevision" }
            - { type: "null" }
        stock:
          oneOf:
            - { $ref: "#/components/schemas/ResourceRevision" }
            - { type: "null" }
        definition: { $ref: "#/components/schemas/PrintIntent" }
        safe_overrides:
          type: array
          uniqueItems: true
          maxItems: 128
          items: { type: string, minLength: 1, maxLength: 255 }
        published: { type: boolean, default: false }
    PrintWorkflow:
      type: object
      additionalProperties: false
      required: [id, revision, name, printer_id, capability_revision, profile_id, profile_revision, stock_id, stock_revision, definition, safe_overrides, published, archived, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^pwf_" }
        revision: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
        printer_id: { type: string }
        capability_revision: { type: integer, format: int64, minimum: 1 }
        profile_id: { type: [string, "null"], maxLength: 255 }
        profile_revision: { type: [integer, "null"], format: int64, minimum: 1 }
        stock_id: { type: [string, "null"], maxLength: 255 }
        stock_revision: { type: [integer, "null"], format: int64, minimum: 1 }
        definition: { $ref: "#/components/schemas/PrintIntent" }
        safe_overrides:
          type: array
          uniqueItems: true
          maxItems: 128
          items: { type: string, minLength: 1, maxLength: 255 }
        published: { type: boolean }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LoadedMediaObservation:
      type: object
      additionalProperties: false
      required:
        [printer_id, source, stock, confidence, calibration_state, remaining_amount, observed_at, updated_at]
      properties:
        printer_id: { type: string }
        source: { type: string, minLength: 1, maxLength: 255 }
        stock:
          oneOf:
            - { $ref: "#/components/schemas/ResourceRevision" }
            - { type: "null" }
        confidence: { type: string, enum: [reported, operator_confirmed, inferred, unknown] }
        calibration_state: { type: string, enum: [current, required, unknown] }
        remaining_amount:
          type: [object, "null"]
          additionalProperties: true
        observed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpsertLoadedMediaObservation:
      type: object
      additionalProperties: false
      required: [source, stock, calibration_state]
      properties:
        source: { type: string, minLength: 1, maxLength: 255 }
        stock:
          oneOf:
            - { $ref: "#/components/schemas/ResourceRevision" }
            - { type: "null" }
          description: Null explicitly records that the loaded medium is unknown.
        calibration_state: { type: string, enum: [current, required, unknown] }
        remaining_amount:
          type: [object, "null"]
          maxProperties: 16
          additionalProperties: true
    JobOptions:
      type: object
      additionalProperties: false
      properties:
        bin:
          type: string
        collate:
          type: boolean
        color:
          type: boolean
        copies:
          type: integer
          minimum: 1
        dpi:
          type: string
        duplex:
          enum: [one-sided, long-edge, short-edge]
        fit_to_page:
          type: boolean
        media:
          type: string
        nup:
          type: integer
          minimum: 1
        pages:
          type: string
        paper:
          type: string
        rotate:
          type: integer
          enum: [0, 90, 180, 270]
        native_options:
          type: object
          description: Driver-native option selections keyed by the stable driver option name.
          additionalProperties:
            type: string
    Job:
      type: object
      required:
        [id, printer_id, title, content_type, deliveries, state, created_at, expires_at]
      properties:
        id:
          type: string
        printer_id:
          type: string
        title:
          type: string
        source:
          type: [string, "null"]
        content_type:
          enum: [pdf, raw]
        deliveries:
          type: integer
        state:
          $ref: "#/components/schemas/JobState"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        resolved_print_ticket:
          oneOf:
            - { $ref: "#/components/schemas/ResolvedPrintTicket" }
            - { type: "null" }
    JobPage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    JobState:
      type: string
      enum:
        - registered
        - content_pending
        - waiting_for_agent
        - agent_downloading
        - agent_accepted
        - queued_local
        - preparing
        - rendering
        - spool_intent
        - accepted_by_spooler
        - spooling
        - printing
        - blocked
        - completed_reported
        - delivery_uncertain
        - cancel_requested
        - cancelled
        - expired
        - failed_retryable
        - failed_terminal
    JobEvent:
      type: object
      required:
        [id, job_id, sequence, state, reason, message, agent_id, native_job_id, occurred_at]
      properties:
        id:
          type: string
        job_id:
          type: string
        sequence:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/JobState"
        reason:
          type: [string, "null"]
        message:
          type: [string, "null"]
        agent_id:
          type: [string, "null"]
        native_job_id:
          type: [string, "null"]
        occurred_at:
          type: string
          format: date-time
    CreateStock:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sku: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        attributes: { $ref: "#/components/schemas/StockAttributes" }
    PatchStock:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sku: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        attributes: { $ref: "#/components/schemas/StockAttributes" }
        archived: { type: boolean }
    Stock:
      type: object
      required: [id, revision, name, sku, description, attributes, archived, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^stk_[0-9A-HJKMNP-TV-Z]{26}$' }
        revision: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        sku: { type: [string, "null"] }
        description: { type: [string, "null"] }
        attributes: { $ref: "#/components/schemas/StockAttributes" }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StockAttributes:
      type: object
      description: Portable design facts only. Vendor-native settings remain opaque in the node profile.
      additionalProperties: true
      properties:
        kind:
          type: string
          enum: [sheet, label, roll, continuous, envelope, card]
        sensing:
          type: string
          enum: [none, gap, black_mark, continuous, notched, hole]
        width_mm: { type: number, exclusiveMinimum: 0 }
        height_mm: { type: number, exclusiveMinimum: 0 }
        length_mm: { type: number, exclusiveMinimum: 0 }
        thickness_mm: { type: number, exclusiveMinimum: 0 }
        weight_gsm: { type: number, exclusiveMinimum: 0 }
        orientation:
          type: string
          enum: [portrait, landscape, either]
        gap_mm: { type: number, minimum: 0 }
        black_mark:
          type: object
          additionalProperties: false
          required: [width_mm, height_mm, offset_mm]
          properties:
            width_mm: { type: number, exclusiveMinimum: 0 }
            height_mm: { type: number, exclusiveMinimum: 0 }
            offset_mm: { type: number }
        mark_interval_mm: { type: number, exclusiveMinimum: 0 }
        bleed_mm: { type: number, minimum: 0 }
        safe_area_mm:
          type: object
          additionalProperties: false
          required: [top, right, bottom, left]
          properties:
            top: { type: number, minimum: 0 }
            right: { type: number, minimum: 0 }
            bottom: { type: number, minimum: 0 }
            left: { type: number, minimum: 0 }
        source: { type: string }
        media: { type: string }
        feed_direction: { type: string, enum: [short_edge, long_edge] }
        winding: { type: string, enum: [face_in, face_out, not_applicable] }
        coating: { type: string, maxLength: 255 }
        face_material: { type: string, maxLength: 255 }
        liner: { type: string, maxLength: 255 }
        adhesive: { type: string, maxLength: 255 }
        compatible_icc_profile_digests:
          type: array
          uniqueItems: true
          maxItems: 64
          items: { $ref: "#/components/schemas/Sha256Hex" }
    CreateTarget:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        stock_id: { type: string }
        enabled: { type: boolean, default: true }
        routing_policy:
          type: string
          enum: [primary_then_standby]
          default: primary_then_standby
    PatchTarget:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        stock_id: { type: string }
        clear_stock: { type: boolean }
        enabled: { type: boolean }
        routing_policy: { type: string, enum: [primary_then_standby] }
    Target:
      type: object
      required: [id, name, description, stock_id, enabled, routing_policy, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^tgt_[0-9A-HJKMNP-TV-Z]{26}$' }
        name: { type: string }
        description: { type: [string, "null"] }
        stock_id: { type: [string, "null"] }
        enabled: { type: boolean }
        routing_policy: { type: string, enum: [primary_then_standby] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTargetBinding:
      type: object
      additionalProperties: false
      required: [printer_id, profile_id, profile_revision, role]
      properties:
        printer_id: { type: string }
        profile_id: { type: string, minLength: 1, maxLength: 120 }
        profile_revision: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [primary, standby] }
        enabled: { type: boolean, default: true }
    TargetBinding:
      type: object
      required:
        [id, target_id, printer_id, agent_id, profile_id, profile_revision, role, enabled, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^tgb_[0-9A-HJKMNP-TV-Z]{26}$' }
        target_id: { type: string }
        printer_id: { type: string }
        agent_id: { type: string }
        profile_id: { type: string }
        profile_revision: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [primary, standby] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BindingReadiness:
      type: object
      required: [binding, status, reasons]
      properties:
        binding: { $ref: "#/components/schemas/TargetBinding" }
        status:
          type: string
          enum:
            [ready, disabled, node_offline, destination_offline, destination_missing, needs_operator, profile_stale, driver_mismatch, dependency_missing, busy]
        reasons:
          type: array
          items: { type: string }
    TargetReadiness:
      type: object
      required: [target_id, status, selected_binding_id, bindings]
      properties:
        target_id: { type: string }
        status:
          type: string
          enum: [ready, target_has_no_ready_binding]
        selected_binding_id: { type: [string, "null"] }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/BindingReadiness" }
    DesignSpecificationDestination:
      type: object
      additionalProperties: false
      required: [binding, printer, profile]
      properties:
        binding: { $ref: "#/components/schemas/TargetBinding" }
        printer: { $ref: "#/components/schemas/Printer" }
        profile: { $ref: "#/components/schemas/PrinterProfileSnapshot" }
    DesignSpecification:
      type: object
      additionalProperties: false
      required: [target, stock, readiness, destinations, specification_revision]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        stock:
          oneOf:
            - { $ref: "#/components/schemas/Stock" }
            - { type: "null" }
        readiness: { $ref: "#/components/schemas/TargetReadiness" }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/DesignSpecificationDestination" }
        specification_revision:
          type: string
          description: Stable digest-like revision derived from target, stock, capability, profile and binding revisions.
    Printer:
      type: object
      required:
        [
          id,
          agent_id,
          name,
          state,
          capabilities,
          capability_revision,
          native_options,
          profiles,
          updated_at,
        ]
      properties:
        id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        state:
          $ref: "#/components/schemas/PrinterState"
        capabilities:
          $ref: "#/components/schemas/PrinterCapabilities"
        capability_revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic revision of the synced driver capability snapshot.
        native_options:
          type: object
          description: Complete driver-native option definitions keyed by stable driver option name.
          additionalProperties:
            $ref: "#/components/schemas/NativePrinterOption"
        profiles:
          type: array
          description: Named, immutable printer option snapshots synced from the agent.
          items:
            $ref: "#/components/schemas/PrinterProfileSnapshot"
        updated_at:
          type: string
          format: date-time
    PrinterCapabilities:
      type: object
      additionalProperties: false
      required:
        [
          bins,
          collate,
          color,
          copies,
          dpis,
          duplex,
          extent,
          medias,
          nup,
          papers,
          printrate,
          supports_custom_paper_size,
        ]
      properties:
        bins:
          type: array
          items:
            type: string
        collate:
          type: boolean
        color:
          type: boolean
        copies:
          type: integer
          minimum: 0
        dpis:
          type: array
          items:
            type: string
        duplex:
          type: boolean
        extent:
          type: array
          items:
            $ref: "#/components/schemas/PrinterExtent"
        medias:
          type: array
          items:
            type: string
        nup:
          type: array
          items:
            type: integer
            minimum: 0
        papers:
          type: object
          description: Paper dimensions keyed by driver paper name.
          additionalProperties:
            $ref: "#/components/schemas/PrinterPaperDimensions"
        printrate:
          anyOf:
            - $ref: "#/components/schemas/PrintRate"
            - type: "null"
        supports_custom_paper_size:
          type: boolean
    PrinterExtent:
      type: array
      description: A two-dimensional driver-reported printer extent.
      prefixItems:
        - type: integer
          minimum: 0
        - type: integer
          minimum: 0
      items: false
      minItems: 2
      maxItems: 2
    PrinterPaperDimensions:
      type: array
      description: Optional driver-reported width and height.
      prefixItems:
        - type: [integer, "null"]
          minimum: 0
        - type: [integer, "null"]
          minimum: 0
      items: false
      minItems: 2
      maxItems: 2
    PrintRate:
      type: object
      additionalProperties: false
      required: [unit, rate]
      properties:
        unit:
          type: string
          enum: [ppm, ipm, lmp, cpm]
        rate:
          type: number
          format: float
    NativePrinterOption:
      type: object
      additionalProperties: false
      required: [display_name, default_choice, selected_choice, choices]
      properties:
        display_name:
          type: string
        default_choice:
          type: [string, "null"]
        selected_choice:
          type: [string, "null"]
        choices:
          type: array
          items:
            $ref: "#/components/schemas/NativePrinterChoice"
    NativePrinterChoice:
      type: object
      additionalProperties: false
      required: [value, display_name]
      properties:
        value:
          type: string
        display_name:
          type: string
    PrinterProfileSnapshot:
      type: object
      additionalProperties: false
      required: [profile_id, revision, name, is_default, options]
      properties:
        profile_id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
        is_default:
          type: boolean
        options:
          $ref: "#/components/schemas/JobOptions"
        status:
          type: string
          enum:
            [
              draft,
              capturing,
              ready,
              needs_test,
              stale,
              driver_mismatch,
              destination_missing,
              dependency_missing,
              interactive_only,
              invalid,
              retired,
            ]
        native_kind:
          type: string
          enum:
            [
              portable_options,
              cups_options,
              cups_instance,
              macos_printcore,
              windows_devmode,
              windows_printticket,
            ]
        native_digest:
          type: [string, "null"]
          description: Digest of the node-local opaque native configuration. The native blob is never returned.
        driver_fingerprint:
          anyOf:
            - $ref: "#/components/schemas/DriverFingerprint"
            - type: "null"
        summary:
          $ref: "#/components/schemas/PrintProfileSummary"
        stock_id:
          type: [string, "null"]
        safe_overrides:
          type: array
          items:
            type: string
        last_validated_at:
          type: [string, "null"]
          format: date-time
        last_test_job_id:
          type: [string, "null"]
        published:
          type: boolean
    DriverFingerprint:
      type: object
      additionalProperties: false
      required:
        [
          platform,
          driver_name,
          driver_version,
          architecture,
          native_queue_id,
          device_fingerprint,
        ]
      properties:
        platform:
          type: string
        driver_name:
          type: string
        driver_version:
          type: [string, "null"]
        architecture:
          type: [string, "null"]
        native_queue_id:
          type: string
        device_fingerprint:
          type: [string, "null"]
    PrintProfileSummary:
      type: object
      additionalProperties: false
      properties:
        paper:
          type: [string, "null"]
        dimensions_mm:
          type: [array, "null"]
          prefixItems:
            - type: number
            - type: number
          items: false
          minItems: 2
          maxItems: 2
        source:
          type: [string, "null"]
        media:
          type: [string, "null"]
        color:
          type: [string, "null"]
        duplex:
          type: [string, "null"]
        resolution:
          type: [string, "null"]
        copies:
          type: [integer, "null"]
          minimum: 0
        native:
          type: object
          additionalProperties:
            type: string
    PrinterState:
      type: string
      enum: [online, offline, paused, busy, paper_out, error, unknown]
    Agent:
      type: object
      required: [id, name, platform, state, version, last_seen_at]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        state:
          enum: [connected, disconnected, paused, degraded]
        version:
          type: string
        last_seen_at:
          type: string
          format: date-time
        health_started_at: { type: [string, "null"], format: date-time }
        health_observed_at: { type: [string, "null"], format: date-time }
        sqlite_integrity_ok: { type: [boolean, "null"] }
        executor_crashes: { type: integer, format: int64, minimum: 0, default: 0 }
        last_error_code: { type: [string, "null"] }
    Webhook:
      type: object
      required: [id, url, events, enabled, created_at]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      required:
        [id, event_id, attempt, next_attempt_at, response_status, delivered_at, dead_lettered_at]
      properties:
        id:
          type: string
        event_id:
          type: string
        attempt:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        response_status:
          type: [integer, "null"]
        delivered_at:
          type: [string, "null"]
          format: date-time
        dead_lettered_at:
          type: [string, "null"]
          format: date-time
    BusinessDocumentEdges:
      type: object
      additionalProperties: false
      required: [top_mm, right_mm, bottom_mm, left_mm]
      properties:
        top_mm: { type: number, minimum: 0, maximum: 100 }
        right_mm: { type: number, minimum: 0, maximum: 100 }
        bottom_mm: { type: number, minimum: 0, maximum: 100 }
        left_mm: { type: number, minimum: 0, maximum: 100 }
    BusinessDocumentExpression:
      oneOf:
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: literal }, value: {} } }
        - { type: object, additionalProperties: false, required: [type, path], properties: { type: { enum: [path, current_path] }, path: { type: array, maxItems: 64, items: { type: string, maxLength: 120 } } } }
        - { type: object, additionalProperties: false, required: [type, values], properties: { type: { enum: [coalesce, concat] }, values: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/BusinessDocumentExpression" } } } }
        - { type: object, additionalProperties: false, required: [type, operator, left, right], properties: { type: { const: compare }, operator: { enum: [equal, not_equal, less, less_or_equal, greater, greater_or_equal] }, left: { $ref: "#/components/schemas/BusinessDocumentExpression" }, right: { $ref: "#/components/schemas/BusinessDocumentExpression" } } }
        - { type: object, additionalProperties: false, required: [type, operator, values], properties: { type: { const: boolean }, operator: { enum: [and, or] }, values: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/BusinessDocumentExpression" } } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: not }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: exists }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" } } }
        - { type: object, additionalProperties: false, required: [type, collection, value], properties: { type: { const: contains }, collection: { $ref: "#/components/schemas/BusinessDocumentExpression" }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" } } }
        - { type: object, additionalProperties: false, required: [type], properties: { type: { enum: [page_number, page_count] } } }
        - { type: object, additionalProperties: false, required: [type, operator, left, right], properties: { type: { const: arithmetic }, operator: { enum: [add, subtract, multiply, divide] }, left: { $ref: "#/components/schemas/BusinessDocumentExpression" }, right: { $ref: "#/components/schemas/BusinessDocumentExpression" } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: format_number }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" }, decimals: { type: integer, minimum: 0, maximum: 12, default: 0 } } }
        - { type: object, additionalProperties: false, required: [type, amount, currency], properties: { type: { const: format_money }, amount: { $ref: "#/components/schemas/BusinessDocumentExpression" }, currency: { $ref: "#/components/schemas/BusinessDocumentExpression" }, decimals: { type: integer, minimum: 0, maximum: 6, default: 2 } } }
        - { type: object, additionalProperties: false, required: [type, value, format], properties: { type: { const: format_date }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" }, format: { enum: [iso_date, day_month_year, month_day_year] } } }
        - { type: object, additionalProperties: false, required: [type, value, operation], properties: { type: { const: format_string }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" }, operation: { enum: [trim, uppercase_ascii, lowercase_ascii] } } }
    BusinessDocumentTextStyle:
      type: object
      additionalProperties: false
      properties:
        bold: { type: boolean, default: false }
        italic: { type: boolean, default: false }
        underline: { type: boolean, default: false }
        font_size_pt: { type: [number, "null"], minimum: 4, maximum: 72 }
        align: { enum: [left, center, right], default: left }
        color: { $ref: "#/components/schemas/BusinessDocumentColor" }
    BusinessDocumentColor:
      type: object
      additionalProperties: false
      required: [red, green, blue]
      properties:
        red: { type: integer, minimum: 0, maximum: 255 }
        green: { type: integer, minimum: 0, maximum: 255 }
        blue: { type: integer, minimum: 0, maximum: 255 }
    BusinessDocumentBoxStyle:
      type: object
      additionalProperties: false
      properties:
        padding_mm: { type: number, minimum: 0, maximum: 50, default: 0 }
        background: { $ref: "#/components/schemas/BusinessDocumentColor" }
        border_color: { $ref: "#/components/schemas/BusinessDocumentColor" }
        border_width_pt: { type: number, minimum: 0, maximum: 10, default: 0 }
    BusinessDocumentTableStyle:
      type: object
      additionalProperties: false
      properties:
        cell_padding_mm: { type: number, minimum: 0, maximum: 20, default: 1 }
        header_background: { $ref: "#/components/schemas/BusinessDocumentColor" }
        header_text_color: { $ref: "#/components/schemas/BusinessDocumentColor" }
        border_color: { $ref: "#/components/schemas/BusinessDocumentColor" }
        border_width_pt: { type: number, minimum: 0, maximum: 10, default: 0.25 }
    BusinessDocumentInline:
      oneOf:
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: text }, value: { type: string, maxLength: 100000 }, style: { $ref: "#/components/schemas/BusinessDocumentTextStyle" } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: value }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" }, style: { $ref: "#/components/schemas/BusinessDocumentTextStyle" } } }
        - { type: object, additionalProperties: false, required: [type], properties: { type: { const: line_break } } }
    BusinessDocumentNode:
      oneOf:
        - { type: object, additionalProperties: false, required: [type, children], properties: { type: { enum: [section, stack, row] }, children: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, gap_mm: { type: number, minimum: 0, maximum: 100, default: 0 } } }
        - { type: object, additionalProperties: false, required: [type, children], properties: { type: { const: box }, children: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, style: { $ref: "#/components/schemas/BusinessDocumentBoxStyle" } } }
        - { type: object, additionalProperties: false, required: [type, content], properties: { type: { const: paragraph }, content: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/BusinessDocumentInline" } }, style: { $ref: "#/components/schemas/BusinessDocumentTextStyle" } } }
        - { type: object, additionalProperties: false, required: [type, content], properties: { type: { const: heading }, content: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/BusinessDocumentInline" } }, level: { type: integer, minimum: 1, maximum: 6, default: 1 }, style: { $ref: "#/components/schemas/BusinessDocumentTextStyle" } } }
        - { type: object, additionalProperties: false, required: [type, columns, children], properties: { type: { const: grid }, columns: { type: array, minItems: 1, maxItems: 32, items: { type: number, exclusiveMinimum: 0, maximum: 1000 } }, children: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, gap_mm: { type: number, minimum: 0, maximum: 100, default: 0 } } }
        - { type: object, additionalProperties: false, required: [type, items, columns], properties: { type: { const: table }, items: { $ref: "#/components/schemas/BusinessDocumentExpression" }, columns: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/BusinessDocumentTableColumn" } }, repeat_header: { type: boolean, default: false }, empty: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, style: { $ref: "#/components/schemas/BusinessDocumentTableStyle" } } }
        - { type: object, additionalProperties: false, required: [type, items, children], properties: { type: { const: repeat }, items: { $ref: "#/components/schemas/BusinessDocumentExpression" }, children: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, gap_mm: { type: number, minimum: 0, maximum: 100, default: 0 } } }
        - { type: object, additionalProperties: false, required: [type, items, item], properties: { type: { const: data_list }, items: { $ref: "#/components/schemas/BusinessDocumentExpression" }, header: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, item: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, empty: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, repeat_header: { type: boolean, default: true }, gap_mm: { type: number, minimum: 0, maximum: 100, default: 0 } } }
        - { type: object, additionalProperties: false, required: [type, condition, then], properties: { type: { const: conditional }, condition: { $ref: "#/components/schemas/BusinessDocumentExpression" }, then: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }, else: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } } } }
        - { type: object, additionalProperties: false, required: [type, height_mm], properties: { type: { const: spacer }, height_mm: { type: number, minimum: 0, maximum: 2000 } } }
        - { type: object, additionalProperties: false, required: [type], properties: { type: { const: divider }, width_pt: { type: number, exclusiveMinimum: 0, maximum: 10, default: 0.5 } } }
        - { type: object, additionalProperties: false, required: [type], properties: { type: { const: page_break } } }
        - { type: object, additionalProperties: false, required: [type, children], properties: { type: { const: keep_together }, children: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } } } }
        - { type: object, additionalProperties: false, required: [type, resource, width_mm, height_mm], properties: { type: { const: image }, resource: { type: string, maxLength: 120 }, width_mm: { type: number, exclusiveMinimum: 0, maximum: 2000 }, height_mm: { type: number, exclusiveMinimum: 0, maximum: 2000 }, fit: { enum: [contain, fill, scale_down], default: contain } } }
        - { type: object, additionalProperties: false, required: [type, resource, width_mm, height_mm], properties: { type: { const: image_value }, resource: { $ref: "#/components/schemas/BusinessDocumentExpression" }, width_mm: { type: number, exclusiveMinimum: 0, maximum: 2000 }, height_mm: { type: number, exclusiveMinimum: 0, maximum: 2000 }, fit: { enum: [contain, fill, scale_down], default: contain } } }
        - { type: object, additionalProperties: false, required: [type, value, size_mm], properties: { type: { const: qr }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" }, size_mm: { type: number, minimum: 10, maximum: 100 }, error_correction: { enum: [L, M, Q, H], default: M } } }
        - { type: object, additionalProperties: false, required: [type, value, symbology, width_mm, height_mm], properties: { type: { const: barcode }, value: { $ref: "#/components/schemas/BusinessDocumentExpression" }, symbology: { const: code128 }, width_mm: { type: number, minimum: 20, maximum: 2000 }, height_mm: { type: number, minimum: 8, maximum: 2000 }, human_readable: { type: boolean, default: false } } }
    BusinessDocumentTableColumn:
      type: object
      additionalProperties: false
      required: [header, cell]
      properties:
        header: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/BusinessDocumentInline" } }
        cell: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/BusinessDocumentInline" } }
        width: { type: number, exclusiveMinimum: 0, maximum: 1000, default: 1 }
        align: { enum: [left, center, right], default: left }
    BusinessDocumentRegion:
      type: object
      additionalProperties: false
      properties:
        first: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }
        default: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }
        last: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }
    BusinessDocumentV1:
      type: object
      additionalProperties: false
      required: [format, media, body]
      properties:
        format: { const: piqae.business-document/v1 }
        media:
          oneOf:
            - { type: object, additionalProperties: false, required: [kind, size], properties: { kind: { const: paged }, size: { enum: [a4, a5, letter] }, orientation: { enum: [portrait, landscape], default: portrait }, margins: { $ref: "#/components/schemas/BusinessDocumentEdges" } } }
            - { type: object, additionalProperties: false, required: [kind, width_mm], properties: { kind: { const: continuous }, width_mm: { type: number, exclusiveMinimum: 20, maximum: 500 }, margins: { $ref: "#/components/schemas/BusinessDocumentEdges" } } }
            - { type: object, additionalProperties: false, required: [kind, width_mm, height_mm], properties: { kind: { const: label }, width_mm: { type: number, exclusiveMinimum: 20, maximum: 500 }, height_mm: { type: number, exclusiveMinimum: 10, maximum: 500 }, margins: { $ref: "#/components/schemas/BusinessDocumentEdges" } } }
        theme:
          type: object
          additionalProperties: false
          properties:
            font_size_pt: { type: number, minimum: 4, maximum: 72, default: 10 }
            line_height: { type: number, minimum: 1, maximum: 3, default: 1.25 }
            text_color: { type: object, additionalProperties: false, required: [red, green, blue], properties: { red: { type: integer, minimum: 0, maximum: 255 }, green: { type: integer, minimum: 0, maximum: 255 }, blue: { type: integer, minimum: 0, maximum: 255 } } }
        resources:
          type: object
          maxProperties: 100
          additionalProperties:
            type: object
            additionalProperties: false
            required: [type, digest, media_type, byte_length]
            properties:
              type: { const: image }
              digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
              media_type: { const: image/jpeg }
              byte_length: { type: integer, minimum: 1, maximum: 4194304 }
        header: { $ref: "#/components/schemas/BusinessDocumentRegion" }
        body: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/BusinessDocumentNode" } }
        footer: { $ref: "#/components/schemas/BusinessDocumentRegion" }
    CreateBusinessDocumentTemplate:
      type: object
      additionalProperties: false
      required: [name, specification]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        specification: { $ref: "#/components/schemas/BusinessDocumentV1" }
    PublishBusinessDocumentTemplate:
      type: object
      additionalProperties: false
      required: [specification]
      properties:
        specification: { $ref: "#/components/schemas/BusinessDocumentV1" }
    BusinessDocumentTemplate:
      type: object
      required: [id, name, state, specification, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        state: { enum: [draft, published, archived] }
        specification: { $ref: "#/components/schemas/BusinessDocumentV1" }
        published_revision_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BusinessDocumentTemplateRevision:
      type: object
      required: [id, template_id, revision, renderer_profile, specification, created_at]
      properties:
        id: { type: string }
        template_id: { type: string }
        specification: { $ref: "#/components/schemas/BusinessDocumentV1" }
        revision: { type: integer, minimum: 1 }
        renderer_profile: { type: string, const: piqae.business-document/v1 }
        created_at: { type: string, format: date-time }
    CreateBusinessDocumentRender:
      type: object
      additionalProperties: false
      required: [template_revision_id, input]
      properties:
        template_revision_id: { type: string }
        input:
          type: object
          maxProperties: 1000
          additionalProperties: true
    BusinessDocumentRender:
      type: object
      required: [id, template_revision_id, state, created_at, updated_at]
      properties:
        id: { type: string }
        template_revision_id: { type: string }
        state: { enum: [registered, rendering, completed, failed_terminal, expiring, expired] }
        artifact_sha256: { type: [string, "null"], pattern: '^[a-f0-9]{64}$' }
        artifact_byte_length: { type: [integer, "null"], minimum: 1 }
        artifact_media_type: { type: [string, "null"], enum: [application/pdf, null] }
        page_count: { type: [integer, "null"], minimum: 1, maximum: 100000 }
        failure_code: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PrintBusinessDocumentRender:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        printer_id: { type: string }
        target_id: { type: string }
        title: { type: string, minLength: 1, maxLength: 255 }
        options: { $ref: "#/components/schemas/JobOptions" }
        deliveries: { type: integer, minimum: 1, maximum: 100, default: 1 }
        render_policy: { $ref: "#/components/schemas/BusinessDocumentRenderPolicy" }
        render_cost: { $ref: "#/components/schemas/BusinessDocumentRenderCost" }
      oneOf:
        - required: [printer_id]
          not: { required: [target_id] }
        - required: [target_id]
          not: { required: [printer_id] }
    BusinessDocumentRenderPolicy:
      type: string
      enum: [automatic, cloud_only, prefer_node, require_node]
      default: automatic
      description: >-
        automatic uses bounded measured costs; cloud_only always delivers the approved PDF;
        prefer_node uses exact node rendering only when compatible and otherwise delivers the
        approved PDF; require_node fails closed when exact compatibility is unavailable.
    BusinessDocumentRenderCost:
      type: object
      additionalProperties: false
      required: [document_count, page_count, pdf_bytes, input_bytes]
      properties:
        document_count: { type: integer, minimum: 1, maximum: 10000 }
        page_count: { type: integer, minimum: 1, maximum: 100000 }
        pdf_bytes: { type: integer, format: int64, minimum: 1, maximum: 524288000 }
        input_bytes: { type: integer, format: int64, minimum: 1, maximum: 52428800 }
    BusinessDocumentResourceDescriptor:
      type: object
      additionalProperties: false
      required: [digest, media_type, byte_length]
      properties:
        digest: { $ref: "#/components/schemas/Sha256Hex" }
        media_type:
          type: string
          enum: [image/jpeg]
          description: Renderer ABI v1 intentionally supports resolved JPEG resources only; fonts remain built-in Base-14/Windows-1252.
        byte_length: { type: integer, format: int64, minimum: 1, maximum: 4194304 }
    BusinessDocumentRenderReadiness:
      type: object
      additionalProperties: false
      required: [requested_policy, selected_mode, reason, destination, estimates]
      properties:
        requested_policy: { $ref: "#/components/schemas/BusinessDocumentRenderPolicy" }
        selected_mode: { type: string, enum: [cloud_pdf, node_render] }
        reason: { type: string, maxLength: 128 }
        destination:
          type: object
          additionalProperties: false
          required: [supported, ready, missing_resources, reason]
          properties:
            supported: { type: boolean }
            ready: { type: boolean }
            missing_resources:
              type: array
              maxItems: 64
              items: { $ref: "#/components/schemas/Sha256Hex" }
            reason: { type: [string, "null"], maxLength: 128 }
        estimates:
          type: object
          additionalProperties: false
          required: [cloud_ms, node_ms]
          properties:
            cloud_ms: { type: integer, format: int64, minimum: 0 }
            node_ms: { type: integer, format: int64, minimum: 0 }
    EvaluateBusinessDocumentRenderReadiness:
      type: object
      additionalProperties: false
      required: [printer_id]
      properties:
        printer_id: { type: string }
        render_policy: { $ref: "#/components/schemas/BusinessDocumentRenderPolicy" }
        render_cost: { $ref: "#/components/schemas/BusinessDocumentRenderCost" }
    CreateBusinessDocumentPreview:
      type: object
      additionalProperties: false
      properties:
        expires_in_seconds: { type: integer, minimum: 60, maximum: 1800, default: 600 }
    BusinessDocumentPreview:
      type: object
      additionalProperties: false
      required: [id, render_id, state, job_id, expires_at, created_at, updated_at]
      properties:
        id: { type: string }
        render_id: { type: string }
        state: { enum: [awaiting_approval, approving, approved, cancelled, expired] }
        job_id: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApprovedBusinessDocumentPreview:
      type: object
      additionalProperties: false
      required: [preview, job]
      properties:
        preview: { $ref: "#/components/schemas/BusinessDocumentPreview" }
        job: { $ref: "#/components/schemas/Job" }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            retryable:
              type: boolean
            details:
              type: object
