          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                expires_in_seconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
                  default: 600
      responses:
        "201":
          description: Single-use enrolment token. The token is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expires_at]
                properties:
                  id:
                    type: string
                  token:
                    type: string
                    pattern: '^piq_enr_'
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
