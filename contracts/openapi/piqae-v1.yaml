        observed_at: { type: string, format: date-time }
        state: { type: string, enum: [complete, failed] }
        agent_version: { type: string, maxLength: 64 }
        platform: { type: string, maxLength: 32 }
        architecture: { type: string, maxLength: 32 }
        queued_jobs: { type: integer, minimum: 0 }
        active_jobs: { type: integer, minimum: 0 }
        sqlite_integrity_ok: { type: boolean }
        executor_crashes: { type: integer, format: int64, minimum: 0 }
        last_error_code: { type: [string, "null"], maxLength: 128 }
        collection_error_code: { type: [string, "null"], maxLength: 128 }
    NodeDiagnostic:
      type: object
      additionalProperties: false
      required: [request_id, node_id, state, report, requested_at, received_at, expires_at]
      properties:
        request_id: { type: string, pattern: '^diag_' }
        node_id: { type: string }
        state: { type: string, enum: [requested, complete, failed] }
        report:
          oneOf:
            - $ref: "#/components/schemas/DiagnosticReport"
            - type: "null"
        requested_at: { type: string, format: date-time }
        received_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
    JobOffer:
      type: object
      required: [job, lease_id, lease_token, lease_expires_at, content]
      properties:
