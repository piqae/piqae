    parameters:
      - $ref: "#/components/parameters/UploadId"
    put:
      summary: Upload content through the Piqae server
      tags: [Jobs]
      operationId: putUploadContent
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              contentEncoding: base64
          application/pdf:
            schema:
              type: string
              contentMediaType: application/pdf
              contentEncoding: base64
      responses:
        "200":
          description: Upload verified and completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
