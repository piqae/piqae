    CreateDeviceAuthorization:
      type: object
      additionalProperties: false
      required:
        [public_key, installation_id, proposed_name, hostname, platform, architecture, installation_mode, agent_version, protocol_version]
      properties:
        public_key: { type: string, contentEncoding: base64url }
        installation_id: { type: string, minLength: 1, maxLength: 160 }
        proposed_name: { type: string, minLength: 1, maxLength: 120 }
        hostname: { type: string, minLength: 1, maxLength: 255 }
        platform: { type: string, minLength: 1, maxLength: 40 }
        architecture: { type: string, minLength: 1, maxLength: 40 }
        installation_mode: { type: string, enum: [user, machine, local] }
        agent_version: { type: string, minLength: 1, maxLength: 40 }
        protocol_version: { type: integer, minimum: 1 }
    CreatedDeviceAuthorization:
      type: object
      additionalProperties: false
      required: [id, device_code, user_code, verification_uri, expires_in, interval]
      properties:
        id: { type: string, pattern: '^dva_' }
        device_code:
          type: string
          pattern: '^piq_dev_'
        user_code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$' }
        verification_uri: { type: string }
        expires_in: { type: integer, const: 600 }
        interval: { type: integer, minimum: 1 }
    DecideDeviceAuthorization:
      type: object
      additionalProperties: false
      required: [user_code]
      properties:
        user_code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{4}-?[2-9A-HJ-NP-Z]{4}$' }
    DeviceCodeRequest:
      type: object
      additionalProperties: false
      required: [device_code]
      properties:
        device_code:
          type: string
          pattern: '^piq_dev_'
          description: >-
            Piqae device code. Carried in the request body rather than the path
            because it is a bearer secret for the pairing exchange.
    DeviceAuthorizationStatus:
      type: object
      additionalProperties: false
      required: [id, state, expires_at]
      properties:
        id: { type: string, pattern: '^dva_' }
        state: { type: string, enum: [pending, approved, denied, consumed, expired] }
        expires_at: { type: string, format: date-time }
    DeviceAuthorizationReview:
      type: object
      additionalProperties: false
      required: [id, proposed_name, hostname, platform, architecture, state, expires_at]
      properties:
        id: { type: string, pattern: '^dva_' }
        proposed_name: { type: string }
        hostname: { type: string }
        platform: { type: string }
        architecture: { type: string }
        state: { type: string, enum: [pending, approved, denied, consumed, expired] }
        expires_at: { type: string, format: date-time }
        replaces_node_id:
          type: [string, "null"]
          description: >-
            The node whose device key this approval would replace, when the
            request comes from an installation already paired to this workspace.
            Null when approving admits a new node.
    DeviceAuthorizationExchange:
      type: object
      additionalProperties: false
      required: [node_id, workspace_id, environment_id, server_time, sync_after_ms]
      properties:
        node_id: { type: string }
        workspace_id: { type: string }
        environment_id: { type: string }
        server_time: { type: string, format: date-time }
        sync_after_ms: { type: integer, minimum: 0 }
    NodeUpdatePolicy:
      type: object
      additionalProperties: false
      required: [channel, mode, pinned_version, maintenance_window]
      properties:
        channel: { type: string, enum: [stable, canary, pinned] }
        mode: { type: string, enum: [automatic, prompt, disabled] }
        pinned_version: { type: [string, "null"], maxLength: 64 }
        maintenance_window: { type: [object, "null"] }
    NodeUpdateState:
      type: object
      required:
        [current_version, available_version, state, download_percent, deferred_reason, last_checked_at, last_success_at, last_error_code, rollback_version]
