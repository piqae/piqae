openapi: 3.1.0
info:
  title: Piqae API
  version: 1.0.0
  description: |
    Durable local and remote printing API.
    Every response, including framework 404/405 responses, carries `X-Request-Id`.
    A caller value is preserved only when it matches `^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$`;
    otherwise Piqae generates `req_<ULID>`. Native `error.request_id` and
    legacy-compatible error `uid` exactly match the response header.
    During the V1 migration window, existing `spl_*` credentials and signed
    `X-Spool-*` node headers remain accepted. New clients must use `piq_*`
    credentials and `X-Piqae-*` headers.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://api.piqae.com
    description: Piqae Cloud API origin. Self-hosted deployments replace this origin.
security:
  - bearer: []
  - platformBearer: []
tags:
  - name: API Keys
    description: Create and revoke environment-scoped developer credentials.
  - name: Identity
    description: Self-hosted local-owner sessions and tenant identity projections.
  - name: Platform
    description: Manage customer workspaces from a trusted platform backend or owner dashboard.
  - name: Billing
    description: Inspect canonical Cloud entitlements, reported-complete usage, and Stripe projections.
  - name: Jobs
    description: Register and observe durable print jobs.
  - name: Documents
    description: Optionally publish declarative templates and asynchronously render immutable PDF artifacts.
  - name: Printers
    description: Inspect installed printer queues and driver capabilities.
  - name: Routing
    description: Manage stocks and stable profile-backed print targets.
  - name: Agents
    description: Deprecated V1 aliases for local Piqae nodes.
  - name: Nodes
    description: Pair, observe, operate, and update computers running Piqae.
  - name: Node protocol
    description: Private node enrolment, synchronization, leasing, and status protocol.
  - name: Events
    description: Consume immutable state changes.
  - name: Webhooks
    description: Deliver signed event notifications.
  - name: the legacy provider Compatibility
    description: legacy-shaped migration surface at the API origin root.
paths:
  /whoami:
    get:
      summary: Inspect the legacy-compatible account projection
      tags: [the legacy provider Compatibility]
      operationId: compatibilityWhoAmI
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Compatibility account details for the authenticated environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatibilityWhoAmI" }
        "401": { $ref: "#/components/responses/Error" }
  /ping:
    get:
      summary: Check authenticated legacy compatibility access
      tags: [the legacy provider Compatibility]
      operationId: compatibilityPing
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Authenticated compatibility API is reachable.
          content:
            text/plain:
              schema: { type: string, const: pong }
        "401": { $ref: "#/components/responses/Error" }
  /noop:
    get:
      summary: Perform an authenticated no-op
      tags: [the legacy provider Compatibility]
      operationId: compatibilityNoop
      security: [{ compatibilityBasic: [] }]
      responses:
        "204":
          description: Authentication succeeded; no content is returned.
        "401": { $ref: "#/components/responses/Error" }
  /computers:
    get:
      summary: List legacy-compatible computers
      tags: [the legacy provider Compatibility]
      operationId: compatibilityListComputers
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Computers in the authenticated environment.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityComputer" }
        "401": { $ref: "#/components/responses/Error" }
  /computers/{computer_set}:
    parameters:
      - $ref: "#/components/parameters/ComputerSet"
    get:
      summary: Get a set of legacy-compatible computers
      tags: [the legacy provider Compatibility]
      operationId: compatibilityGetComputers
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Sorted, deduplicated computer set.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityComputer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /computers/{computer_set}/printers:
    parameters:
      - $ref: "#/components/parameters/ComputerSet"
    get:
      summary: List printers attached to a computer set
      tags: [the legacy provider Compatibility]
      operationId: compatibilityListComputerPrinters
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Matching printers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrinter" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /computers/{computer_set}/printers/{printer_set}:
    parameters:
      - $ref: "#/components/parameters/ComputerSet"
      - $ref: "#/components/parameters/PrinterSet"
    get:
      summary: Intersect computer and printer sets
      tags: [the legacy provider Compatibility]
      operationId: compatibilityGetComputerPrinters
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Matching printers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrinter" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printers:
    get:
      summary: List legacy-compatible printers
      tags: [the legacy provider Compatibility]
      operationId: compatibilityListPrinters
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Printers in the authenticated environment.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrinter" }
        "401": { $ref: "#/components/responses/Error" }
  /printers/{printer_set}:
    parameters:
      - $ref: "#/components/parameters/PrinterSet"
    get:
      summary: Get a set of legacy-compatible printers
      tags: [the legacy provider Compatibility]
      operationId: compatibilityGetPrinters
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Sorted, deduplicated printer set.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrinter" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printjobs:
    post:
      summary: Create a legacy-compatible print job
      tags: [the legacy provider Compatibility]
      operationId: compatibilityCreatePrintJob
      security: [{ compatibilityBasic: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatibilityCreatePrintJob"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CompatibilityCreatePrintJob"
      responses:
        "201":
          description: Numeric compatibility job ID.
          content:
            application/json:
              schema: { type: integer, minimum: 1 }
        "400": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      summary: List legacy-compatible print jobs
      tags: [the legacy provider Compatibility]
      operationId: compatibilityListPrintJobs
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Print jobs in the authenticated environment.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel all eligible pre-delivery print jobs
      tags: [the legacy provider Compatibility]
      operationId: compatibilityCancelPrintJobs
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CompatibilityCancelledIds"
        "401": { $ref: "#/components/responses/Error" }
  /printjobs/{job_set}:
    parameters:
      - $ref: "#/components/parameters/JobSet"
    get:
      summary: Get a set of legacy-compatible print jobs
      tags: [the legacy provider Compatibility]
      operationId: compatibilityGetPrintJobs
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: Sorted, deduplicated job set.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJob" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel an eligible set of pre-delivery print jobs
      tags: [the legacy provider Compatibility]
      operationId: compatibilityCancelPrintJobSet
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CompatibilityCancelledIds"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printjobs/states:
    get:
      summary: List legacy-compatible job states
      tags: [the legacy provider Compatibility]
      operationId: compatibilityListPrintJobStates
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: States for the newest 500 jobs in the authenticated environment.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJobState" }
        "401": { $ref: "#/components/responses/Error" }
  /printjobs/{job_set}/states:
    parameters:
      - $ref: "#/components/parameters/JobSet"
    get:
      summary: Get legacy-compatible states for a job set
      tags: [the legacy provider Compatibility]
      operationId: compatibilityGetPrintJobStates
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          description: States for the requested job set.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJobState" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printers/{printer_set}/printjobs:
    parameters:
      - $ref: "#/components/parameters/PrinterSet"
    get:
      summary: List print jobs for a printer set
      tags: [the legacy provider Compatibility]
      operationId: compatibilityListPrinterPrintJobs
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Matching print jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJob" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel eligible pre-delivery jobs for a printer set
      tags: [the legacy provider Compatibility]
      operationId: compatibilityCancelPrinterPrintJobs
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CompatibilityCancelledIds"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /printers/{printer_set}/printjobs/{job_set}:
    parameters:
      - $ref: "#/components/parameters/PrinterSet"
      - $ref: "#/components/parameters/JobSet"
    get:
      summary: Intersect printer and print-job sets
      tags: [the legacy provider Compatibility]
      operationId: compatibilityGetPrinterPrintJobs
      security: [{ compatibilityBasic: [] }]
      parameters:
        - $ref: "#/components/parameters/CompatibilityLimit"
        - $ref: "#/components/parameters/CompatibilityDirection"
        - $ref: "#/components/parameters/CompatibilityAfter"
      responses:
        "200":
          description: Matching print jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompatibilityPrintJob" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel the eligible intersection of printer and print-job sets
      tags: [the legacy provider Compatibility]
      operationId: compatibilityCancelPrinterPrintJobSet
      security: [{ compatibilityBasic: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CompatibilityCancelledIds"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/health:
    get:
      summary: Check process health
      security: []
      operationId: health
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/ready:
    get:
      summary: Check dependency readiness
      security: []
      operationId: ready
      responses:
        "200":
          description: Required dependencies and migrations are ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /v1/meta:
    get:
      summary: Discover deployment capabilities
      tags: [Nodes]
      operationId: getDeploymentMeta
      security: []
      responses:
        "200":
          description: Capability flags used by the shared cloud and self-hosted dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentMeta" }
  /v1/identity/local/bootstrap:
    post:
      summary: Create the first self-hosted owner
      description: |
        Available only when local-owner identity and an explicit bootstrap token are
        configured. The bootstrap token is supplied in `X-Piqae-Bootstrap-Token`.
        The returned owner credential is shown exactly once.
      tags: [Identity]
      operationId: bootstrapLocalOwner
      security: []
      parameters:
        - name: X-Piqae-Bootstrap-Token
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapLocalOwner" }
      responses:
        "201":
          description: First owner and workspace created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrappedLocalOwner" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/identity/local/exchange:
    post:
      summary: Exchange a local-owner credential for a short-lived session
      tags: [Identity]
      operationId: exchangeLocalOwnerCredential
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExchangeLocalOwnerCredential" }
      responses:
        "200":
          description: Opaque session secret for a server-side browser adapter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalOwnerSession" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/identity/local/sessions/rotate:
    post:
      summary: Atomically rotate the current local-owner session
      tags: [Identity]
      operationId: rotateLocalOwnerSession
      responses:
        "200":
          description: Replacement session. The presented session is revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalOwnerSession" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/identity/local/sessions/revoke:
    post:
      summary: Revoke the current local-owner session
      tags: [Identity]
      operationId: revokeLocalOwnerSession
      responses:
        "204": { description: Session revoked or already inactive. }
        "401": { $ref: "#/components/responses/Error" }
  /v1/identity/me:
    get:
      summary: Inspect the authenticated identity and active workspace
      tags: [Identity]
      operationId: getCurrentIdentity
      responses:
        "200":
          description: Tenant-scoped identity projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentIdentity" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/workspaces/current:
    get:
      summary: Inspect the authenticated workspace
      tags: [Identity]
      operationId: getCurrentWorkspace
      responses:
        "200":
          description: Current workspace only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/workspaces/current/members:
    get:
      summary: List members of the authenticated workspace
      tags: [Identity]
      operationId: listCurrentWorkspaceMembers
      responses:
        "200":
          description: Members scoped by the authenticated workspace ID.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMember" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/platform/accounts:
    get:
      summary: List customer accounts owned by the platform service account
      description: |
        Server-side platform operation. A platform service-account bearer or
        authorised human owner-dashboard bearer may manage accounts; ordinary
        Test and Live API keys are rejected. Tenant-selection headers are never
        accepted. Results include the Test and Live environment IDs required to
        construct an account-scoped client.
      tags: [Platform]
      operationId: listPlatformAccounts
      security: [{ platformBearer: [] }, { bearer: [] }]
      responses:
        "200":
          description: Customer accounts owned by this platform identity.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformAccount" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/platform/status:
    get:
      summary: Inspect whether platform account management is enabled for this workspace
      description: |
        Authenticated tenant operation used to tailor the dashboard. This does
        not create a platform service account or disclose its identifier or
        credential. Ordinary Test and Live API keys may inspect only their own
        workspace's status.
      tags: [Platform]
      operationId: getPlatformStatus
      responses:
        "200":
          description: Workspace-scoped platform account status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformStatus" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/platform/enable:
    post:
      summary: Enable platform account management for the current workspace
      description: |
        Creates one platform service account and exact Test and Live grants for
        the authenticated owner workspace. This operation accepts only an
        authorised human dashboard bearer; API keys and platform credentials
        are rejected. The secret is returned once and cannot be retrieved
        later. Repeating the operation returns a conflict without rotating or
        revealing the existing credential.
      tags: [Platform]
      operationId: enablePlatform
      security: [{ bearer: [] }]
      responses:
        "201":
          description: Platform mode enabled and one-time credential issued.
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store" }
            Pragma:
              schema: { type: string, example: "no-cache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformEnableResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/platform/credential:
    get:
      summary: Inspect the active platform credential for the current workspace
      description: |
        Returns safe metadata only. The secret is never returned. This operation
        accepts only an authorised human dashboard bearer; ordinary API keys and
        platform credentials are rejected.
      tags: [Platform]
      operationId: getPlatformCredential
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Active platform credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Rotate the active platform credential
      description: |
        Atomically replaces the secret for the current workspace's platform
        credential. The previous secret stops authenticating immediately. The
        replacement secret is returned once and cannot be retrieved later.
      tags: [Platform]
      operationId: rotatePlatformCredential
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Credential rotated and one-time replacement secret issued.
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store" }
            Pragma:
              schema: { type: string, example: "no-cache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformCredentialSecret" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke the active platform credential
      description: |
        Immediately disables platform authentication for this workspace. Customer
        account data is retained, but cannot be managed until platform mode is
        enabled again with a new credential.
      tags: [Platform]
      operationId: revokePlatformCredential
      security: [{ bearer: [] }]
      responses:
        "204": { description: Platform credential revoked. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/platform/accounts/{external_id}:
    parameters:
      - name: external_id
        in: path
        required: true
        description: Stable customer identifier from the integrating platform.
        schema:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'
    put:
      summary: Idempotently create or update a customer account
      description: |
        The first request atomically creates a workspace, Test and Live
        environments, and exact grants for this platform service account.
        Repeating the same external ID updates safe account metadata without
        creating another tenant.
      tags: [Platform]
      operationId: upsertPlatformAccount
      security: [{ platformBearer: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertPlatformAccount" }
      responses:
        "200":
          description: Existing account updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAccount" }
        "201":
          description: Account, environments, and grants created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      summary: Retrieve one customer account by the platform's external ID
      tags: [Platform]
      operationId: getPlatformAccount
      security: [{ platformBearer: [] }, { bearer: [] }]
      responses:
        "200":
          description: Platform-owned customer account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAccount" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Archive a customer account and revoke its platform grants
      description: |
        Stops new platform requests for both environments. Existing durable
        print jobs remain available to workers for lifecycle completion.
      tags: [Platform]
      operationId: archivePlatformAccount
      security: [{ platformBearer: [] }, { bearer: [] }]
      responses:
        "204": { description: Account archived or already archived. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/billing/summary:
    get:
      summary: Inspect the workspace billing projection and current-period usage
      description: |
        Returns the canonical Free or Pro entitlement for Piqae Cloud. For a
        platform owner workspace, reported-complete usage includes its owned
        customer workspaces. Self-hosted deployments return `enabled: false`
        and never enforce Cloud limits.
      tags: [Billing]
      operationId: getBillingSummary
      responses:
        "200":
          description: Billing state for the authenticated workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/usage:
    get:
      summary: Inspect immutable reported-complete usage for the authenticated workspace
      description: |
        Counts each Live-environment job exactly once when a node reports
        `completed_reported`. Failed, blocked or jammed, cancelled, expired,
        delivery-uncertain, Test-environment, and virtual jobs do not add
        usage. A reported completion is the strongest available node or
        operating-system signal; it is not proof that ink reached paper. This
        tenant-scoped endpoint never exposes sibling platform-customer usage.
      tags: [Billing]
      operationId: getUsage
      parameters:
        - name: month
          in: query
          required: false
          description: UTC calendar month. Defaults to the current month.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Tenant-scoped reported-complete usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/integrations/stripe/webhook:
    post:
      summary: Project a signed Stripe billing event
      description: |
        Piqae Cloud only. The raw request is verified against
        `Stripe-Signature`; event IDs are idempotent and an older event cannot
        overwrite a newer subscription projection.
      tags: [Billing]
      operationId: projectStripeWebhook
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string, maxLength: 4096 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Event accepted or previously projected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StripeWebhookReceipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/integrations/workos/webhook:
    post:
      summary: Project a signed WorkOS identity event
      description: |
        Piqae Cloud only. The raw request is verified against
        `WorkOS-Signature`; event IDs and payload hashes are idempotent, and
        older organization, user, or membership events cannot overwrite a
        newer projection.
      tags: [Identity]
      operationId: projectWorkOsWebhook
      security: []
      parameters:
        - name: WorkOS-Signature
          in: header
          required: true
          schema: { type: string, maxLength: 4096 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Event accepted, ignored as stale, or previously projected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOsWebhookReceipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/device-authorizations:
    post:
      summary: Start browser pairing for a node
      tags: [Nodes]
      operationId: createDeviceAuthorization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeviceAuthorization" }
      responses:
        "201":
          description: Ten-minute device and human codes for one pairing attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedDeviceAuthorization" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/device-authorizations/status:
    post:
      summary: Poll browser-pairing state
      description: >-
        The device code is a bearer secret and is carried in the request body so
        that it is not recorded by proxy, CDN, or gateway access logs.
      tags: [Nodes]
      operationId: getDeviceAuthorizationStatus
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCodeRequest" }
      responses:
        "200":
          description: Current authorization state without workspace details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationStatus" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/device-authorizations/exchange:
    post:
      summary: Exchange one approved device code for node identity
      description: >-
        The device code is carried in the request body. Repeating an exchange
        with the same code returns the same node identity, so a node that is
        interrupted mid-pairing can safely retry.
      tags: [Nodes]
      operationId: exchangeDeviceAuthorizationByBody
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCodeRequest" }
      responses:
        "200":
          description: Node identity assignment. The private device key never leaves the node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationExchange" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/device-authorizations/{device_code}:
    parameters:
      - name: device_code
        in: path
        required: true
        schema:
          type: string
          pattern: '^piq_dev_'
          description: Piqae device code.
    get:
      summary: Poll browser-pairing state (deprecated)
      description: >-
        Deprecated. Placing the device code in the request path exposes it to
        every proxy and CDN access log between the node and the control plane.
        Retained for nodes released before the code moved into the request body;
        use POST /v1/device-authorizations/status instead.
      deprecated: true
      tags: [Nodes]
      operationId: getDeviceAuthorization
      security: []
      responses:
        "200":
          description: Current authorization state without workspace details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationStatus" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/device-authorizations/{authorization_id}/approve:
    parameters:
      - $ref: "#/components/parameters/DeviceAuthorizationId"
    post:
      summary: Approve a node into the caller's workspace and environment
      tags: [Nodes]
      operationId: approveDeviceAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideDeviceAuthorization" }
      responses:
        "200":
          description: Pairing approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/device-authorizations/{authorization_id}/review:
    parameters:
      - $ref: "#/components/parameters/DeviceAuthorizationId"
    get:
      summary: Review a pending node before browser approval
      tags: [Nodes]
      operationId: reviewDeviceAuthorization
      responses:
        "200":
          description: Non-secret device details for an authenticated pairing operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationReview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/device-authorizations/{authorization_id}/deny:
    parameters:
      - $ref: "#/components/parameters/DeviceAuthorizationId"
    post:
      summary: Deny a browser-pairing request
      tags: [Nodes]
      operationId: denyDeviceAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideDeviceAuthorization" }
      responses:
        "200":
          description: Pairing denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/device-authorizations/{device_code}/exchange:
    parameters:
      - name: device_code
        in: path
        required: true
        schema:
          type: string
          pattern: '^piq_dev_'
          description: Piqae device code.
    post:
      summary: Exchange one approved device code for node identity (deprecated)
      description: >-
        Deprecated. Placing the device code in the request path exposes it to
        every proxy and CDN access log between the node and the control plane.
        Retained for nodes released before the code moved into the request body;
        use POST /v1/device-authorizations/exchange instead.
      deprecated: true
      tags: [Nodes]
      operationId: exchangeDeviceAuthorization
      security: []
      responses:
        "200":
          description: Node identity assignment. The private device key never leaves the node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationExchange" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/api-keys:
    get:
      summary: List API key metadata for the current environment
      tags: [API Keys]
      operationId: listApiKeys
      responses:
        "200":
          description: API key metadata. Secrets and password hashes are never returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create an API key
      description: Requested scopes must be a subset of the authenticated caller's scopes.
      tags: [API Keys]
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: API key created. The plaintext secret is returned exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Revoke an API key
      description: Revocation is idempotent. The key record is retained and never hard-deleted.
      tags: [API Keys]
      operationId: revokeApiKey
      responses:
        "200":
          description: Revoked API key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/jobs:
    post:
      summary: Register a print job
      tags: [Jobs]
      operationId: createJob
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PlatformWorkspaceId"
        - $ref: "#/components/parameters/PlatformEnvironmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJob"
      responses:
        "200":
          description: Idempotent retry of an existing durable job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "201":
          description: Job registered durably.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    get:
      summary: List print jobs
      tags: [Jobs]
      operationId: listJobs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
        - name: state
          in: query
          required: false
          description: Exact native lifecycle state.
          schema: { $ref: "#/components/schemas/JobState" }
        - name: printer_id
          in: query
          required: false
          schema: { type: string }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
        - name: metadata_key
          in: query
          required: false
          description: Metadata key to match; metadata_value may refine it.
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: metadata_value
          in: query
          required: false
          description: Exact metadata value; requires metadata_key.
          schema: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cursor-paginated jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Get a print job
      tags: [Jobs]
      operationId: getJob
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: List immutable job events
      tags: [Jobs, Events]
      operationId: listJobEvents
      responses:
        "200":
          description: Immutable event sequence.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobEvent"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/jobs/{job_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Request job cancellation
      tags: [Jobs]
      operationId: cancelJob
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/node-connect-sessions:
    post:
      summary: Create a tenant-scoped embedded node connection session
      description: |
        Server-only operation for a trusted application backend. The returned
        connect URL is an Associated Domains verified HTTPS Universal Link and
        carries its one-time enrollment capability in the URL fragment so it is
        not sent in HTTP requests or access logs. The legacy piqae custom scheme
        is accepted only by existing macOS Preview clients and is deprecated.
        Return URLs
        are bound to server-side invitation state, must be HTTPS except HTTP
        localhost, and cannot contain credentials or fragments. They are never
        trusted from the application-link fragment. Native application-link
        handoff is currently implemented only by the macOS Preview shell;
        Windows and Linux clients require the documented manual fallback.
      tags: [Nodes]
      operationId: createNodeConnectSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeConnectSession" }
      responses:
        "201":
          description: Short-lived node connection session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeConnectSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/node-connect-sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^enr_' }
    get:
      summary: Inspect a tenant-scoped node connection session
      description: Server-only polling projection; enrollment capabilities are never returned.
      tags: [Nodes]
      operationId: getNodeConnectSession
      responses:
        "200":
          description: Current connection state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeConnectSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/node-connect-sessions/preview:
    post:
      summary: Preview a native node connection invitation without consuming it
      description: |
        Called by the Piqae node after receiving a capability through the
        application-link fragment. The capability is carried in the bounded
        request body and errors are intentionally indistinguishable. The
        returned workspace identity is resolved from server-owned tenant data.
        When platform authentication created the session, requesting-service
        identity is also a server-authenticated snapshot; it is null for direct
        workspace credentials.
      tags: [Nodes]
      operationId: previewNodeConnectSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectSessionPreviewRequest" }
      responses:
        "200":
          description: Verified invitation claims for local consent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectSessionPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/nodes/{node_id}/connectors:
    parameters:
      - name: node_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List this tenant's connector grants for a node
      description: Never reveals the installation identity or grants belonging to other tenants.
      tags: [Nodes]
      operationId: listNodeConnectors
      responses:
        "200":
          description: Tenant-scoped connector grants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NodeConnector" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/nodes/{node_id}/connectors/{connector_id}:
    parameters:
      - name: node_id
        in: path
        required: true
        schema: { type: string }
      - name: connector_id
        in: path
        required: true
        schema: { type: string, pattern: '^ncon_' }
    delete:
      summary: Revoke this tenant's connector grant
      description: Revokes only the addressed tenant projection; it does not disconnect other services from the physical installation.
      tags: [Nodes]
      operationId: revokeNodeConnector
      responses:
        "204": { description: Connector revoked. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/printers:
    get:
      summary: List printers
      tags: [Printers]
      operationId: listPrinters
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Printers visible in the active environment.
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Printer"
                  next_cursor:
                    type: [string, "null"]
                  has_more:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/printers/{printer_id}:
    parameters:
      - name: printer_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Retrieve a printer with capability and profile snapshots
      tags: [Printers]
      operationId: getPrinter
      responses:
        "200":
          description: Printer in the authenticated workspace and environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Printer" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/printers/{printer_id}/content-encryption-key:
    parameters:
      - name: printer_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Retrieve the active dedicated content-encryption key for a printer's node
      tags: [Printers, Jobs]
      operationId: getPrinterContentEncryptionKey
      responses:
        "200":
          description: Tenant-scoped encryption recipient. This key cannot authenticate a node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeContentEncryptionKey" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/printers/{printer_id}/capabilities:
    parameters:
      - name: printer_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Retrieve the latest normalized capability document
      description: Returns display-safe, evidence-qualified facets. Driver-native payloads are never exposed here.
      tags: [Printers]
      operationId: getPrinterCapabilityDocument
      responses:
        "200":
          description: Latest capability document for the tenant-visible printer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityDocument" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/print-intents/validate:
    post:
      summary: Validate a capability-aware print intent without mutation
      tags: [Jobs]
      operationId: validatePrintIntent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrintIntentValidationRequest" }
      responses:
        "200":
          description: Deterministic validation findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintIntentValidation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/print-intents/resolve:
    post:
      summary: Resolve and persist a short-lived immutable print ticket
      description: The response is display-safe. Native profile blobs and undocumented driver bytes are never returned.
      tags: [Jobs]
      operationId: resolvePrintIntent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrintIntentValidationRequest" }
      responses:
        "201":
          description: Validated short-lived resolved ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedPrintTicket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/print-workflows:
    get:
      summary: List published active print workflows visible to the tenant
      tags: [Routing]
