              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                byte_length:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 52428800
      responses:
        "200":
          description: Upload verified and completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
