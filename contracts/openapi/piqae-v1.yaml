        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeUpdatePolicy" }
      responses:
        "200":
          description: Updated policy and state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeUpdate" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/nodes/{node_id}/rollback:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      summary: Request rollback to the locally retained verified version
      tags: [Nodes]
      operationId: rollbackNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata_url]
              properties:
                metadata_url: { type: string, format: uri }
      responses:
        "202":
          description: Rollback command queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeUpdate" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agent-enrolments:
    post:
      summary: Create a single-use agent enrolment
      tags: [Agents]
      operationId: createAgentEnrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                expires_in_seconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
                  default: 600
      responses:
        "201":
          description: Single-use enrolment token. The token is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expires_at]
                properties:
                  id:
                    type: string
                  token:
                    type: string
                    pattern: '^piq_enr_'
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/agents/enrol:
    post:
      summary: Consume a single-use enrolment and register an agent key
      tags: [Agents]
      operationId: enrolAgent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolRequest"
      responses:
        "201":
          description: Agent enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolResponse"
        "400":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/uploads:
    post:
      summary: Create a content upload
      tags: [Jobs]
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpload"
      responses:
        "201":
          description: Pending server-proxy upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/uploads/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      summary: Retrieve upload state
      description: Use after a transport interruption to determine whether the upload completed.
      tags: [Jobs]
      operationId: getUpload
      responses:
        "200":
          description: Upload in the authenticated workspace and environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/uploads/{upload_id}/content:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    put:
      summary: Upload content through the Piqae server
      tags: [Jobs]
      operationId: putUploadContent
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              contentEncoding: base64
          application/pdf:
            schema:
              type: string
              contentMediaType: application/pdf
              contentEncoding: base64
      responses:
        "200":
          description: Upload verified and completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      summary: Verify and complete a directly stored upload
      tags: [Jobs]
      operationId: completeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, byte_length]
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                byte_length:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 52428800
      responses:
        "200":
          description: Upload verified and completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/events/stream:
    get:
      summary: Stream environment events
      tags: [Events]
      operationId: streamEvents
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: SSE stream with resumable event identifiers.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/webhooks:
    get:
      summary: List webhook endpoints
      tags: [Webhooks]
      operationId: listWebhooks
      responses:
        "200":
          description: Webhook endpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a webhook endpoint
      tags: [Webhooks]
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        "201":
          description: Created webhook. The signing secret is shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Webhook"
                  - type: object
                    required: [secret]
                    properties:
                      secret:
                        type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/webhooks/{webhook_id}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    delete:
      summary: Delete a webhook endpoint
      tags: [Webhooks]
      operationId: deleteWebhook
      responses:
        "204":
          description: Webhook deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/webhooks/{webhook_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      summary: List webhook delivery attempts
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      responses:
        "200":
          description: Most recent delivery records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/webhook-deliveries/{delivery_id}/replay:
    parameters:
      - $ref: "#/components/parameters/DeliveryId"
    post:
      summary: Replay a webhook delivery
      tags: [Webhooks]
      operationId: replayWebhookDelivery
      responses:
        "202":
          description: Delivery scheduled for replay.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/agent/sync:
    post:
      summary: Synchronize agent health, printers, events, and job offers
      tags: [Agents]
      operationId: syncAgent
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSyncRequest"
      responses:
        "200":
          description: Commands and leased job candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSyncResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/accept:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Durably accept a leased job
      tags: [Agents, Jobs]
      operationId: acceptAgentJob
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAcceptRequest"
      responses:
        "200":
          description: Job accepted by the local queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAcceptResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/lease:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Renew an active job lease
      tags: [Agents, Jobs]
      operationId: renewAgentLease
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseCapability"
      responses:
        "200":
          description: Lease renewed.
          content:
            application/json:
              schema:
                type: object
                required: [lease_expires_at]
                properties:
                  lease_expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/release:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Release an active job lease
      tags: [Agents, Jobs]
      operationId: releaseAgentLease
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/LeaseCapability"
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      minLength: 1
      responses:
        "204":
          description: Lease released.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/content:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/LeaseIdHeader"
      - $ref: "#/components/parameters/LeaseTokenHeader"
    get:
      summary: Download uploaded job content under an active lease
      tags: [Agents, Jobs]
      operationId: downloadAgentJobContent
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      responses:
        "200":
          description: Original PDF or RAW bytes.
          headers:
            Digest:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
                contentEncoding: base64
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
                contentEncoding: base64
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  headers:
    RequestId:
      description: Request correlation ID used by response bodies and structured completion logs.
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: Piqae API key, local-owner session, or OIDC JWT
      description: API keys are scope-limited. Local-owner sessions are short-lived and self-host only. OIDC JWTs require issuer, expiry, organization, permissions, and either audience or an exact configured claim/value application binding.
    platformBearer:
      type: http
      scheme: bearer
      bearerFormat: Piqae platform service-account key
      description: |
        Operator-issued credential. Platform account-management routes use the
        bearer without tenant-selection headers. Account-scoped tenant routes
        require X-Piqae-Workspace-Id and X-Piqae-Environment-Id matching an
        active explicit grant. An ordinary API key cannot use these headers to
        change tenant.
    compatibilityBasic:
      type: http
      scheme: basic
      description: Piqae compatibility API key as the username with an empty password.
    agentId:
      type: apiKey
      in: header
      name: x-piqae-agent-id
    agentTimestamp:
      type: apiKey
      in: header
      name: x-piqae-timestamp
    agentNonce:
      type: apiKey
      in: header
      name: x-piqae-nonce
    agentBodyDigest:
      type: apiKey
      in: header
      name: x-piqae-body-sha256
    agentSignature:
      type: apiKey
      in: header
      name: x-piqae-signature
  parameters:
    CompatibilityLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    CompatibilityDirection:
      name: dir
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: desc }
    CompatibilityAfter:
      name: after
      in: query
      required: false
      description: Exclusive positive integer compatibility-ID cursor. Printer and job collections are bounded to the newest 500 hydrated records in V1.
      schema: { type: integer, minimum: 1 }
    ComputerSet:
      name: computer_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    PrinterSet:
      name: printer_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    JobSet:
      name: job_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 255
    PlatformWorkspaceId:
      name: X-Piqae-Workspace-Id
      in: header
      required: false
      description: Required only with a platform service-account credential and checked against its grants.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    PlatformEnvironmentId:
      name: X-Piqae-Environment-Id
      in: header
      required: false
      description: Required only with a platform service-account credential and checked against its workspace/environment grant.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^job_[0-9A-HJKMNP-TV-Z]{26}$
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^upl_[0-9A-HJKMNP-TV-Z]{26}$
    StockId:
      name: stock_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^stk_[0-9A-HJKMNP-TV-Z]{26}$
    TargetId:
      name: target_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tgt_[0-9A-HJKMNP-TV-Z]{26}$
    BindingId:
      name: binding_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tgb_[0-9A-HJKMNP-TV-Z]{26}$
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whk_[0-9A-HJKMNP-TV-Z]{26}$
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whd_[0-9A-HJKMNP-TV-Z]{26}$
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
    DeviceAuthorizationId:
      name: authorization_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^dva_[0-9A-HJKMNP-TV-Z]{26}$
    LeaseIdHeader:
      name: x-piqae-lease-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    LeaseTokenHeader:
      name: x-piqae-lease-token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    After:
      name: after
      in: query
      schema:
        type: string
  responses:
    CompatibilityCancelledIds:
      description: Numeric IDs successfully cancelled before durable agent acceptance. Unqualified collection deletion examines at most the newest 500 jobs in V1.
      content:
        application/json:
          schema:
            type: array
            items: { type: integer, minimum: 1 }
    Error:
      description: Request failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    BootstrapLocalOwner:
      type: object
      additionalProperties: false
      required: [workspace_name, email]
      properties:
        workspace_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 320 }
        display_name: { type: [string, "null"], maxLength: 120 }
    BootstrappedLocalOwner:
      type: object
      additionalProperties: false
      required: [credential, workspace, member]
      properties:
        credential:
          type: string
          pattern: '^piq_owner_'
          writeOnly: true
        workspace: { $ref: "#/components/schemas/Workspace" }
        member: { $ref: "#/components/schemas/WorkspaceMember" }
    ExchangeLocalOwnerCredential:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          pattern: '^piq_owner_'
          maxLength: 512
          writeOnly: true
    LocalOwnerSession:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          pattern: '^piq_session_'
          writeOnly: true
        expires_at: { type: string, format: date-time }
    CurrentIdentity:
      type: object
      additionalProperties: false
      required: [id, email, name, workspace_id, environment_id, roles]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        workspace_id: { type: string }
        environment_id: { type: string }
        roles:
          type: array
          items: { type: string, enum: [owner, admin, developer, operator, viewer, billing] }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        role: { type: string, enum: [owner, admin, developer, operator, viewer, billing] }
        status: { type: string, enum: [pending, active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlatformAccountEnvironment:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [test, live] }
    PlatformAccountEnvironments:
      type: object
      additionalProperties: false
      required: [test, live]
      properties:
        test: { $ref: "#/components/schemas/PlatformAccountEnvironment" }
        live: { $ref: "#/components/schemas/PlatformAccountEnvironment" }
    PlatformAccount:
      type: object
      additionalProperties: false
      required:
        [id, external_id, name, status, metadata, environments, created_at, updated_at]
      properties:
        id:
          type: string
          description: Piqae workspace ID. It is not supplied by the caller.
        external_id:
          type: string
          description: Stable platform-owned customer identifier.
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, suspended, cancelled] }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
        environments:
          $ref: "#/components/schemas/PlatformAccountEnvironments"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpsertPlatformAccount:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
    UsageSummary:
      type: object
      additionalProperties: false
      required:
        [
          period_start,
          period_end,
          reported_complete_live_jobs,
          active_nodes,
        ]
      properties:
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        reported_complete_live_jobs:
          type: integer
          format: int64
          minimum: 0
          description: |
            Billable Live-environment jobs first reported `completed_reported`
            during the period, plus legacy pre-cutover accepted-job ledger
            records retained for audit continuity.
        active_nodes: { type: integer, minimum: 0 }
    BillingEntitlement:
      type: object
      additionalProperties: false
      required:
        - included_live_jobs
        - node_limit
        - metadata_retention_days
        - document_retention_hours
        - overage_job_unit
        - overage_price_cents
      properties:
