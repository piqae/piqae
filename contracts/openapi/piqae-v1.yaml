        current_version: { type: string }
        available_version: { type: [string, "null"] }
        state: { type: string }
        download_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        deferred_reason: { type: [string, "null"] }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_success_at: { type: [string, "null"], format: date-time }
        last_error_code: { type: [string, "null"] }
        rollback_version: { type: [string, "null"] }
    NodeUpdate:
