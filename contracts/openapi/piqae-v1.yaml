        [id, job_id, sequence, state, reason, message, agent_id, native_job_id, occurred_at]
      properties:
        id:
          type: string
        job_id:
          type: string
        sequence:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/JobState"
        reason:
          type: [string, "null"]
        message:
          type: [string, "null"]
        agent_id:
          type: [string, "null"]
        native_job_id:
          type: [string, "null"]
        occurred_at:
          type: string
          format: date-time
    CreateStock:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sku: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        attributes: { $ref: "#/components/schemas/StockAttributes" }
    PatchStock:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sku: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        attributes: { $ref: "#/components/schemas/StockAttributes" }
        archived: { type: boolean }
    Stock:
      type: object
      required: [id, name, sku, description, attributes, archived, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^stk_[0-9A-HJKMNP-TV-Z]{26}$' }
        name: { type: string }
        sku: { type: [string, "null"] }
        description: { type: [string, "null"] }
        attributes: { $ref: "#/components/schemas/StockAttributes" }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StockAttributes:
      type: object
      description: Portable design facts only. Vendor-native settings remain opaque in the node profile.
      additionalProperties: true
      properties:
        kind:
          type: string
          enum: [sheet, label, roll, continuous, envelope, card]
        width_mm: { type: number, exclusiveMinimum: 0 }
        height_mm: { type: number, exclusiveMinimum: 0 }
        length_mm: { type: number, exclusiveMinimum: 0 }
        orientation:
          type: string
          enum: [portrait, landscape, either]
        gap_mm: { type: number, minimum: 0 }
        mark_interval_mm: { type: number, exclusiveMinimum: 0 }
        bleed_mm: { type: number, minimum: 0 }
        safe_area_mm:
          type: object
          additionalProperties: false
          required: [top, right, bottom, left]
          properties:
            top: { type: number, minimum: 0 }
            right: { type: number, minimum: 0 }
            bottom: { type: number, minimum: 0 }
            left: { type: number, minimum: 0 }
        source: { type: string }
        media: { type: string }
    CreateTarget:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        stock_id: { type: string }
        enabled: { type: boolean, default: true }
        routing_policy:
          type: string
          enum: [primary_then_standby]
          default: primary_then_standby
    PatchTarget:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        stock_id: { type: string }
        clear_stock: { type: boolean }
        enabled: { type: boolean }
        routing_policy: { type: string, enum: [primary_then_standby] }
    Target:
      type: object
      required: [id, name, description, stock_id, enabled, routing_policy, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^tgt_[0-9A-HJKMNP-TV-Z]{26}$' }
        name: { type: string }
        description: { type: [string, "null"] }
        stock_id: { type: [string, "null"] }
        enabled: { type: boolean }
        routing_policy: { type: string, enum: [primary_then_standby] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTargetBinding:
      type: object
      additionalProperties: false
      required: [printer_id, profile_id, profile_revision, role]
      properties:
        printer_id: { type: string }
        profile_id: { type: string, minLength: 1, maxLength: 120 }
        profile_revision: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [primary, standby] }
        enabled: { type: boolean, default: true }
    TargetBinding:
      type: object
      required:
        [id, target_id, printer_id, agent_id, profile_id, profile_revision, role, enabled, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^tgb_[0-9A-HJKMNP-TV-Z]{26}$' }
        target_id: { type: string }
        printer_id: { type: string }
        agent_id: { type: string }
        profile_id: { type: string }
        profile_revision: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [primary, standby] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BindingReadiness:
      type: object
      required: [binding, status, reasons]
      properties:
        binding: { $ref: "#/components/schemas/TargetBinding" }
        status:
          type: string
          enum:
            [ready, disabled, node_offline, destination_offline, destination_missing, needs_operator, profile_stale, driver_mismatch, dependency_missing, busy]
        reasons:
          type: array
          items: { type: string }
    TargetReadiness:
      type: object
      required: [target_id, status, selected_binding_id, bindings]
      properties:
        target_id: { type: string }
        status:
          type: string
          enum: [ready, target_has_no_ready_binding]
        selected_binding_id: { type: [string, "null"] }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/BindingReadiness" }
    DesignSpecificationDestination:
      type: object
      additionalProperties: false
      required: [binding, printer, profile]
      properties:
        binding: { $ref: "#/components/schemas/TargetBinding" }
        printer: { $ref: "#/components/schemas/Printer" }
        profile: { $ref: "#/components/schemas/PrinterProfileSnapshot" }
    DesignSpecification:
      type: object
      additionalProperties: false
      required: [target, stock, readiness, destinations, specification_revision]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        stock:
          oneOf:
            - { $ref: "#/components/schemas/Stock" }
            - { type: "null" }
        readiness: { $ref: "#/components/schemas/TargetReadiness" }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/DesignSpecificationDestination" }
        specification_revision:
          type: string
          description: Stable digest-like revision derived from target, stock, capability, profile and binding revisions.
    Printer:
      type: object
      required:
        [
          id,
          agent_id,
          name,
          state,
          capabilities,
          capability_revision,
          native_options,
          profiles,
          updated_at,
        ]
      properties:
        id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        state:
          $ref: "#/components/schemas/PrinterState"
        capabilities:
          $ref: "#/components/schemas/PrinterCapabilities"
        capability_revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic revision of the synced driver capability snapshot.
        native_options:
          type: object
          description: Complete driver-native option definitions keyed by stable driver option name.
          additionalProperties:
            $ref: "#/components/schemas/NativePrinterOption"
        profiles:
          type: array
          description: Named, immutable printer option snapshots synced from the agent.
          items:
            $ref: "#/components/schemas/PrinterProfileSnapshot"
        updated_at:
          type: string
          format: date-time
    PrinterCapabilities:
      type: object
      additionalProperties: false
      required:
        [
          bins,
          collate,
          color,
          copies,
          dpis,
          duplex,
          extent,
          medias,
          nup,
          papers,
          printrate,
          supports_custom_paper_size,
        ]
      properties:
        bins:
          type: array
          items:
            type: string
        collate:
          type: boolean
        color:
          type: boolean
        copies:
          type: integer
          minimum: 0
        dpis:
          type: array
          items:
            type: string
        duplex:
          type: boolean
        extent:
          type: array
          items:
            $ref: "#/components/schemas/PrinterExtent"
        medias:
          type: array
          items:
            type: string
        nup:
          type: array
          items:
            type: integer
            minimum: 0
        papers:
          type: object
          description: Paper dimensions keyed by driver paper name.
          additionalProperties:
            $ref: "#/components/schemas/PrinterPaperDimensions"
        printrate:
          anyOf:
            - $ref: "#/components/schemas/PrintRate"
            - type: "null"
        supports_custom_paper_size:
          type: boolean
    PrinterExtent:
      type: array
      description: A two-dimensional driver-reported printer extent.
      prefixItems:
        - type: integer
          minimum: 0
        - type: integer
          minimum: 0
      items: false
      minItems: 2
      maxItems: 2
    PrinterPaperDimensions:
      type: array
      description: Optional driver-reported width and height.
      prefixItems:
        - type: [integer, "null"]
          minimum: 0
        - type: [integer, "null"]
          minimum: 0
      items: false
      minItems: 2
      maxItems: 2
    PrintRate:
      type: object
      additionalProperties: false
      required: [unit, rate]
      properties:
        unit:
          type: string
          enum: [ppm, ipm, lmp, cpm]
        rate:
          type: number
          format: float
    NativePrinterOption:
      type: object
      additionalProperties: false
      required: [display_name, default_choice, selected_choice, choices]
      properties:
        display_name:
          type: string
        default_choice:
          type: [string, "null"]
        selected_choice:
          type: [string, "null"]
        choices:
          type: array
          items:
            $ref: "#/components/schemas/NativePrinterChoice"
    NativePrinterChoice:
      type: object
      additionalProperties: false
      required: [value, display_name]
      properties:
        value:
          type: string
        display_name:
          type: string
    PrinterProfileSnapshot:
      type: object
      additionalProperties: false
      required: [profile_id, revision, name, is_default, options]
      properties:
        profile_id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
        is_default:
          type: boolean
        options:
          $ref: "#/components/schemas/JobOptions"
        status:
          type: string
          enum:
            [
              draft,
              capturing,
              ready,
              needs_test,
              stale,
              driver_mismatch,
              destination_missing,
              dependency_missing,
              interactive_only,
              invalid,
              retired,
            ]
        native_kind:
          type: string
          enum:
            [
              portable_options,
              cups_options,
              cups_instance,
              macos_printcore,
              windows_devmode,
              windows_printticket,
            ]
        native_digest:
          type: [string, "null"]
          description: Digest of the node-local opaque native configuration. The native blob is never returned.
        driver_fingerprint:
          anyOf:
            - $ref: "#/components/schemas/DriverFingerprint"
            - type: "null"
        summary:
          $ref: "#/components/schemas/PrintProfileSummary"
        stock_id:
          type: [string, "null"]
        safe_overrides:
          type: array
          items:
            type: string
        last_validated_at:
          type: [string, "null"]
          format: date-time
        last_test_job_id:
          type: [string, "null"]
        published:
          type: boolean
    DriverFingerprint:
      type: object
      additionalProperties: false
      required:
        [
          platform,
          driver_name,
          driver_version,
          architecture,
          native_queue_id,
          device_fingerprint,
        ]
      properties:
        platform:
          type: string
        driver_name:
          type: string
        driver_version:
          type: [string, "null"]
        architecture:
          type: [string, "null"]
        native_queue_id:
          type: string
        device_fingerprint:
          type: [string, "null"]
    PrintProfileSummary:
      type: object
      additionalProperties: false
      properties:
        paper:
          type: [string, "null"]
        dimensions_mm:
          type: [array, "null"]
          prefixItems:
            - type: number
            - type: number
          items: false
          minItems: 2
          maxItems: 2
        source:
          type: [string, "null"]
        media:
          type: [string, "null"]
        color:
          type: [string, "null"]
        duplex:
          type: [string, "null"]
        resolution:
          type: [string, "null"]
        copies:
          type: [integer, "null"]
          minimum: 0
        native:
          type: object
          additionalProperties:
            type: string
    PrinterState:
      type: string
      enum: [online, offline, paused, busy, paper_out, error, unknown]
    Agent:
      type: object
      required: [id, name, platform, state, version, last_seen_at]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        state:
          enum: [connected, disconnected, paused, degraded]
        version:
          type: string
        last_seen_at:
          type: string
          format: date-time
    Webhook:
      type: object
      required: [id, url, events, enabled, created_at]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      required:
        [id, event_id, attempt, next_attempt_at, response_status, delivered_at, dead_lettered_at]
      properties:
        id:
          type: string
        event_id:
          type: string
        attempt:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        response_status:
          type: [integer, "null"]
        delivered_at:
          type: [string, "null"]
          format: date-time
        dead_lettered_at:
          type: [string, "null"]
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            retryable:
              type: boolean
            details:
              type: object
