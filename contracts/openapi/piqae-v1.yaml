        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/agent/content-encryption-key:
    put:
      summary: Register or rotate the node's dedicated content-encryption key
      tags: [Agents]
      operationId: registerAgentContentEncryptionKey
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterNodeContentEncryptionKey" }
      responses:
        "200":
          description: Active key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeContentEncryptionKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/agent/content-encryption-key/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Revoke a dedicated node content-encryption key
      tags: [Agents]
      operationId: revokeAgentContentEncryptionKey
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      responses:
        "204": { description: Key revoked. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agent/jobs/{job_id}/accept:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Durably accept a leased job
      tags: [Agents, Jobs]
      operationId: acceptAgentJob
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAcceptRequest"
      responses:
        "200":
          description: Job accepted by the local queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAcceptResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/lease:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Renew an active job lease
      tags: [Agents, Jobs]
      operationId: renewAgentLease
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseCapability"
      responses:
        "200":
          description: Lease renewed.
          content:
            application/json:
              schema:
                type: object
                required: [lease_expires_at]
                properties:
                  lease_expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/release:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Release an active job lease
      tags: [Agents, Jobs]
      operationId: releaseAgentLease
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/LeaseCapability"
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      minLength: 1
      responses:
        "204":
          description: Lease released.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/agent/jobs/{job_id}/content:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/LeaseIdHeader"
      - $ref: "#/components/parameters/LeaseTokenHeader"
    get:
      summary: Download uploaded job content under an active lease
      tags: [Agents, Jobs]
      operationId: downloadAgentJobContent
      security:
        - agentId: []
          agentTimestamp: []
          agentNonce: []
          agentBodyDigest: []
          agentSignature: []
      responses:
        "200":
          description: Original PDF or RAW bytes.
          headers:
            Digest:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
                contentEncoding: base64
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
                contentEncoding: base64
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/business-document-templates:
    post:
      summary: Create a draft document template
      tags: [Documents]
      operationId: createBusinessDocumentTemplate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBusinessDocumentTemplate" }
      responses:
        "200":
          description: Existing idempotent draft template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentTemplate" }
        "201":
          description: Draft template created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentTemplate" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/business-document-templates/{template_id}:
    get:
      summary: Retrieve a document template
      tags: [Documents]
      operationId: retrieveBusinessDocumentTemplate
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current template metadata and draft specification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentTemplate" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/business-document-templates/{template_id}/publish:
    post:
      summary: Publish an immutable document template revision
      tags: [Documents]
      operationId: publishBusinessDocumentTemplate
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishBusinessDocumentTemplate" }
      responses:
        "200":
          description: Existing idempotent immutable revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentTemplateRevision" }
        "201":
          description: Immutable revision published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentTemplateRevision" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/business-document-template-revisions/{revision_id}:
    get:
      summary: Retrieve an immutable document template revision
      tags: [Documents]
      operationId: retrieveBusinessDocumentTemplateRevision
      parameters:
        - name: revision_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published immutable template revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentTemplateRevision" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/business-document-renders:
    post:
      summary: Register an asynchronous document render
      tags: [Documents]
      operationId: createBusinessDocumentRender
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBusinessDocumentRender" }
      responses:
        "200":
          description: Existing idempotent render registration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentRender" }
        "202":
          description: Render durably registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentRender" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/business-document-resources/{digest}:
    put:
      summary: Store an immutable content-addressed business-document resource
      tags: [Documents]
      operationId: putBusinessDocumentResource
      parameters:
        - name: digest
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Sha256Hex" }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 4194304 }
      responses:
        "204": { description: Resource verified and stored idempotently. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/business-document-renders/{render_id}:
    get:
      summary: Retrieve a document render
      tags: [Documents]
      operationId: retrieveBusinessDocumentRender
      parameters:
        - name: render_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Render lifecycle and artifact metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentRender" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/business-document-renders/{render_id}/render-readiness:
    post:
      summary: Evaluate exact destination readiness and render policy
      tags: [Documents]
      operationId: evaluateBusinessDocumentRenderReadiness
      parameters:
        - name: render_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateBusinessDocumentRenderReadiness" }
      responses:
        "200":
          description: Auditable policy decision using the destination's last authenticated capability report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocumentRenderReadiness" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/business-document-renders/{render_id}/artifact:
    get:
      summary: Download a completed document render artifact
      description: Authenticated same-origin PDF download. The response never exposes an object-store key or signed URL.
      tags: [Documents]
      operationId: downloadBusinessDocumentRenderArtifact
      parameters:
        - name: render_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Integrity-verified PDF artifact.
          headers:
            Content-Disposition:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
            Digest:
              description: RFC Digest field using a standard Base64-encoded SHA-256 value.
              schema: { type: string, pattern: '^sha-256=[A-Za-z0-9+/]{43}=$' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/business-document-renders/{render_id}/print:
    post:
      summary: Register a print job for a completed document render
      tags: [Documents]
      operationId: printBusinessDocumentRender
      parameters:
        - name: render_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrintBusinessDocumentRender" }
      responses:
        "200":
          description: Existing idempotent print job; this is not proof of physical delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "201":
          description: Durable print job registered; this is not proof of physical delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/business-document-renders/{render_id}/previews:
    post:
      summary: Create an expiring approval gate for a completed render
      description: Retains the exact rendered artifact. No print job is created before approval.
      tags: [Documents]
      operationId: createBusinessDocumentPreview
      parameters:
        - name: render_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBusinessDocumentPreview" }
      responses:
        "200": { description: Existing idempotent preview, content: { application/json: { schema: { $ref: "#/components/schemas/BusinessDocumentPreview" } } } }
        "201": { description: Preview awaiting approval, content: { application/json: { schema: { $ref: "#/components/schemas/BusinessDocumentPreview" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/business-document-previews/{preview_id}:
    get:
      summary: Retrieve a document preview approval gate
      tags: [Documents]
      operationId: retrieveBusinessDocumentPreview
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Preview lifecycle, content: { application/json: { schema: { $ref: "#/components/schemas/BusinessDocumentPreview" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/business-document-previews/{preview_id}/artifact:
    get:
      summary: Download the exact artifact held by a live preview
      tags: [Documents]
      operationId: downloadBusinessDocumentPreviewArtifact
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Integrity-verified PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/business-document-previews/{preview_id}/approve:
    post:
      summary: Approve a preview and idempotently create exactly one print job
      tags: [Documents]
      operationId: approveBusinessDocumentPreview
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrintBusinessDocumentRender" }
      responses:
        "200": { description: Approved preview and idempotent job, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovedBusinessDocumentPreview" } } } }
        "201": { description: Approved preview and newly registered job, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovedBusinessDocumentPreview" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/business-document-previews/{preview_id}/cancel:
    post:
      summary: Cancel a preview before approval
      tags: [Documents]
      operationId: cancelBusinessDocumentPreview
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Cancelled preview, content: { application/json: { schema: { $ref: "#/components/schemas/BusinessDocumentPreview" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  headers:
    RequestId:
      description: Request correlation ID used by response bodies and structured completion logs.
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: Piqae API key, local-owner session, or OIDC JWT
      description: API keys are scope-limited. Local-owner sessions are short-lived and self-host only. OIDC JWTs require issuer, expiry, organization, permissions, and either audience or an exact configured claim/value application binding.
    platformBearer:
      type: http
      scheme: bearer
      bearerFormat: Piqae platform service-account key
      description: |
        Operator-issued credential. Platform account-management routes use the
        bearer without tenant-selection headers. Account-scoped tenant routes
        require X-Piqae-Workspace-Id and X-Piqae-Environment-Id matching an
        active explicit grant. An ordinary API key cannot use these headers to
        change tenant.
    compatibilityBasic:
      type: http
      scheme: basic
      description: Piqae compatibility API key as the username with an empty password.
    agentId:
      type: apiKey
      in: header
      name: x-piqae-agent-id
    agentTimestamp:
      type: apiKey
      in: header
      name: x-piqae-timestamp
    agentNonce:
      type: apiKey
      in: header
      name: x-piqae-nonce
    agentBodyDigest:
      type: apiKey
      in: header
      name: x-piqae-body-sha256
    agentSignature:
      type: apiKey
      in: header
      name: x-piqae-signature
  parameters:
    CompatibilityLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    CompatibilityDirection:
      name: dir
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: desc }
    CompatibilityAfter:
      name: after
      in: query
      required: false
      description: Exclusive positive integer compatibility-ID cursor. Printer and job collections are bounded to the newest 500 hydrated records in V1.
      schema: { type: integer, minimum: 1 }
    ComputerSet:
      name: computer_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    PrinterSet:
      name: printer_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    JobSet:
      name: job_set
      in: path
      required: true
      description: Comma-separated positive integer compatibility IDs.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 255
    PlatformWorkspaceId:
      name: X-Piqae-Workspace-Id
      in: header
      required: false
      description: Required only with a platform service-account credential and checked against its grants.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    PlatformEnvironmentId:
      name: X-Piqae-Environment-Id
      in: header
      required: false
      description: Required only with a platform service-account credential and checked against its workspace/environment grant.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^job_[0-9A-HJKMNP-TV-Z]{26}$
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^upl_[0-9A-HJKMNP-TV-Z]{26}$
    StockId:
      name: stock_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^stk_[0-9A-HJKMNP-TV-Z]{26}$
    TargetId:
      name: target_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tgt_[0-9A-HJKMNP-TV-Z]{26}$
    BindingId:
      name: binding_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tgb_[0-9A-HJKMNP-TV-Z]{26}$
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whk_[0-9A-HJKMNP-TV-Z]{26}$
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whd_[0-9A-HJKMNP-TV-Z]{26}$
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
    DeviceAuthorizationId:
      name: authorization_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^dva_[0-9A-HJKMNP-TV-Z]{26}$
    LeaseIdHeader:
      name: x-piqae-lease-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    LeaseTokenHeader:
      name: x-piqae-lease-token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    After:
      name: after
      in: query
      schema:
        type: string
  responses:
    CompatibilityCancelledIds:
      description: Numeric IDs successfully cancelled before durable agent acceptance. Unqualified collection deletion examines at most the newest 500 jobs in V1.
      content:
        application/json:
          schema:
            type: array
            items: { type: integer, minimum: 1 }
    Error:
      description: Request failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    BootstrapLocalOwner:
      type: object
      additionalProperties: false
      required: [workspace_name, email]
      properties:
        workspace_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 320 }
        display_name: { type: [string, "null"], maxLength: 120 }
    BootstrappedLocalOwner:
      type: object
      additionalProperties: false
      required: [credential, workspace, member]
      properties:
        credential:
          type: string
          pattern: '^piq_owner_'
          writeOnly: true
        workspace: { $ref: "#/components/schemas/Workspace" }
        member: { $ref: "#/components/schemas/WorkspaceMember" }
    ExchangeLocalOwnerCredential:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          pattern: '^piq_owner_'
          maxLength: 512
          writeOnly: true
    LocalOwnerSession:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          pattern: '^piq_session_'
          writeOnly: true
        expires_at: { type: string, format: date-time }
    CurrentIdentity:
      type: object
      additionalProperties: false
      required: [id, email, name, workspace_id, environment_id, roles]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        workspace_id: { type: string }
        environment_id: { type: string }
        roles:
          type: array
          items: { type: string, enum: [owner, admin, developer, operator, viewer, billing] }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        role: { type: string, enum: [owner, admin, developer, operator, viewer, billing] }
        status: { type: string, enum: [pending, active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlatformStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether this workspace owns an active platform integration.
    PlatformEnableResult:
      type: object
      additionalProperties: false
      required: [enabled, secret]
      properties:
        enabled: { type: boolean, const: true }
        secret:
          type: string
          writeOnly: true
          description: One-time platform credential for server-side storage.
    PlatformCredential:
      type: object
      additionalProperties: false
      required: [id, name, lookup_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        lookup_prefix:
          type: string
          description: Non-secret credential prefix suitable for identification.
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    PlatformCredentialSecret:
      type: object
      additionalProperties: false
      required: [id, name, lookup_prefix, created_at, secret]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        lookup_prefix:
          type: string
          description: Non-secret credential prefix suitable for identification.
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        secret:
          type: string
          writeOnly: true
          description: One-time replacement platform credential.
    PlatformAccountEnvironment:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [test, live] }
    PlatformAccountEnvironments:
      type: object
      additionalProperties: false
      required: [test, live]
      properties:
        test: { $ref: "#/components/schemas/PlatformAccountEnvironment" }
        live: { $ref: "#/components/schemas/PlatformAccountEnvironment" }
    PlatformAccount:
      type: object
      additionalProperties: false
      required:
        [id, external_id, name, status, metadata, environments, created_at, updated_at]
      properties:
        id:
          type: string
          description: Piqae workspace ID. It is not supplied by the caller.
        external_id:
          type: string
          description: Stable platform-owned customer identifier.
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, suspended, cancelled] }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
        environments:
          $ref: "#/components/schemas/PlatformAccountEnvironments"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpsertPlatformAccount:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
    UsageSummary:
      type: object
      additionalProperties: false
      required:
        [
          period_start,
          period_end,
          reported_complete_live_jobs,
          active_nodes,
        ]
      properties:
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        reported_complete_live_jobs:
          type: integer
          format: int64
          minimum: 0
          description: |
            Billable Live-environment jobs first reported `completed_reported`
            during the period, plus legacy pre-cutover accepted-job ledger
            records retained for audit continuity.
        active_nodes: { type: integer, minimum: 0 }
    BillingEntitlement:
      type: object
      additionalProperties: false
      required:
        - included_live_jobs
        - node_limit
        - metadata_retention_days
        - document_retention_hours
        - overage_job_unit
        - overage_price_cents
      properties:
        included_live_jobs: { type: integer, format: int64, minimum: 0 }
        node_limit: { type: integer, minimum: 1 }
        metadata_retention_days: { type: integer, minimum: 1 }
        document_retention_hours: { type: integer, minimum: 0 }
        overage_job_unit: { type: [integer, "null"], format: int64, minimum: 1 }
        overage_price_cents: { type: [integer, "null"], format: int64, minimum: 0 }
    BillingSummary:
      type: object
      additionalProperties: false
      required:
        - enabled
        - managed_by_platform
        - plan
        - billing_interval
        - subscription_status
        - grace_ends_at
        - accept_new_cloud_jobs
        - entitlement
        - usage
        - overage_live_jobs
      properties:
        enabled:
          type: boolean
          description: False for self-hosted and local-only deployments.
        managed_by_platform:
          type: boolean
          description: Whether an owning platform workspace pays for this workspace.
        plan: { type: [string, "null"], enum: [free, pro, null] }
        billing_interval:
          type: [string, "null"]
          enum: [monthly, annual, null]
          description: The Stripe subscription period used for usage and overage accounting.
        subscription_status:
          type: [string, "null"]
          enum: [active, trialing, past_due, unpaid, paused, cancelled, null]
        grace_ends_at: { type: [string, "null"], format: date-time }
        accept_new_cloud_jobs: { type: boolean }
        entitlement:
          oneOf:
            - $ref: "#/components/schemas/BillingEntitlement"
            - type: "null"
        usage: { $ref: "#/components/schemas/UsageSummary" }
        overage_live_jobs: { type: integer, format: int64, minimum: 0 }
    StripeWebhookReceipt:
      type: object
      additionalProperties: false
      required: [received, duplicate]
      properties:
        received: { type: boolean, const: true }
        duplicate: { type: boolean }
    WorkOsWebhookReceipt:
      type: object
      additionalProperties: false
      required: [received, duplicate, applied]
      properties:
        received: { type: boolean, const: true }
        duplicate: { type: boolean }
        applied:
          type: boolean
          description: False when the event was a duplicate, stale, or intentionally ignored.
    CompatibilityWhoAmI:
      type: object
      required: [id, email, canCreateSubAccounts, credits, numComputers, totalPrints, versions]
      properties:
        id: { type: integer, minimum: 1 }
        email: { type: string, format: email }
        canCreateSubAccounts: { type: boolean }
        credits: { type: integer }
        numComputers: { type: integer, minimum: 0 }
        totalPrints: { type: integer, minimum: 0 }
        versions:
          type: array
          items: { type: string }
    CompatibilityComputer:
      type: object
      required: [id, name, state, version]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        state: { type: string, enum: [connected, disconnected] }
        version: { type: string }
    CompatibilityPrinter:
      type: object
      required: [id, name, computer, default, state, capabilities]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        computer:
          type: object
          required: [id]
          properties:
            id: { type: integer, minimum: 1 }
        default: { type: boolean }
        state: { type: string, enum: [online, offline] }
        capabilities: { type: object, additionalProperties: true }
    CompatibilityPrintJob:
      type: object
      required: [id, printer, title, contentType, state, createTimestamp]
      properties:
        id: { type: integer, minimum: 1 }
        printer:
          type: object
          required: [id]
          properties:
            id: { type: integer, minimum: 1 }
        title: { type: string }
        contentType: { type: string, enum: [pdf, raw] }
        source: { type: [string, "null"] }
        state: { type: string, enum: [new, sent_to_client, done, error, expired] }
        createTimestamp: { type: integer }
    CompatibilityPrintJobState:
      type: object
      required: [id, state, age]
      properties:
        id: { type: integer, minimum: 1 }
        state: { type: string, enum: [new, sent_to_client, done, error, expired] }
        age: { type: integer, minimum: 0 }
    CompatibilityCreatePrintJob:
      type: object
      required: [printerId, title, contentType, content]
      properties:
        printerId: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1 }
        contentType:
          type: string
          enum: [pdf_base64, raw_base64, pdf_uri, raw_uri]
        content: { type: string }
        source: { type: string }
        qty: { type: integer, minimum: 1, maximum: 100, default: 1 }
        expireAfter: { type: integer, minimum: 1, maximum: 1209600 }
        options: { type: object, additionalProperties: true }
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    DeploymentMeta:
      type: object
      additionalProperties: false
      required: [deployment, version, auth, billing, updates, platform]
      properties:
        deployment: { type: string, enum: [cloud, self_hosted, local] }
        version: { type: string }
        auth:
          type: object
          additionalProperties: false
          required: [provider, workspace_switching, invitations]
          properties:
            provider: { type: string, enum: [workos, local_owner, oidc, hybrid, none] }
            workspace_switching: { type: boolean }
            invitations: { type: boolean }
        billing:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled: { type: boolean }
        updates:
          type: object
          additionalProperties: false
          required: [official_feed, custom_feed]
          properties:
            official_feed: { type: boolean }
            custom_feed: { type: boolean }
        platform:
          type: object
          additionalProperties: false
          required: [accounts]
          properties:
            accounts:
              type: boolean
              description: Whether platform-owned customer account management is available.
    CreateDeviceAuthorization:
      type: object
      additionalProperties: false
      required:
        [public_key, installation_id, proposed_name, hostname, platform, architecture, installation_mode, agent_version, protocol_version]
      properties:
        public_key: { type: string, contentEncoding: base64url }
        installation_id: { type: string, minLength: 1, maxLength: 160 }
        proposed_name: { type: string, minLength: 1, maxLength: 120 }
        hostname: { type: string, minLength: 1, maxLength: 255 }
        platform: { type: string, minLength: 1, maxLength: 40 }
        architecture: { type: string, minLength: 1, maxLength: 40 }
        installation_mode: { type: string, enum: [user, machine, local] }
        agent_version: { type: string, minLength: 1, maxLength: 40 }
        protocol_version: { type: integer, minimum: 1 }
    CreateNodeConnectSession:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional operator label. When omitted, the native node supplies its local computer name during acceptance.
        return_url: { type: string, format: uri }
        expires_in_seconds: { type: integer, minimum: 60, maximum: 900, default: 600 }
    NodeConnectDownload:
      type: object
      additionalProperties: false
      required: [platform, url]
      properties:
        platform: { type: string, enum: [macos, windows, linux] }
        url:
          type: string
          format: uri-reference
          description: Navigation choice for that OS; it does not assert that a signed or Supported artifact is published.
    NodeConnectSession:
      type: object
      additionalProperties: false
      required: [id, state, expires_at, node_id, downloads]
      properties:
        id: { type: string, pattern: '^enr_' }
        state: { type: string, enum: [pending, connected, expired] }
        expires_at: { type: string, format: date-time }
        node_id: { type: [string, "null"] }
        connect_url: { type: [string, "null"], format: uri, description: HTTPS handoff and installer fallback returned only at creation. }
        native_connect_url:
          type: [string, "null"]
          description: One-time piqae:// native-app handoff returned only at creation. Launch only from an explicit user gesture and fall back to connect_url.
        return_url: { type: [string, "null"], format: uri, description: Returned only at creation. }
        downloads:
          type: array
          items: { $ref: "#/components/schemas/NodeConnectDownload" }
    NodeConnector:
      type: object
      additionalProperties: false
      required: [id, node_id, permissions, revoked_at, created_at]
      properties:
        id: { type: string, pattern: '^ncon_' }
        node_id: { type: string }
        permissions:
          type: object
          additionalProperties: true
          description: Versioned connector capabilities; unknown keys must be ignored.
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    CreatedDeviceAuthorization:
      type: object
      additionalProperties: false
      required: [id, device_code, user_code, verification_uri, expires_in, interval]
      properties:
        id: { type: string, pattern: '^dva_' }
        device_code:
          type: string
          pattern: '^piq_dev_'
        user_code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$' }
        verification_uri: { type: string }
        expires_in: { type: integer, const: 600 }
        interval: { type: integer, minimum: 1 }
    DecideDeviceAuthorization:
      type: object
      additionalProperties: false
      required: [user_code]
      properties:
        user_code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{4}-?[2-9A-HJ-NP-Z]{4}$' }
    DeviceCodeRequest:
      type: object
      additionalProperties: false
      required: [device_code]
      properties:
        device_code:
          type: string
          pattern: '^piq_dev_'
          description: >-
            Piqae device code. Carried in the request body rather than the path
            because it is a bearer secret for the pairing exchange.
    DeviceAuthorizationStatus:
      type: object
      additionalProperties: false
      required: [id, state, expires_at]
      properties:
        id: { type: string, pattern: '^dva_' }
        state: { type: string, enum: [pending, approved, denied, consumed, expired] }
        expires_at: { type: string, format: date-time }
    DeviceAuthorizationReview:
      type: object
      additionalProperties: false
      required: [id, proposed_name, hostname, platform, architecture, state, expires_at]
      properties:
        id: { type: string, pattern: '^dva_' }
        proposed_name: { type: string }
        hostname: { type: string }
        platform: { type: string }
        architecture: { type: string }
        state: { type: string, enum: [pending, approved, denied, consumed, expired] }
        expires_at: { type: string, format: date-time }
        replaces_node_id:
          type: [string, "null"]
          description: >-
            The node whose device key this approval would replace, when the
            request comes from an installation already paired to this workspace.
            Null when approving admits a new node.
    DeviceAuthorizationExchange:
      type: object
      additionalProperties: false
      required: [node_id, workspace_id, environment_id, server_time, sync_after_ms]
      properties:
        node_id: { type: string }
        workspace_id: { type: string }
        environment_id: { type: string }
        server_time: { type: string, format: date-time }
        sync_after_ms: { type: integer, minimum: 0 }
    NodeUpdatePolicy:
      type: object
      additionalProperties: false
      required: [channel, mode, pinned_version, maintenance_window]
      properties:
        channel: { type: string, enum: [stable, canary, pinned] }
        mode: { type: string, enum: [automatic, prompt, disabled] }
        pinned_version: { type: [string, "null"], maxLength: 64 }
        maintenance_window: { type: [object, "null"] }
    NodeUpdateState:
      type: object
      required:
        [current_version, available_version, state, download_percent, deferred_reason, last_checked_at, last_success_at, last_error_code, rollback_version]
      properties:
        current_version: { type: string }
        available_version: { type: [string, "null"] }
        state: { type: string }
        download_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        deferred_reason: { type: [string, "null"] }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_success_at: { type: [string, "null"], format: date-time }
        last_error_code: { type: [string, "null"] }
        rollback_version: { type: [string, "null"] }
    NodeUpdate:
      type: object
      additionalProperties: false
      required: [node_id, policy, status]
      properties:
        node_id: { type: string }
        policy: { $ref: "#/components/schemas/NodeUpdatePolicy" }
        status: { $ref: "#/components/schemas/NodeUpdateState" }
    ApiKeyScope:
      type: string
      enum:
        - api_keys_read
        - api_keys_write
        - agents_read
        - agents_write
        - printers_read
        - printers_write
        - jobs_read
        - jobs_write
        - webhooks_read
        - webhooks_write
        - usage_read
        - audit_read
    CreateApiKey:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Optional expiry no more than 365 days in the future.
    ApiKey:
      type: object
      required:
        [id, name, lookup_prefix, scopes, expires_at, last_used_at, revoked_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lookup_prefix:
          type: string
          description: Non-secret prefix suitable for identifying the key.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              writeOnly: true
              description: Plaintext API key returned only by the create operation.
    Sha256:
      type: string
      pattern: ^[0-9a-fA-F]{64}$
    CreateUpload:
      type: object
      additionalProperties: false
      required: [media_type, byte_length, sha256]
      properties:
        media_type:
          type: string
          enum: [application/pdf, application/octet-stream]
        byte_length:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
        sha256:
          $ref: "#/components/schemas/Sha256"
    Upload:
      type: object
      required:
        [id, object_key, media_type, expected_sha256, expected_bytes, state, expires_at]
      properties:
        id:
          type: string
        object_key:
          type: string
        media_type:
          type: string
          enum: [application/pdf, application/octet-stream]
        expected_sha256:
          $ref: "#/components/schemas/Sha256"
        expected_bytes:
          type: integer
          format: int64
        state:
          type: string
          enum: [pending, complete, expired]
        expires_at:
          type: string
          format: date-time
    UploadResponse:
      allOf:
        - $ref: "#/components/schemas/Upload"
        - type: object
          required: [upload_url, upload_method, upload_headers, requires_completion]
          properties:
            upload_url:
              type: string
              description: Relative authenticated proxy URL or an absolute, time-limited object-store URL.
            upload_method:
              type: string
              enum: [PUT]
            upload_headers:
              type: object
              additionalProperties: { type: string }
            requires_completion:
              type: boolean
              description: Direct object-store uploads require POST complete; proxy uploads complete during PUT.
    EnrolRequest:
      type: object
      additionalProperties: false
      required:
        [token, public_key, name, hostname, platform, architecture, installation_mode, agent_version, protocol_version]
      properties:
        token:
          type: string
          pattern: '^piq_enr_'
        public_key:
          type: string
          description: Base64url or standard Base64 Ed25519 public key (32 decoded bytes).
        name:
          type: string
        hostname:
          type: string
        platform:
          type: string
        architecture:
          type: string
        installation_mode:
          type: string
          enum: [machine, user, local]
        agent_version:
          type: string
        protocol_version:
          type: integer
          enum: [1]
        installation_id:
          type: string
          minLength: 8
          maxLength: 128
          description: Stable physical installation ID when adding an isolated connector.
        allowed_printer_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
          description: Exact printer IDs approved by the local operator when printer_grant is selected_printers; empty never means all.
        printer_grant:
          type: string
          enum: [selected_printers, all_local_printers]
          default: selected_printers
          description: Durable local authorization policy. all_local_printers includes printers discovered after connection.
        installation_proof:
          type: string
          description: Ed25519 signature by the immutable physical installation key over the versioned invitation, connector key, and printer grant.
    EnrolResponse:
      type: object
      required: [agent_id, environment, server_time, sync_after_ms]
      properties:
        agent_id:
          type: string
        environment:
          type: string
        server_time:
          type: string
          format: date-time
        sync_after_ms:
          type: integer
          format: int64
          minimum: 0
        connector_id:
          type: string
          pattern: '^ncon_'
    ConnectSessionPreviewRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^piq_enr_', maxLength: 128 }
    ConnectSessionPreview:
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - workspace_name
        - requesting_service_account_id
        - requesting_service_name
        - authorization_type
        - environment_id
        - requested_scopes
        - printer_grant
        - expires_at
        - return_url
      properties:
        workspace_id: { type: string, description: Server-resolved customer workspace identifier. }
        workspace_name: { type: string, description: Server-resolved customer workspace display name; not the requesting integrator identity. }
        requesting_service_account_id: { type: [string, "null"], description: "Server-authenticated platform service account snapshot, or null for a direct workspace credential." }
        requesting_service_name: { type: [string, "null"], description: "Server-authenticated platform display name snapshot, or null for a direct workspace credential." }
        authorization_type: { type: string, enum: [workspace, platform_customer], description: Server-authenticated relationship being authorized; never trusted from the application link. }
        environment_id: { type: string }
        requested_scopes:
          type: array
          items: { type: string, enum: [discover_printers, print, monitor_jobs] }
        printer_grant: { type: string, enum: [all_or_selected] }
        expires_at: { type: string, format: date-time }
        return_url: { type: [string, "null"], format: uri, description: Server-bound completion destination; never accepted from an application-link fragment. }
    QueueSnapshot:
      type: object
      additionalProperties: false
      required: [queued_jobs, active_jobs, content_bytes, accepts_jobs]
      properties:
        queued_jobs:
          type: integer
          minimum: 0
        active_jobs:
          type: integer
          minimum: 0
        content_bytes:
          type: integer
          format: int64
          minimum: 0
        accepts_jobs:
          type: boolean
    AgentHealth:
      type: object
      additionalProperties: false
      required:
        [started_at, observed_at, sqlite_integrity_ok, executor_crashes, last_error_code]
      properties:
        started_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        sqlite_integrity_ok:
          type: boolean
        executor_crashes:
          type: integer
          format: int64
          minimum: 0
        last_error_code:
          type: [string, "null"]
    PrinterSnapshot:
      type: object
      additionalProperties: false
      required: [id, native_id, name, state, is_default, capabilities]
      properties:
        id:
          type: string
        native_id:
          type: string
        name:
          type: string
        state:
          $ref: "#/components/schemas/PrinterState"
