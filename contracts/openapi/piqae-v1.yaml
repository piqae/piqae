          application/json:
            schema: { $ref: "#/components/schemas/DecideDeviceAuthorization" }
      responses:
        "200":
          description: Pairing approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
