            application/json:
              schema:
                type: object
                required: [request_id, state]
                properties:
                  request_id: { type: string, pattern: '^diag_' }
                  state: { const: requested }
        "404": { $ref: "#/components/responses/Error" }
    get:
      summary: List retained redacted diagnostic reports
      tags: [Nodes]
      operationId: listNodeDiagnostics
      responses:
        "200":
          description: At most fifty unexpired reports, newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: "#/components/schemas/NodeDiagnostic" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/nodes/{node_id}/diagnostics/{request_id}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - name: request_id
        in: path
        required: true
        schema: { type: string, pattern: '^diag_' }
    get:
      summary: Get redacted diagnostic request status and report
      tags: [Nodes]
      operationId: getNodeDiagnostic
      responses:
        "200":
          description: Diagnostic request projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDiagnostic" }
        "404": { $ref: "#/components/responses/Error" }
