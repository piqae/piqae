name: Release evidence

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of an artifact uploaded by the calling build
        required: true
        type: string
      release_name:
        description: Human-readable release or candidate name
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  evidence:
    name: SBOM, checksums, provenance, and audit
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: release-candidate
      - name: Generate release SPDX JSON
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-candidate
          format: spdx-json
          output-file: release-candidate/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest artifact provenance
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-candidate/**
          show-summary: true
      - name: Assemble evidence
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          cp "$PROVENANCE_BUNDLE" release-candidate/provenance.sigstore.json
          python3 release/tools/release_bundle.py prepare release-candidate \
            --release "$RELEASE_NAME" \
            --commit "$GITHUB_SHA"
      - name: Verify release evidence and repository identity
        run: >-
          python3 release/tools/release_bundle.py audit release-candidate
          --github-repository "$GITHUB_REPOSITORY"
      - name: Upload audited release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: piqae-${{ inputs.release_name }}-evidence
          path: release-candidate
          if-no-files-found: error
          retention-days: 30
