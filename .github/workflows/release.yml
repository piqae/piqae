name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label used for a dry-run artifact build
        required: true
        default: "v0.1.0-dev"

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: spool-windows-x86_64
            extension: .exe
            extra_packages: -p spool-executor-windows -p spool-shell-windows
            executor_binary: spool-executor-windows
            shell_binary: spool-shell-windows
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: spool-macos-aarch64
            extension: ""
            extra_packages: -p spool-executor-cups
            executor_binary: spool-executor-cups
            shell_binary: ""
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: spool-macos-x86_64
            extension: ""
            extra_packages: -p spool-executor-cups
            executor_binary: spool-executor-cups
            shell_binary: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: spool-linux-x86_64
            extension: ""
            extra_packages: -p spool-executor-cups -p spool-shell-linux
            executor_binary: spool-executor-cups
            shell_binary: spool-shell-linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build native binaries
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" -p spool-agent -p spoolctl ${{ matrix.extra_packages }}
      - name: Build macOS menu shell
        if: runner.os == 'macOS'
        shell: bash
        run: swift build --configuration release --package-path shells/macos
      - name: Stage native bundle
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/spool-agent${{ matrix.extension }}" "artifacts/${{ matrix.artifact }}/"
          cp "target/${{ matrix.target }}/release/spoolctl${{ matrix.extension }}" "artifacts/${{ matrix.artifact }}/"
          cp "target/${{ matrix.target }}/release/${{ matrix.executor_binary }}${{ matrix.extension }}" "artifacts/${{ matrix.artifact }}/"
          if [ -n "${{ matrix.shell_binary }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.shell_binary }}${{ matrix.extension }}" "artifacts/${{ matrix.artifact }}/"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "shells/macos/.build/release/SpoolMenu" "artifacts/${{ matrix.artifact }}/"
          fi
          cp README.md LICENSE "artifacts/${{ matrix.artifact }}/"
      - name: Archive Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C artifacts -czf "artifacts/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/${{ matrix.artifact }}" -DestinationPath "artifacts/${{ matrix.artifact }}.zip"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/${{ matrix.artifact }}.*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.*
          if-no-files-found: error

  server:
    name: Container (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: deploy/docker/Dockerfile.server
          - name: web
            dockerfile: deploy/docker/Dockerfile.web
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [native, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spool-*
          path: artifacts
          merge-multiple: true
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum spool-* > SHA256SUMS
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes --verify-tag
