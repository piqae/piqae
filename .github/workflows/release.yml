name: Piqae release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without a leading v
        required: true
        default: "0.1.1"
      build_number:
        description: Monotonic macOS CFBundleVersion
        required: true
        default: "1"
      publish:
        description: Publish from the selected protected v* tag after approval
        type: boolean
        required: true
        default: false
      platform:
        description: Candidate scope; individual lanes publish independently, all adds aggregate certification
        type: choice
        options:
          - macos
          - windows
          - linux
          - containers
          - apple-sdk
          - windows-sdk
          - all
        required: true
        default: macos

permissions:
  contents: read

concurrency:
  group: piqae-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release
    # Platform-scoped unsigned preview tags are dispatched explicitly through
    # windows-release.yml and must never enter the signed multi-platform path.
    if: github.event_name != 'push' || !contains(github.ref_name, '-windows-preview.')
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      build_number: ${{ steps.release.outputs.build_number }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      windows_enabled: ${{ steps.release.outputs.windows_enabled }}
      platform: ${{ steps.release.outputs.platform }}
      macos_enabled: ${{ steps.release.outputs.macos_enabled }}
      windows_selected: ${{ steps.release.outputs.windows_selected }}
      linux_enabled: ${{ steps.release.outputs.linux_enabled }}
      containers_enabled: ${{ steps.release.outputs.containers_enabled }}
      apple_sdk_enabled: ${{ steps.release.outputs.apple_sdk_enabled }}
      windows_sdk_enabled: ${{ steps.release.outputs.windows_sdk_enabled }}
      aggregate_enabled: ${{ steps.release.outputs.aggregate_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version, tag, and source commit
        id: release
        shell: bash
        env:
          CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            build_number=$GITHUB_RUN_NUMBER
            tag=$GITHUB_REF_NAME
            platform=all
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$REQUESTED_VERSION
            build_number=$REQUESTED_BUILD
            tag=$GITHUB_REF_NAME
            platform=${REQUESTED_PLATFORM:-macos}
            if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
              echo "Requested version must match the selected tag $GITHUB_REF_NAME." >&2
              exit 2
            fi
          else
            version=$REQUESTED_VERSION
            build_number=$REQUESTED_BUILD
            tag=""
            platform=${REQUESTED_PLATFORM:-macos}
          fi
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a safe SemVer-like value without a leading v." >&2
            exit 2
          fi
          ruby release/tools/check_product_release.rb \
            --release-version "$version"
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build number must be a positive integer." >&2
            exit 2
          fi
          publish=$REQUESTED_PUBLISH
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
          fi
          if [[ "$publish" == true && -z "$tag" ]]; then
            echo "Publication requires selecting a protected v* tag ref." >&2
            exit 1
          fi
          python3 release/tools/release_platform.py "$platform" >/dev/null
          windows_tier=$(ruby -e 'require "yaml"; puts YAML.load_file("release/support-matrix.yaml").fetch("platforms").fetch("windows_10_11_x86_64").fetch("tier")')
          if [[ "$publish" == true ]]; then
            ruby release/tools/check_product_release.rb \
              --product --release-version "$version"
            if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
              echo "Release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
              exit 1
            fi
            if [[ "$REF_PROTECTED" != true ]]; then
              echo "Publication requires a protected v* tag ref." >&2
              exit 1
            fi
            case "$platform" in
              linux|apple-sdk|windows-sdk)
                echo "The $platform scope produces a private candidate only; it has no stable publisher." >&2
                exit 1
                ;;
              windows)
                if [[ "$windows_tier" == disabled ]]; then
                  echo "Windows stable publication is Disabled by the support matrix." >&2
                  exit 1
                fi
                ;;
            esac
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git rev-parse --verify --quiet origin/main >/dev/null \
              || ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            then
              echo "Release tags must point to a commit already merged into main." >&2
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "publish=$publish"
            echo "tag=$tag"
            python3 release/tools/release_platform.py "$platform"
            if [[ "$windows_tier" == disabled ]]; then
              echo "windows_enabled=false"
            else
              echo "windows_enabled=true"
            fi
          } >> "$GITHUB_OUTPUT"

  core:
    name: Shared release gates
    needs: prepare
    runs-on: ${{ vars.PIQAE_CI_RUST_RUNNER || vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: piqae_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d piqae_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PIQAE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/piqae_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: release-core
          save-if: ${{ github.ref_type == 'tag' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install CUPS development library
        run: sudo apt-get update && sudo apt-get install --yes libcups2-dev
      - name: Install locked JavaScript workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run shared protocol, database, SDK and policy gates once
        run: cargo xtask release check --platform core

  macos:
    name: macOS signed candidate and promotion
    needs: [prepare, core]
    if: needs.prepare.outputs.macos_enabled == 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/macos-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      # Promotion is deferred until every selected sibling has succeeded; this
      # reusable call produces only the signed candidate and release evidence.
      publish: false
    secrets: inherit

  windows:
    name: Windows signed candidate and promotion
    needs: [prepare, core]
    if: >-
      needs.prepare.outputs.windows_selected == 'true'
      && (
        needs.prepare.outputs.platform == 'windows'
        || needs.prepare.outputs.windows_enabled == 'true'
      )
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/windows-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
      orchestrated_release: true
    secrets: inherit

  apple_sdk:
    name: Apple embedded node SDK candidate
    needs: [prepare, core]
    if: needs.prepare.outputs.apple_sdk_enabled == 'true'
    runs-on: ${{ vars.PIQAE_RELEASE_MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: release-apple-node-sdk
          save-if: ${{ github.ref_type == 'tag' }}
      - name: Validate the source package
        run: release/tools/test_apple_node_sdk.sh
      - name: Build the reproducible XCFramework
        run: sdk/apple/scripts/build-xcframework.sh
      - name: Validate the linked XCFramework and consumers
        run: release/tools/test_apple_node_sdk_linked.sh verify-existing
      - name: Validate Apple release staging and native SBOM failure paths
        run: >-
          python3 -m unittest
          release/tools/test_native_cargo_sbom.py
          release/tools/test_stage_apple_node_sdk.py
      - name: Stage versioned Apple SDK evidence
        shell: bash
        run: |
          set -euo pipefail
          stage=artifacts/apple-node-sdk
          python3 release/tools/stage_apple_node_sdk.py stage \
            --repository-root "$PWD" \
            --version "${{ needs.prepare.outputs.version }}" \
            --output "$stage"
      - name: Validate clean downloaded-style Apple SDK consumers
        run: >-
          release/tools/test_apple_node_sdk_release.sh
          "${{ needs.prepare.outputs.version }}"
          artifacts/apple-node-sdk
      - name: Gate complete Apple archive SPDX coverage
        run: |
          python3 release/tools/release_bundle.py validate-sbom "artifacts/apple-node-sdk/PiqaeNode.xcframework-${{ needs.prepare.outputs.version }}.spdx.json"
          python3 release/tools/release_bundle.py validate-sbom "artifacts/apple-node-sdk/PiqaeNodeKit-${{ needs.prepare.outputs.version }}.spdx.json"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: github.event.repository.private == false
        with:
          subject-path: artifacts/apple-node-sdk/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piqae-node-apple-sdk
          path: artifacts/apple-node-sdk/*
          if-no-files-found: error
          retention-days: 14

  windows_sdk:
    name: Windows embedded node SDK candidate
    needs: [prepare, core]
    if: needs.prepare.outputs.windows_sdk_enabled == 'true'
    runs-on: ${{ vars.PIQAE_RELEASE_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: release-windows-node-sdk
          save-if: ${{ github.ref_type == 'tag' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 8.0.x
      - name: Validate Windows package and SBOM failure paths
        shell: pwsh
        run: python -m unittest release/tools/test_windows_sdk_release.py
      - name: Validate and pack the Windows SDK
        shell: pwsh
        run: release/tools/test_windows_node_sdk.ps1 -PackageVersion "${{ needs.prepare.outputs.version }}" -OutputDirectory "artifacts/windows-node-sdk"
      - name: Stage the native C SDK bundle
        shell: pwsh
        run: |
          $stage = "artifacts\windows-node-sdk\native"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\piqae_node_ffi.dll", "target\x86_64-pc-windows-msvc\release\piqae_node_ffi.dll.lib", "sdk\native\include\piqae_node.h", "LICENSE", "NOTICE", "sdk\dotnet\README.md" $stage
          python release/tools/native_cargo_sbom.py generate-license-report --repository-root $PWD --target x86_64-pc-windows-msvc --output "$stage\THIRD_PARTY_LICENSES.json"
          $archive = "artifacts\windows-node-sdk\PiqaeNode-native-windows-x64-${{ needs.prepare.outputs.version }}.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $archive
          Get-ChildItem "artifacts\windows-node-sdk\*.nupkg", $archive | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          python release/tools/windows_sdk_release.py generate-native-sbom --archive $archive --repository-root $PWD --version "${{ needs.prepare.outputs.version }}" --output "artifacts\windows-node-sdk\PiqaeNode-native-windows-x64-${{ needs.prepare.outputs.version }}.spdx.json"
          python release/tools/windows_sdk_release.py generate-sdk-manifest --package "artifacts\windows-node-sdk\Piqae.Node.${{ needs.prepare.outputs.version }}.nupkg" --native-archive $archive --nuget-sbom "artifacts\windows-node-sdk\Piqae.Node.${{ needs.prepare.outputs.version }}.spdx.json" --native-sbom "artifacts\windows-node-sdk\PiqaeNode-native-windows-x64-${{ needs.prepare.outputs.version }}.spdx.json" --version "${{ needs.prepare.outputs.version }}" --output "artifacts\windows-node-sdk\PiqaeNode.windows-sdk-artifact.json"
      - name: Gate the complete Windows SDK SPDX SBOM
        shell: pwsh
        run: |
          python release/tools/windows_sdk_release.py validate-sbom --input "artifacts/windows-node-sdk/Piqae.Node.${{ needs.prepare.outputs.version }}.spdx.json" --package "artifacts/windows-node-sdk/Piqae.Node.${{ needs.prepare.outputs.version }}.nupkg" --version "${{ needs.prepare.outputs.version }}"
          python release/tools/release_bundle.py validate-sbom "artifacts/windows-node-sdk/Piqae.Node.${{ needs.prepare.outputs.version }}.spdx.json"
          python release/tools/windows_sdk_release.py validate-native-sbom --archive "artifacts/windows-node-sdk/PiqaeNode-native-windows-x64-${{ needs.prepare.outputs.version }}.zip" --input "artifacts/windows-node-sdk/PiqaeNode-native-windows-x64-${{ needs.prepare.outputs.version }}.spdx.json" --repository-root $PWD --version "${{ needs.prepare.outputs.version }}"
          python release/tools/release_bundle.py validate-sbom "artifacts/windows-node-sdk/PiqaeNode-native-windows-x64-${{ needs.prepare.outputs.version }}.spdx.json"
          python release/tools/windows_sdk_release.py validate-sdk-manifest --package "artifacts/windows-node-sdk/Piqae.Node.${{ needs.prepare.outputs.version }}.nupkg" --native-archive "artifacts/windows-node-sdk/PiqaeNode-native-windows-x64-${{ needs.prepare.outputs.version }}.zip" --nuget-sbom "artifacts/windows-node-sdk/Piqae.Node.${{ needs.prepare.outputs.version }}.spdx.json" --native-sbom "artifacts/windows-node-sdk/PiqaeNode-native-windows-x64-${{ needs.prepare.outputs.version }}.spdx.json" --version "${{ needs.prepare.outputs.version }}" --input artifacts/windows-node-sdk/PiqaeNode.windows-sdk-artifact.json
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: github.event.repository.private == false
        with:
          subject-path: artifacts/windows-node-sdk/*.*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piqae-node-windows-sdk
          path: artifacts/windows-node-sdk/*.*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (${{ matrix.artifact }})
    needs: [prepare, core]
    if: needs.prepare.outputs.linux_enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: piqae-linux-x86_64
            runner_kind: x86_64
          - target: aarch64-unknown-linux-gnu
            artifact: piqae-linux-aarch64
            runner_kind: aarch64
    runs-on: ${{ matrix.runner_kind == 'aarch64' && (vars.PIQAE_RELEASE_LINUX_ARM_RUNNER || 'ubuntu-24.04-arm') || (vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref_type == 'tag' }}
      - name: Install CUPS development library
        run: sudo apt-get update && sudo apt-get install --yes libcups2-dev
      - name: Build Linux binaries
        run: >-
          cargo build --locked --release --target "${{ matrix.target }}" --bins
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-cups
          -p piqae-shell-linux
      - name: Stage Linux bundle
        shell: bash
        run: |
          bundle="artifacts/${{ matrix.artifact }}"
          mkdir -p "$bundle/docs" "$bundle/service"
          for binary in piqae-agent piqaectl piqae-executor-cups piqae-shell-linux; do
            install -m 0755 "target/${{ matrix.target }}/release/$binary" "$bundle/$binary"
          done
          install -m 0644 README.md LICENSE NOTICE "$bundle/"
          cp -R LICENSES "$bundle/"
          install -m 0644 packaging/README.md "$bundle/PACKAGING.md"
          install -m 0644 release/native-bundle-status.md "$bundle/NATIVE-BUNDLE-STATUS.md"
          install -m 0644 release/support-matrix.yaml "$bundle/SUPPORT-MATRIX.yaml"
          install -m 0644 docs/operations/agent-service-installation.md "$bundle/docs/"
          cp -R packaging/linux/. "$bundle/service/"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: artifacts/${{ matrix.artifact }}
          format: spdx-json
          output-file: artifacts/${{ matrix.artifact }}/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Archive and checksum
        shell: bash
        run: |
          archive="${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}.tar.gz"
          tar -C artifacts -czf "artifacts/$archive" "${{ matrix.artifact }}"
          cd artifacts
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: github.event.repository.private == false
        with:
          subject-path: artifacts/${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}.*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}.*
          if-no-files-found: error
          retention-days: 14

  server:
    name: Container (${{ matrix.name }})
    needs: [prepare, core]
    if: needs.prepare.outputs.containers_enabled == 'true'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: deploy/docker/Dockerfile.server
          - name: web
            dockerfile: deploy/docker/Dockerfile.web
          - name: migrate
            dockerfile: deploy/docker/Dockerfile.migrate
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/piqae/piqae/${{ matrix.name }}
          tags: |
            type=raw,value=v${{ needs.prepare.outputs.version }}
            type=sha
      - name: Prepare private image candidate directory
        run: mkdir -p artifacts/container
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=docker,dest=artifacts/container/piqae-${{ matrix.name }}.tar
      - name: Checksum immutable image candidate
        run: >-
          cd artifacts/container &&
          sha256sum piqae-${{ matrix.name }}.tar
          > piqae-${{ matrix.name }}.tar.sha256
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: github.event.repository.private == false
        with:
          subject-path: artifacts/container/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piqae-container-${{ matrix.name }}
          path: artifacts/container/*
          if-no-files-found: error
          retention-days: 14

  promote_containers:
    name: Promote verified container (${{ matrix.name }}) independently
    needs: [prepare, server]
    if: >-
      always() && needs.prepare.outputs.publish == 'true'
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.containers_enabled == 'true'
      && needs.server.result == 'success'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: native-release
    concurrency:
      group: piqae-container-promotion-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        name: [server, web, migrate]
    permissions:
      actions: read
      attestations: write
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: piqae-container-${{ matrix.name }}
          path: artifacts/container
      - name: Verify immutable image candidate
        run: cd artifacts/container && sha256sum --check piqae-${{ matrix.name }}.tar.sha256
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push verified candidate tags
        id: push
        shell: bash
        env:
          IMAGE: ghcr.io/piqae/piqae/${{ matrix.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker load --input "artifacts/container/piqae-${{ matrix.name }}.tar"
          short_sha=${GITHUB_SHA:0:7}
          docker tag "$IMAGE:v$VERSION" "$IMAGE:sha-$short_sha"
          docker push "$IMAGE:v$VERSION"
          docker push "$IMAGE:sha-$short_sha"
          digest=$(docker buildx imagetools inspect "$IMAGE:v$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/piqae/piqae/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  promote_macos:
    name: Promote verified macOS candidate independently
    needs: [prepare, macos]
    if: >-
      always() && needs.prepare.outputs.publish == 'true'
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.macos_enabled == 'true'
      && needs.macos.result == 'success'
    permissions:
      actions: read
      attestations: read
      contents: write
    uses: ./.github/workflows/macos-promotion.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_sha: ${{ github.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.macos.outputs.version }}
      build_number: ${{ needs.macos.outputs.build_number }}
      artifact_name: ${{ needs.macos.outputs.artifact_name }}
      evidence_artifact_name: piqae-macos-${{ needs.macos.outputs.version }}-${{ needs.macos.outputs.build_number }}-evidence
      recovery_mode: false
    secrets: inherit

  finalize_macos:
    name: Publish independently verified macOS prerelease
    needs: [prepare, promote_macos]
    if: >-
      always() && needs.prepare.outputs.publish == 'true'
      && needs.prepare.result == 'success'
      && needs.promote_macos.result == 'success'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: piqae-github-prerelease-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the independently verified macOS draft prerelease
        env:
          CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SCOPE: ${{ needs.prepare.outputs.platform }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WINDOWS_ENABLED: ${{ needs.prepare.outputs.windows_enabled }}
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "GitHub release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == true) or (.isPrerelease == true)' | grep -Fx true
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.current.md
          python3 release/tools/release_prerelease_notes.py \
            --existing release-notes.current.md \
            --output release-notes.next.md \
            --scope "$RELEASE_SCOPE" \
            --windows-enabled "$WINDOWS_ENABLED" \
            --platform macos
          gh release edit "$RELEASE_TAG" --draft=false --prerelease \
            --notes-file release-notes.next.md

  finalize_windows:
    name: Publish independently verified Windows prerelease
    needs: [prepare, windows]
    if: >-
      always() && needs.prepare.outputs.publish == 'true'
      && needs.prepare.result == 'success'
      && (
        needs.prepare.outputs.platform == 'windows'
        || needs.prepare.outputs.platform == 'all'
      )
      && needs.windows.result == 'success'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: piqae-github-prerelease-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the Windows-only draft prerelease
        env:
          CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SCOPE: ${{ needs.prepare.outputs.platform }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WINDOWS_ENABLED: ${{ needs.prepare.outputs.windows_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "GitHub release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == true) or (.isPrerelease == true)' | grep -Fx true
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.current.md
          python3 release/tools/release_prerelease_notes.py \
            --existing release-notes.current.md \
            --output release-notes.next.md \
            --scope "$RELEASE_SCOPE" \
            --windows-enabled "$WINDOWS_ENABLED" \
            --platform windows
          gh release edit "$RELEASE_TAG" --draft=false --prerelease \
            --notes-file release-notes.next.md

  certify_all:
    name: Certify all selected release lanes
    needs:
      - prepare
      - core
      - macos
      - windows
      - apple_sdk
      - windows_sdk
      - linux
      - server
      - promote_containers
      - promote_macos
      - finalize_macos
      - finalize_windows
    if: >-
      always() && needs.prepare.result == 'success'
      && needs.prepare.outputs.aggregate_enabled == 'true'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: piqae-github-prerelease-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every effective all-platform lane
        id: certification
        continue-on-error: true
        shell: bash
        env:
          CORE_RESULT: ${{ needs.core.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_ENABLED: ${{ needs.prepare.outputs.windows_enabled }}
          APPLE_SDK_RESULT: ${{ needs.apple_sdk.result }}
          WINDOWS_SDK_RESULT: ${{ needs.windows_sdk.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          CONTAINER_RESULT: ${{ needs.server.result }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          CONTAINER_PROMOTION_RESULT: ${{ needs.promote_containers.result }}
          MACOS_PROMOTION_RESULT: ${{ needs.promote_macos.result }}
          MACOS_FINALIZE_RESULT: ${{ needs.finalize_macos.result }}
          WINDOWS_FINALIZE_RESULT: ${{ needs.finalize_windows.result }}
        run: |
          set -euo pipefail
          python3 release/tools/release_completion.py \
            --windows-enabled "$WINDOWS_ENABLED" \
            --publish "$PUBLISH" \
            --core "$CORE_RESULT" \
            --macos "$MACOS_RESULT" \
            --windows "$WINDOWS_RESULT" \
            --apple-sdk "$APPLE_SDK_RESULT" \
            --windows-sdk "$WINDOWS_SDK_RESULT" \
            --linux "$LINUX_RESULT" \
            --containers "$CONTAINER_RESULT" \
            --macos-promotion "$MACOS_PROMOTION_RESULT" \
            --macos-prerelease "$MACOS_FINALIZE_RESULT" \
            --windows-prerelease "$WINDOWS_FINALIZE_RESULT" \
            --container-promotion "$CONTAINER_PROMOTION_RESULT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: linux_assets
        continue-on-error: true
        if: >-
          needs.prepare.outputs.publish == 'true'
          && steps.certification.outcome == 'success'
        with:
          pattern: piqae-linux-*
          path: linux-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: sdk_assets
        continue-on-error: true
        if: >-
          needs.prepare.outputs.publish == 'true'
          && steps.certification.outcome == 'success'
        with:
          pattern: piqae-node-*-sdk
          path: sdk-artifacts
          merge-multiple: true
      - name: Attach certified candidate assets
        id: aggregate_assets
        continue-on-error: true
        if: >-
          needs.prepare.outputs.publish == 'true'
          && steps.certification.outcome == 'success'
          && steps.linux_assets.outcome == 'success'
          && steps.sdk_assets.outcome == 'success'
        env:
          CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "GitHub release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == false and .isPrerelease == true)' | grep -Fx true
          gh release upload "$RELEASE_TAG" linux-artifacts/* sdk-artifacts/* --clobber
      - name: Record aggregate certification outcome in public release notes
        if: >-
          always() && needs.prepare.outputs.publish == 'true'
          && (
            needs.finalize_macos.result == 'success'
            || needs.finalize_windows.result == 'success'
          )
        env:
          AGGREGATE_ASSETS_OUTCOME: ${{ steps.aggregate_assets.outcome }}
          CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
          CERTIFICATION_OUTCOME: ${{ steps.certification.outcome }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          LINUX_ASSETS_OUTCOME: ${{ steps.linux_assets.outcome }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SDK_ASSETS_OUTCOME: ${{ steps.sdk_assets.outcome }}
          WINDOWS_ENABLED: ${{ needs.prepare.outputs.windows_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "GitHub release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi
          aggregate=passed
          for outcome in \
            "$CERTIFICATION_OUTCOME" \
            "$LINUX_ASSETS_OUTCOME" \
            "$SDK_ASSETS_OUTCOME" \
            "$AGGREGATE_ASSETS_OUTCOME"
          do
            if [[ "$outcome" != success ]]; then aggregate=failed; fi
          done
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == false and .isPrerelease == true)' | grep -Fx true
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.current.md
          python3 release/tools/release_prerelease_notes.py \
            --existing release-notes.current.md \
            --output release-notes.next.md \
            --scope all \
            --windows-enabled "$WINDOWS_ENABLED" \
            --aggregate "$aggregate"
          gh release edit "$RELEASE_TAG" --notes-file release-notes.next.md
      - name: Fail when aggregate certification or asset publication failed
        if: always()
        env:
          AGGREGATE_ASSETS_OUTCOME: ${{ steps.aggregate_assets.outcome }}
          CERTIFICATION_OUTCOME: ${{ steps.certification.outcome }}
          LINUX_ASSETS_OUTCOME: ${{ steps.linux_assets.outcome }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          SDK_ASSETS_OUTCOME: ${{ steps.sdk_assets.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CERTIFICATION_OUTCOME" != success ]]; then
            echo 'Aggregate release policy failed; no aggregate assets were certified.' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true
            && ( "$LINUX_ASSETS_OUTCOME" != success
              || "$SDK_ASSETS_OUTCOME" != success
              || "$AGGREGATE_ASSETS_OUTCOME" != success )
          ]]; then
            echo 'Aggregate candidate asset publication failed.' >&2
            exit 1
          fi
