name: Piqae release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without a leading v
        required: true
        default: "0.1.1"
      build_number:
        description: Monotonic macOS CFBundleVersion
        required: true
        default: "1"
      publish:
        description: Publish from the selected protected v* tag after approval
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: piqae-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      build_number: ${{ steps.release.outputs.build_number }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      windows_enabled: ${{ steps.release.outputs.windows_enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate version, tag, and source commit
        id: release
        shell: bash
        env:
          CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            build_number=$GITHUB_RUN_NUMBER
            tag=$GITHUB_REF_NAME
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$REQUESTED_VERSION
            build_number=$REQUESTED_BUILD
            tag=$GITHUB_REF_NAME
            if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
              echo "Requested version must match the selected tag $GITHUB_REF_NAME." >&2
              exit 2
            fi
          else
            version=$REQUESTED_VERSION
            build_number=$REQUESTED_BUILD
            tag=""
          fi
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a safe SemVer-like value without a leading v." >&2
            exit 2
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build number must be a positive integer." >&2
            exit 2
          fi
          publish=$REQUESTED_PUBLISH
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
          fi
          if [[ "$publish" == true && -z "$tag" ]]; then
            echo "Publication requires selecting a protected v* tag ref." >&2
            exit 1
          fi
          if [[ "$publish" == true ]]; then
            if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
              echo "Release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
              exit 1
            fi
            if [[ "$REF_PROTECTED" != true ]]; then
              echo "Publication requires a protected v* tag ref." >&2
              exit 1
            fi
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git rev-parse --verify --quiet origin/main >/dev/null \
              || ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            then
              echo "Release tags must point to a commit already merged into main." >&2
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "publish=$publish"
            echo "tag=$tag"
            windows_tier=$(ruby -e 'require "yaml"; puts YAML.load_file("release/support-matrix.yaml").fetch("platforms").fetch("windows_10_11_x86_64").fetch("tier")')
            if [[ "$windows_tier" == disabled ]]; then
              echo "windows_enabled=false"
            else
              echo "windows_enabled=true"
            fi
          } >> "$GITHUB_OUTPUT"

  macos:
    name: macOS signed candidate and promotion
    needs: prepare
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/macos-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
    secrets: inherit

  windows:
    name: Windows signed candidate and promotion
    needs: prepare
    if: needs.prepare.outputs.windows_enabled == 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/windows-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
    secrets: inherit

  linux:
    name: Linux (${{ matrix.artifact }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: piqae-linux-x86_64
            runner_kind: x86_64
          - target: aarch64-unknown-linux-gnu
            artifact: piqae-linux-aarch64
            runner_kind: aarch64
    runs-on: ${{ matrix.runner_kind == 'aarch64' && (vars.PIQAE_RELEASE_LINUX_ARM_RUNNER || 'ubuntu-24.04-arm') || (vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref_type == 'tag' }}
      - name: Install CUPS development library
        run: sudo apt-get update && sudo apt-get install --yes libcups2-dev
      - name: Build Linux binaries
        run: >-
          cargo build --locked --release --target "${{ matrix.target }}" --bins
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-cups
          -p piqae-shell-linux
      - name: Stage Linux bundle
        shell: bash
        run: |
          bundle="artifacts/${{ matrix.artifact }}"
          mkdir -p "$bundle/docs" "$bundle/service"
          for binary in piqae-agent piqaectl piqae-executor-cups piqae-shell-linux; do
            install -m 0755 "target/${{ matrix.target }}/release/$binary" "$bundle/$binary"
          done
          install -m 0644 README.md LICENSE NOTICE "$bundle/"
          cp -R LICENSES "$bundle/"
          install -m 0644 packaging/README.md "$bundle/PACKAGING.md"
          install -m 0644 release/native-bundle-status.md "$bundle/NATIVE-BUNDLE-STATUS.md"
          install -m 0644 release/support-matrix.yaml "$bundle/SUPPORT-MATRIX.yaml"
          install -m 0644 docs/operations/agent-service-installation.md "$bundle/docs/"
          cp -R packaging/linux/. "$bundle/service/"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts/${{ matrix.artifact }}
          format: spdx-json
          output-file: artifacts/${{ matrix.artifact }}/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Archive and checksum
        shell: bash
        run: |
          archive="${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}.tar.gz"
          tar -C artifacts -czf "artifacts/$archive" "${{ matrix.artifact }}"
          cd artifacts
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: github.event.repository.private == false
        with:
          subject-path: artifacts/${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}.*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}.*
          if-no-files-found: error
          retention-days: 14

  server:
    name: Container (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: deploy/docker/Dockerfile.server
          - name: web
            dockerfile: deploy/docker/Dockerfile.web
          - name: migrate
            dockerfile: deploy/docker/Dockerfile.migrate
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/piqae/piqae/${{ matrix.name }}
          tags: |
            type=raw,value=v${{ needs.prepare.outputs.version }}
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: needs.prepare.outputs.publish == 'true'
        with:
          subject-name: ghcr.io/piqae/piqae/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  finalize:
    name: Publish GitHub prerelease
    needs: [prepare, macos, windows, linux, server]
    if: >-
      always() && needs.prepare.outputs.publish == 'true'
      && needs.prepare.result == 'success'
      && needs.macos.result == 'success'
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
      && needs.linux.result == 'success'
      && needs.server.result == 'success'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: piqae-linux-*
          path: linux-artifacts
          merge-multiple: true
      - name: Attach Linux assets and publish the draft prerelease
        env:
          CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "GitHub release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fx true
          gh release upload "$RELEASE_TAG" linux-artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
