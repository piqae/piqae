name: Piqae preview bundles and containers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label used for a dry-run artifact build
        required: true
        default: "v0.1.0-dev"

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: piqae-windows-x86_64
            extension: .exe
            extra_packages: -p piqae-executor-windows -p piqae-shell-windows
            executor_binary: piqae-executor-windows
            shell_binary: piqae-shell-windows
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: piqae-macos-aarch64
            extension: ""
            extra_packages: -p piqae-executor-cups
            executor_binary: piqae-executor-cups
            shell_binary: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: piqae-macos-x86_64
            extension: ""
            extra_packages: -p piqae-executor-cups
            executor_binary: piqae-executor-cups
            shell_binary: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: piqae-linux-x86_64
            extension: ""
            extra_packages: -p piqae-executor-cups -p piqae-shell-linux
            executor_binary: piqae-executor-cups
            shell_binary: piqae-shell-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: piqae-linux-aarch64
            extension: ""
            extra_packages: -p piqae-executor-cups -p piqae-shell-linux
            executor_binary: piqae-executor-cups
            shell_binary: piqae-shell-linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux CUPS development library
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes libcups2-dev
      - name: Build native binaries
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release --target "${{ matrix.target }}" -p piqae-agent -p piqaectl ${{ matrix.extra_packages }} --bins
      - name: Build macOS menu shell
        if: runner.os == 'macOS'
        shell: bash
        run: swift build --configuration release --package-path shells/macos
      - name: Stage native bundle
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.artifact }}/docs" "artifacts/${{ matrix.artifact }}/service"
          cp "target/${{ matrix.target }}/release/piqae-agent${{ matrix.extension }}" "artifacts/${{ matrix.artifact }}/"
          cp "target/${{ matrix.target }}/release/piqaectl${{ matrix.extension }}" "artifacts/${{ matrix.artifact }}/"
          cp "target/${{ matrix.target }}/release/${{ matrix.executor_binary }}${{ matrix.extension }}" "artifacts/${{ matrix.artifact }}/"
          if [ -n "${{ matrix.shell_binary }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.shell_binary }}${{ matrix.extension }}" "artifacts/${{ matrix.artifact }}/"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/piqae-profile-host-windows.exe" "artifacts/${{ matrix.artifact }}/"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "shells/macos/.build/release/PiqaeMenu" "artifacts/${{ matrix.artifact }}/"
          fi
          cp README.md LICENSE "artifacts/${{ matrix.artifact }}/"
          cp -R LICENSES "artifacts/${{ matrix.artifact }}/"
          cp packaging/README.md "artifacts/${{ matrix.artifact }}/PACKAGING.md"
          cp release/native-bundle-status.md "artifacts/${{ matrix.artifact }}/NATIVE-BUNDLE-STATUS.md"
          cp release/support-matrix.yaml "artifacts/${{ matrix.artifact }}/SUPPORT-MATRIX.yaml"
          cp docs/operations/agent-service-installation.md "artifacts/${{ matrix.artifact }}/docs/"
          case "${{ runner.os }}" in
            Linux) cp -R packaging/linux/. "artifacts/${{ matrix.artifact }}/service/" ;;
            macOS) cp -R packaging/macos/. "artifacts/${{ matrix.artifact }}/service/" ;;
            Windows) cp -R packaging/windows/. "artifacts/${{ matrix.artifact }}/service/" ;;
          esac
      - name: Stage pinned PDFium runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "packaging/windows/Fetch-Pdfium.ps1" -DestinationDirectory "artifacts/${{ matrix.artifact }}"'
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows development installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $source = (Resolve-Path "artifacts/${{ matrix.artifact }}").Path
          $output = (Resolve-Path "artifacts").Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DSourceDir=$source" "/DOutputDir=$output" "/DAppVersion=$env:PACKAGE_VERSION" "packaging/windows/Piqae.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Generate native SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts/${{ matrix.artifact }}
          format: spdx-json
          output-file: artifacts/${{ matrix.artifact }}/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Archive Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C artifacts -czf "artifacts/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/${{ matrix.artifact }}" -DestinationPath "artifacts/${{ matrix.artifact }}.zip"
      - name: Write Unix bundle checksum
        if: runner.os != 'Windows'
        shell: bash
        working-directory: artifacts
        run: |
          archive="${{ matrix.artifact }}.tar.gz"
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Write Windows bundle checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($artifact in @(
            "artifacts/${{ matrix.artifact }}.zip",
            "artifacts/${{ matrix.artifact }}-setup.exe"
          )) {
            $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($artifact))" |
              Out-File -Encoding ascii "$artifact.sha256"
          }
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/${{ matrix.artifact }}*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}*
          if-no-files-found: error

  server:
    name: Container (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: deploy/docker/Dockerfile.server
          - name: web
            dockerfile: deploy/docker/Dockerfile.web
          - name: migrate
            dockerfile: deploy/docker/Dockerfile.migrate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/piqae/piqae/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-name: ghcr.io/piqae/piqae/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
