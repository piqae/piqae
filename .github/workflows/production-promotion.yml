name: Production promotion

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Immutable server image including @sha256 digest
        required: true
      primary_api_previous_revision:
        description: Known-good primary API revision
        required: true
      primary_sync_previous_revision:
        description: Known-good primary sync revision
        required: true
      primary_worker_previous_revision:
        description: Known-good primary worker revision
        required: true
      secondary_api_previous_revision:
        description: Known-good secondary API revision
        required: true
      secondary_sync_previous_revision:
        description: Known-good secondary sync revision
        required: true
      secondary_worker_previous_revision:
        description: Known-good secondary worker revision
        required: true
      confirm:
        description: Type PROMOTE
        required: true

permissions:
  contents: read

concurrency:
  group: piqae-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.confirm == 'PROMOTE'
    environment: production
    runs-on: [self-hosted, piqae-production]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate candidate and protected production configuration
        env:
          PIQAE_PRODUCTION_RAILWAY_ENV_FILE: /etc/piqae/production/railway-web.env
          PIQAE_PRODUCTION_TFVARS_FILE: /etc/piqae/production/terraform.tfvars
          PIQAE_PRODUCTION_EVIDENCE_DIR: /etc/piqae/production/release-evidence
        run: ./deploy/production-check.sh managed-ha
      - name: Migrate, stage, observe, and promote
        env:
          PIQAE_GCP_PROJECT: ${{ vars.PIQAE_GCP_PROJECT }}
          PIQAE_PRIMARY_GCP_REGION: ${{ vars.PIQAE_PRIMARY_GCP_REGION }}
          PIQAE_SECONDARY_GCP_REGION: ${{ vars.PIQAE_SECONDARY_GCP_REGION }}
          PIQAE_PRIMARY_API_SERVICE: ${{ vars.PIQAE_PRIMARY_API_SERVICE }}
          PIQAE_PRIMARY_SYNC_SERVICE: ${{ vars.PIQAE_PRIMARY_SYNC_SERVICE }}
          PIQAE_PRIMARY_WORKER_SERVICE: ${{ vars.PIQAE_PRIMARY_WORKER_SERVICE }}
          PIQAE_SECONDARY_API_SERVICE: ${{ vars.PIQAE_SECONDARY_API_SERVICE }}
          PIQAE_SECONDARY_SYNC_SERVICE: ${{ vars.PIQAE_SECONDARY_SYNC_SERVICE }}
          PIQAE_SECONDARY_WORKER_SERVICE: ${{ vars.PIQAE_SECONDARY_WORKER_SERVICE }}
          PIQAE_MIGRATION_JOB: ${{ vars.PIQAE_MIGRATION_JOB }}
          PIQAE_API_ORIGIN: ${{ vars.PIQAE_API_ORIGIN }}
          PIQAE_SERVER_IMAGE: ${{ inputs.server_image }}
          PIQAE_PRIMARY_API_PREVIOUS_REVISION: ${{ inputs.primary_api_previous_revision }}
          PIQAE_PRIMARY_SYNC_PREVIOUS_REVISION: ${{ inputs.primary_sync_previous_revision }}
          PIQAE_PRIMARY_WORKER_PREVIOUS_REVISION: ${{ inputs.primary_worker_previous_revision }}
          PIQAE_SECONDARY_API_PREVIOUS_REVISION: ${{ inputs.secondary_api_previous_revision }}
          PIQAE_SECONDARY_SYNC_PREVIOUS_REVISION: ${{ inputs.secondary_sync_previous_revision }}
          PIQAE_SECONDARY_WORKER_PREVIOUS_REVISION: ${{ inputs.secondary_worker_previous_revision }}
          PIQAE_STAGE_5_PERCENT_SECONDS: "21600"
          PIQAE_STAGE_25_PERCENT_SECONDS: "43200"
        run: ./deploy/cloud/promote.sh
