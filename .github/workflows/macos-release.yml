name: macOS release candidate

on:
  workflow_call:
    inputs:
      version:
        description: Bundle and Cargo version (without a leading v)
        required: true
        type: string
      build_number:
        description: Monotonic CFBundleVersion
        required: true
        type: string
      publish:
        description: Promote after the native-release environment gate
        required: true
        type: boolean
permissions:
  contents: read

jobs:
  candidate:
    name: Universal macOS candidate
    runs-on: ${{ vars.PIQAE_RELEASE_MACOS_RUNNER || 'macos-15' }}
    environment: native-signing
    outputs:
      artifact_name: ${{ steps.gate.outputs.artifact_name }}
      build_number: ${{ steps.gate.outputs.build_number }}
      publish: ${{ steps.gate.outputs.publish }}
      release_mode: ${{ steps.gate.outputs.release_mode }}
      version: ${{ steps.gate.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
      MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      SPARKLE_FEED_URL: https://downloads.piqae.com/releases/stable/appcast-macos.xml
      # Sparkle treats a prefix without a trailing slash as a file URL and
      # replaces its final path component.
      SPARKLE_DOWNLOAD_URL_PREFIX: https://downloads.piqae.com/releases/stable/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: macos-universal-release

      - name: Resolve version and credential gate
        id: gate
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          version=$REQUESTED_VERSION
          build_number=$REQUESTED_BUILD
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version=${GITHUB_REF_NAME#v}
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag version $tag_version does not match requested version $version." >&2
              exit 1
            fi
            tagged=true
          else
            tagged=false
          fi
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a safe SemVer-like value." >&2
            exit 2
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build number must be a positive integer." >&2
            exit 2
          fi

          required=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_APPLICATION_IDENTITY
            MACOS_INSTALLER_CERTIFICATE_P12_BASE64
            MACOS_INSTALLER_CERTIFICATE_PASSWORD
            MACOS_INSTALLER_IDENTITY
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_PASSWORD
            SPARKLE_PRIVATE_KEY_BASE64
            SPARKLE_PUBLIC_ED_KEY
          )
          present=0
          for name in "${required[@]}"; do
            if [[ -n "${!name}" ]]; then
              present=$((present + 1))
            fi
          done
          if [[ "$present" -ne 0 && "$present" -ne "${#required[@]}" ]]; then
            echo "macOS release credentials are partially configured; refusing an ambiguous candidate." >&2
            exit 1
          fi
          if [[ "$present" -eq "${#required[@]}" ]]; then
            release_mode=signed
          else
            release_mode=unsigned-preview
          fi
          if [[ "$tagged" == true && "$release_mode" != signed ]]; then
            echo "Tagged macOS candidates require signing, notarisation, and Sparkle credentials." >&2
            exit 1
          fi
          publish=$REQUESTED_PUBLISH
          if [[ "$publish" == true && ("$tagged" != true || "$REF_PROTECTED" != true) ]]; then
            echo "Stable publication requires a protected v* tag ref." >&2
            exit 1
          fi
          if [[ "$publish" == true && "$release_mode" != signed ]]; then
            echo "Stable publication requires a signed and notarised candidate." >&2
            exit 1
          fi
          artifact_name="piqae-macos-${release_mode}-${version}-${build_number}"

          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "release_mode=$release_mode"
            echo "publish=$publish"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Check component versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          agent_version=$(printf '%s' "$metadata" | jq -r '.packages[] | select(.name == "piqae-agent") | .version')
          executor_version=$(printf '%s' "$metadata" | jq -r '.packages[] | select(.name == "piqae-executor-cups") | .version')
          if [[ "$agent_version" != "$RELEASE_VERSION" || "$executor_version" != "$RELEASE_VERSION" ]]; then
            echo "Bundle version must match piqae-agent and piqae-executor-cups." >&2
            exit 1
          fi

      - name: Test Swift package
        run: swift test --package-path shells/macos

      - name: Static packaging checks
        shell: bash
        run: |
          bash -n \
            shells/macos/build-app.sh \
            packaging/macos/build-user-package.sh \
            packaging/macos/generate-appcast.sh \
            packaging/macos/install-user.sh \
            packaging/macos/pkg-postinstall \
            packaging/macos/sign-app.sh \
            packaging/macos/sign-components.sh \
            packaging/macos/uninstall-user.sh \
            packaging/macos/verify-update-signature.sh
          plutil -lint \
            shells/macos/Resources/Info.plist \
            shells/macos/Resources/Piqae.entitlements \
            packaging/macos/com.piqae.agent.plist.in \
            packaging/macos/com.piqae.menu.plist.in

      - name: Build universal Rust node
        shell: bash
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build \
              --locked \
              --release \
              --target "$target" \
              -p piqae-agent \
              -p piqae-executor-cups \
              --bins
          done
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          mkdir -p "$fixture/bin"
          lipo -create \
            target/aarch64-apple-darwin/release/piqae-agent \
            target/x86_64-apple-darwin/release/piqae-agent \
            -output "$fixture/bin/piqae-agent"
          lipo -create \
            target/aarch64-apple-darwin/release/piqae-executor-cups \
            target/x86_64-apple-darwin/release/piqae-executor-cups \
            -output "$fixture/bin/piqae-executor-cups"
          lipo -archs "$fixture/bin/piqae-agent" | grep -F arm64 | grep -F x86_64
          lipo -archs "$fixture/bin/piqae-executor-cups" | grep -F arm64 | grep -F x86_64

      - name: Import Developer ID certificate
        if: steps.gate.outputs.release_mode == 'signed'
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          keychain="$fixture/release.keychain-db"
          certificate="$fixture/developer-id.p12"
          installer_certificate="$fixture/developer-id-installer.p12"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" | base64 -D > "$installer_certificate"
          chmod 0600 "$certificate"
          chmod 0600 "$installer_certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security import "$installer_certificate" \
            -k "$keychain" \
            -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -F "$MACOS_APPLICATION_IDENTITY"
          security find-identity -v -p basic "$keychain" |
            grep -F "$MACOS_INSTALLER_IDENTITY"
          echo "PIQAE_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build app bundle
        shell: bash
        env:
          RELEASE_MODE: ${{ steps.gate.outputs.release_mode }}
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_BUILD: ${{ steps.gate.outputs.build_number }}
        run: |
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          app="$fixture/Piqae.app"
          if [[ "$RELEASE_MODE" == signed ]]; then
            PIQAE_APP_BUNDLE="$app" \
            PIQAE_VERSION="$RELEASE_VERSION" \
            PIQAE_BUILD_NUMBER="$RELEASE_BUILD" \
            PIQAE_SWIFT_ARCHS="arm64,x86_64" \
            PIQAE_CODE_SIGN_IDENTITY="$MACOS_APPLICATION_IDENTITY" \
            PIQAE_SPARKLE_FEED_URL="$SPARKLE_FEED_URL" \
            PIQAE_SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
              shells/macos/build-app.sh
          else
            PIQAE_APP_BUNDLE="$app" \
            PIQAE_VERSION="$RELEASE_VERSION" \
            PIQAE_BUILD_NUMBER="$RELEASE_BUILD" \
            PIQAE_SWIFT_ARCHS="arm64,x86_64" \
              shells/macos/build-app.sh
          fi
          lipo -archs "$app/Contents/MacOS/PiqaeMenu" | grep -F arm64 | grep -F x86_64
          lipo -archs "$app/Contents/MacOS/PiqaePrintCoreReplay" | grep -F arm64 | grep -F x86_64
          otool -l "$app/Contents/MacOS/PiqaeMenu" |
            grep -F "@executable_path/../Frameworks"
          # GitHub's hosted macOS runner has no interactive Aqua session, so
          # launching a menu-bar app here is nondeterministic and can be killed
          # by launchservices. Swift tests exercise startup behavior; release
          # CI validates the built executable and universal bundle directly.
          test -x "$app/Contents/MacOS/PiqaeMenu"

      - name: Sign standalone node components
        if: steps.gate.outputs.release_mode == 'signed'
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          PIQAE_CODE_SIGN_IDENTITY="$MACOS_APPLICATION_IDENTITY" \
            packaging/macos/sign-components.sh \
              "$fixture/bin/piqae-agent" \
              "$fixture/bin/piqae-executor-cups"

      - name: Verify Developer ID signature
        if: steps.gate.outputs.release_mode == 'signed'
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          mkdir -p artifacts
          codesign --verify --deep --strict --verbose=4 "$fixture/Piqae.app" \
            2> artifacts/codesign-evidence.txt
          codesign -dv --verbose=4 "$fixture/Piqae.app" \
            2>> artifacts/codesign-evidence.txt
          for component in \
            "$fixture/bin/piqae-agent" \
            "$fixture/bin/piqae-executor-cups"
          do
            codesign --verify --strict --verbose=4 "$component" \
              2>> artifacts/codesign-evidence.txt
            codesign -dv --verbose=4 "$component" \
              2>> artifacts/codesign-evidence.txt
          done
          grep -F "Authority=Developer ID Application:" artifacts/codesign-evidence.txt

      - name: Notarise and staple app
        if: steps.gate.outputs.release_mode == 'signed'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_BUILD: ${{ steps.gate.outputs.build_number }}
        run: |
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          submission="$fixture/Piqae-${RELEASE_VERSION}-${RELEASE_BUILD}-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$fixture/Piqae.app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json \
            > artifacts/app-notarisation-evidence.json
          jq -e '.status == "Accepted"' artifacts/app-notarisation-evidence.json
          xcrun stapler staple "$fixture/Piqae.app"
          xcrun stapler validate "$fixture/Piqae.app" \
            > artifacts/stapler-evidence.txt
          spctl --assess --type execute --verbose=4 "$fixture/Piqae.app" \
            2> artifacts/gatekeeper-evidence.txt
          rm -f -- "$submission"

      - name: Stage SBOM input
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          mkdir -p "$fixture/sbom-input"
          ditto "$fixture/Piqae.app" "$fixture/sbom-input/Piqae.app"
          install -m 0755 "$fixture/bin/piqae-agent" "$fixture/sbom-input/piqae-agent"
          install -m 0755 \
            "$fixture/bin/piqae-executor-cups" \
            "$fixture/sbom-input/piqae-executor-cups"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .piqae-test-fixtures/native-release/sbom-input
          format: spdx-json
          output-file: artifacts/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build per-user and update archives
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          PIQAE_CODE_SIGN_IDENTITY="${MACOS_APPLICATION_IDENTITY:-}" \
          PIQAE_INSTALLER_SIGN_IDENTITY="${MACOS_INSTALLER_IDENTITY:-}" \
            packaging/macos/build-user-package.sh \
              "$fixture/Piqae.app" \
              "$fixture/bin/piqae-agent" \
              "$fixture/bin/piqae-executor-cups" \
              artifacts

      - name: Notarise and staple installer package and disk image
        if: steps.gate.outputs.release_mode == 'signed'
        shell: bash
        run: |
          installer_packages=(artifacts/Piqae-*-macos-installer.pkg)
          if [[ "${#installer_packages[@]}" -ne 1 || ! -f "${installer_packages[0]}" ]]; then
            echo "Expected exactly one installer package." >&2
            exit 1
          fi
          installer_package=${installer_packages[0]}
          xcrun notarytool submit "$installer_package" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json \
            > artifacts/installer-package-notarisation-evidence.json
          jq -e '.status == "Accepted"' artifacts/installer-package-notarisation-evidence.json
          xcrun stapler staple "$installer_package"
          xcrun stapler validate "$installer_package" \
            > artifacts/installer-package-stapler-evidence.txt
          spctl --assess --type install --verbose=4 "$installer_package" \
            2> artifacts/installer-package-gatekeeper-evidence.txt

          installer_images=(artifacts/Piqae-*-macos-installer.dmg)
          if [[ "${#installer_images[@]}" -ne 1 || ! -f "${installer_images[0]}" ]]; then
            echo "Expected exactly one installer disk image." >&2
            exit 1
          fi
          installer_image=${installer_images[0]}
          xcrun notarytool submit "$installer_image" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json \
            > artifacts/installer-notarisation-evidence.json
          jq -e '.status == "Accepted"' artifacts/installer-notarisation-evidence.json
          xcrun stapler staple "$installer_image"
          xcrun stapler validate "$installer_image" \
            > artifacts/installer-stapler-evidence.txt
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$installer_image" \
            2> artifacts/installer-gatekeeper-evidence.txt

      - name: Generate and verify signed Sparkle appcast
        if: steps.gate.outputs.release_mode == 'signed'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_BUILD: ${{ steps.gate.outputs.build_number }}
        run: |
          fixture="$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"
          private_key="$fixture/sparkle-private-key"
          appcast_dir="$fixture/appcast"
          mkdir -p "$appcast_dir"
          chmod 0700 "$appcast_dir"
          printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | base64 -D > "$private_key"
          chmod 0600 "$private_key"
          update_archives=(artifacts/Piqae-*-macos-update.zip)
          if [[ "${#update_archives[@]}" -ne 1 || ! -f "${update_archives[0]}" ]]; then
            echo "Expected exactly one update archive." >&2
            exit 1
          fi
          public_update="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-update.zip"
          cp "${update_archives[0]}" "$appcast_dir/$public_update"
          sparkle_bin="$GITHUB_WORKSPACE/shells/macos/.build/artifacts/sparkle/Sparkle/bin"
          SPARKLE_BIN_DIR="$sparkle_bin" \
          SPARKLE_PRIVATE_KEY_FILE="$private_key" \
          PIQAE_SPARKLE_DOWNLOAD_URL_PREFIX="$SPARKLE_DOWNLOAD_URL_PREFIX" \
            packaging/macos/generate-appcast.sh \
              "$appcast_dir" \
              "$appcast_dir/appcast.xml"
          PIQAE_SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            packaging/macos/verify-update-signature.sh \
              "$appcast_dir/$public_update" \
              "$appcast_dir/appcast.xml"
          install -m 0644 "$appcast_dir/appcast.xml" artifacts/appcast.xml

      - name: Write release evidence and checksums
        shell: bash
        env:
          RELEASE_MODE: ${{ steps.gate.outputs.release_mode }}
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_BUILD: ${{ steps.gate.outputs.build_number }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          {
            echo "version=$RELEASE_VERSION"
            echo "build=$RELEASE_BUILD"
            echo "mode=$RELEASE_MODE"
            echo "architectures=arm64 x86_64"
            echo "support_claim=release candidate; physical printer and clean-install certification remain separate"
            if [[ "$REPOSITORY_PRIVATE" == true ]]; then
              echo "github_provenance_attestation=unavailable for private repositories on the current GitHub plan"
            else
              echo "github_provenance_attestation=generated by the following workflow step"
            fi
            if [[ "$RELEASE_MODE" == unsigned-preview ]]; then
              echo "signature=absent"
              echo "notarisation=not attempted"
              echo "sparkle_updates=disabled"
            else
              echo "signature=app, node, and executor evidence in codesign-evidence.txt"
              echo "notarisation=app, installer package, and disk image evidence recorded in the notarisation evidence files"
              echo "installer=Developer ID Installer signed package in a Developer ID signed, Apple notarised, and stapled DMG"
              echo "sparkle_updates=Ed25519 archive signature verified with public key"
            fi
          } > artifacts/RELEASE-EVIDENCE.txt
          (
            cd artifacts
            checksum_file=$(mktemp)
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print |
              sort |
              xargs shasum -a 256 > "$checksum_file"
            mv "$checksum_file" SHA256SUMS
          )

      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: github.event.repository.private == false
        with:
          subject-path: artifacts/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.gate.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Remove credential and scratch state
        if: always()
        shell: bash
        run: |
          if [[ -n "${PIQAE_RELEASE_KEYCHAIN:-}" && -e "$PIQAE_RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$PIQAE_RELEASE_KEYCHAIN" || true
          fi
          rm -rf -- "$GITHUB_WORKSPACE/.piqae-test-fixtures/native-release"

  evidence:
    name: Audit macOS release evidence
    needs: candidate
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-evidence.yml
    with:
      artifact_name: ${{ needs.candidate.outputs.artifact_name }}
      release_name: macos-${{ needs.candidate.outputs.version }}-${{ needs.candidate.outputs.build_number }}

  publish:
    name: Promote signed macOS release
    needs: [candidate, evidence]
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    environment: native-release
    permissions:
      contents: write
    concurrency:
      group: piqae-native-stable-promotion
      cancel-in-progress: false
    env:
      CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
      RELEASE_BUILD: ${{ needs.candidate.outputs.build_number }}
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: artifacts

      - name: Stage public macOS artifacts and metadata
        shell: bash
        run: |
          if [[ "${{ needs.candidate.outputs.release_mode }}" != signed ]]; then
            echo "Stable publication refuses a non-signed candidate." >&2
            exit 1
          fi
          source_user="artifacts/Piqae-${RELEASE_VERSION}-${RELEASE_BUILD}-macos-installer.pkg"
          source_update="artifacts/Piqae-${RELEASE_VERSION}-${RELEASE_BUILD}-macos-update.zip"
          user_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-universal.pkg"
          update_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-update.zip"
          sbom_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-SBOM.spdx.json"
          mkdir -p promotion
          install -m 0644 "$source_user" "promotion/$user_name"
          install -m 0644 "$source_update" "promotion/$update_name"
          install -m 0644 artifacts/SBOM.spdx.json "promotion/$sbom_name"
          install -m 0644 artifacts/appcast.xml promotion/appcast-macos.xml
          user_sha=$(sha256sum "promotion/$user_name" | awk '{print $1}')
          published_at=$(git show -s --format=%cI "$GITHUB_SHA")
          printf '%s  %s\n' "$user_sha" "$user_name" > "promotion/$user_name.sha256"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg file "$user_name" \
            --arg sha "$user_sha" \
            --arg now "$published_at" \
            '{
              platform: "macos",
              publishedAt: $now,
              artifact: {
                id: "macos-universal",
                platform: "macos",
                title: "Piqae for macOS",
                version: $version,
                fileName: $file,
                architectures: ["arm64", "x86_64"],
                minimumOs: "macOS 13 or newer",
                status: "preview",
                statusReason: "Signed and notarised installer; physical-printer and atomic complete-node update certification remain release gates.",
                downloadUrl: ("https://downloads.piqae.com/releases/stable/" + $file),
                releaseUrl: "https://piqae.com/downloads",
                sha256: $sha,
                checksumUrl: ("https://downloads.piqae.com/releases/stable/" + $file + ".sha256"),
                signing: {
                  status: "verified",
                  label: "Developer ID signed, Apple notarised and stapled"
                },
                notes: [
                  "Open the standard macOS Installer package for Apple silicon and Intel Macs.",
                  "The menu app, local node, and CUPS executor are Developer ID signed.",
                  "The current Sparkle archive updates the menu application; full node-component rollback remains a separate certification gate."
                ]
              }
            }' > promotion/macos.json

      - name: Attach signed macOS assets to the draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "GitHub release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json isDraft --jq '.isDraft' | grep -Fx true
          else
            gh release create "$tag" --draft --verify-tag \
              --title "Piqae $tag" \
              --notes "Preview candidate. Review checksums, provenance, signatures, notarisation evidence, and the support matrix before publishing."
          fi
          gh release upload "$tag" \
            promotion/piqae-macos-* \
            promotion/appcast-macos.xml \
            --clobber

      - name: Upload and verify immutable macOS release
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIQAE_RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIQAE_RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PIQAE_RELEASES_S3_ENDPOINT: ${{ secrets.PIQAE_RELEASES_S3_ENDPOINT }}
          PIQAE_RELEASES_S3_BUCKET: ${{ secrets.PIQAE_RELEASES_S3_BUCKET }}
          PIQAE_RELEASES_S3_REGION: ${{ secrets.PIQAE_RELEASES_S3_REGION }}
        run: |
          prefix="native/releases/$RELEASE_VERSION/macos-${RELEASE_BUILD}-${GITHUB_RUN_ATTEMPT}"
          user_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-universal.pkg"
          update_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-update.zip"
          sbom_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-SBOM.spdx.json"
          packaging/release/publish-s3-object.sh immutable \
            "promotion/$user_name" "$prefix/$user_name" application/vnd.apple.installer+xml
          packaging/release/publish-s3-object.sh immutable \
            "promotion/$user_name.sha256" "$prefix/$user_name.sha256" text/plain
          packaging/release/publish-s3-object.sh immutable \
            "promotion/$update_name" "$prefix/$update_name" application/zip
          packaging/release/publish-s3-object.sh immutable \
            "promotion/$sbom_name" "$prefix/$sbom_name" application/spdx+json
          packaging/release/publish-s3-object.sh immutable \
            promotion/appcast-macos.xml "$prefix/appcast-macos.xml" application/xml
          packaging/release/publish-s3-object.sh immutable \
            promotion/macos.json "$prefix/macos.json" application/json

      - name: Promote macOS artifacts and signed appcast
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIQAE_RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIQAE_RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PIQAE_RELEASES_S3_ENDPOINT: ${{ secrets.PIQAE_RELEASES_S3_ENDPOINT }}
          PIQAE_RELEASES_S3_BUCKET: ${{ secrets.PIQAE_RELEASES_S3_BUCKET }}
          PIQAE_RELEASES_S3_REGION: ${{ secrets.PIQAE_RELEASES_S3_REGION }}
        run: |
          prefix="native/releases/$RELEASE_VERSION/macos-${RELEASE_BUILD}-${GITHUB_RUN_ATTEMPT}"
          user_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-universal.pkg"
          update_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-update.zip"
          sbom_name="piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-SBOM.spdx.json"
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$user_name" "native/stable/$user_name" application/vnd.apple.installer+xml
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$user_name.sha256" "native/stable/$user_name.sha256" text/plain
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$user_name" native/stable/piqae-macos-universal.pkg application/vnd.apple.installer+xml
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$update_name" "native/stable/$update_name" application/zip
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$update_name" native/stable/piqae-macos-update.zip application/zip
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$sbom_name" "native/stable/$sbom_name" application/spdx+json
          # The appcast is the commit point and is promoted only after every
          # referenced update archive has been independently verified.
          packaging/release/publish-s3-object.sh promote \
            "$prefix/appcast-macos.xml" native/stable/appcast-macos.xml application/xml

      - name: Merge and promote stable release manifest
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIQAE_RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIQAE_RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PIQAE_RELEASES_S3_ENDPOINT: ${{ secrets.PIQAE_RELEASES_S3_ENDPOINT }}
          PIQAE_RELEASES_S3_BUCKET: ${{ secrets.PIQAE_RELEASES_S3_BUCKET }}
          PIQAE_RELEASES_S3_REGION: ${{ secrets.PIQAE_RELEASES_S3_REGION }}
        run: |
          if packaging/release/publish-s3-object.sh fetch \
            native/stable/manifest.json promotion/current-manifest.json
          then
            jq -e \
              '.schemaVersion == 1
               and (.artifacts | type == "array")
               and all(.artifacts[];
                 .status != "supported"
                 and .signing.status == "verified"
                 and (.sha256 | test("^[a-f0-9]{64}$"))
                 and (.downloadUrl | startswith("https://downloads.piqae.com/releases/stable/")))' \
              promotion/current-manifest.json >/dev/null
          else
            code=$?
            if [[ "$code" -ne 3 ]]; then
              exit "$code"
            fi
            jq -n \
              --arg repository_url "https://github.com/$CANONICAL_REPOSITORY" \
              '{
              schemaVersion: 1,
              channel: "stable",
              currentVersion: "0.0.0",
              updatedAt: null,
              artifacts: [],
              olderReleases: [],
              releasesUrl: "https://piqae.com/downloads",
              repositoryUrl: $repository_url
            }' > promotion/current-manifest.json
          fi
          jq \
            --slurpfile platform promotion/macos.json \
            --arg repository_url "https://github.com/$CANONICAL_REPOSITORY" \
            --arg version "$RELEASE_VERSION" \
            --arg now "$(jq -r '.publishedAt' promotion/macos.json)" \
            '.channel = "stable"
             | .currentVersion = $version
             | .updatedAt = $now
             | .repositoryUrl = $repository_url
             | .artifacts = ([.artifacts[] | select(.id != $platform[0].artifact.id)] + [$platform[0].artifact])' \
            promotion/current-manifest.json > promotion/manifest.json
          jq -e \
            '.schemaVersion == 1
             and .channel == "stable"
             and all(.artifacts[];
               .status != "supported"
               and .signing.status == "verified"
               and (.sha256 | test("^[a-f0-9]{64}$"))
               and (.downloadUrl | startswith("https://downloads.piqae.com/releases/stable/")))' \
            promotion/manifest.json >/dev/null
          manifest_sha=$(sha256sum promotion/manifest.json | awk '{print $1}')
          printf '%s  manifest.json\n' "$manifest_sha" > promotion/manifest.json.sha256
          immutable_manifest="native/releases/$RELEASE_VERSION/macos-${RELEASE_BUILD}-${GITHUB_RUN_ATTEMPT}/manifest.json"
          immutable_checksum="$immutable_manifest.sha256"
          packaging/release/publish-s3-object.sh immutable \
            promotion/manifest.json "$immutable_manifest" application/json
          packaging/release/publish-s3-object.sh immutable \
            promotion/manifest.json.sha256 "$immutable_checksum" text/plain
          packaging/release/publish-s3-object.sh promote \
            "$immutable_checksum" native/stable/manifest.json.sha256 text/plain
          # The shared manifest is the final stable-channel commit point.
          packaging/release/publish-s3-object.sh promote \
            "$immutable_manifest" native/stable/manifest.json application/json

      - name: Verify public macOS update feed and manifest
        shell: bash
        run: |
          appcast=$(mktemp)
          curl --fail --location --silent --show-error --max-time 30 \
            https://downloads.piqae.com/releases/stable/appcast-macos.xml \
            --output "$appcast"
          enclosure=$(python3 - "$appcast" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          enclosure = root.find('./channel/item/enclosure')
          if enclosure is None or not enclosure.get('url'):
              raise SystemExit('The public macOS appcast has no enclosure URL.')
          print(enclosure.get('url'))
          PY
          )
          expected="https://downloads.piqae.com/releases/stable/piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-update.zip"
          if [[ "$enclosure" != "$expected" ]]; then
            echo "The public macOS appcast does not reference the promoted archive." >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --max-time 30 \
            --range 0-0 "$enclosure" --output /dev/null
          curl --fail --location --silent --show-error --max-time 30 \
            https://downloads.piqae.com/releases/stable/manifest.json \
            | jq -e \
              --arg version "$RELEASE_VERSION" \
              --arg download "https://downloads.piqae.com/releases/stable/piqae-macos-${RELEASE_VERSION}-${RELEASE_BUILD}-universal.pkg" \
              '.currentVersion == $version
               and any(.artifacts[];
                 .id == "macos-universal"
                 and .version == $version
                 and .downloadUrl == $download)' \
              >/dev/null
