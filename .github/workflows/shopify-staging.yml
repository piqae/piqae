name: Deploy Shopify staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: shopify-staging-deployment
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && vars.SHOPIFY_STAGING_ENABLED == 'true'
    uses: ./.github/workflows/shopify-deploy.yml
    with:
      target: staging
      source_ref: ${{ github.event.workflow_run.head_sha }}
      version: 0.2.0-staging.${{ github.event.workflow_run.run_number }}
    secrets: inherit
