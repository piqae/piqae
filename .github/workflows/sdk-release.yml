name: Publish Piqae TypeScript SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registry-preflight:
    name: Verify npm package ownership readiness
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require the public package record before trusted publication
        shell: bash
        run: |
          status=$(curl --silent --show-error --output package.json --write-out '%{http_code}' \
            https://registry.npmjs.org/@piqae%2fsdk)
          if [[ "$status" != 200 ]]; then
            echo '::error::Create/reserve @piqae/sdk on npm and configure its GitHub trusted publisher before pushing an SDK tag.'
            exit 1
          fi
          jq -e '.name == "@piqae/sdk"' package.json >/dev/null

  package:
    name: Verify and package @piqae/sdk
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="sdk-v$(node -p "require('./sdk/typescript/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Expected tag ${expected}; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Verify generated contract types
        run: pnpm --filter @piqae/sdk generate:check
      - name: Check, test, and build
        run: |
          pnpm --filter @piqae/sdk check
          pnpm --filter @piqae/sdk test
          pnpm --filter @piqae/sdk build
          pnpm --filter @piqae/sdk lint
          pnpm --filter @piqae/sdk smoke:package
      - name: Create package tarball
        working-directory: sdk/typescript
        run: |
          mkdir -p ../../artifacts
          npm pack --pack-destination ../../artifacts
          cd ../../artifacts
          sha256sum piqae-sdk-*.tgz > SHA256SUMS-sdk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piqae-sdk-${{ github.ref_name }}
          path: |
            artifacts/piqae-sdk-*.tgz
            artifacts/SHA256SUMS-sdk
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish npm package with provenance
    needs: [registry-preflight, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: piqae-sdk-${{ github.ref_name }}
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - name: Publish the already-tested tarball
        run: npm publish ./artifacts/piqae-sdk-*.tgz --access public --provenance

  publish-github-packages:
    name: Mirror SDK to GitHub Packages
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: piqae-sdk-${{ github.ref_name }}
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@piqae'
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish ./artifacts/piqae-sdk-*.tgz --registry https://npm.pkg.github.com --access public

  github-release:
    name: Attach SDK package to GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: piqae-sdk-${{ github.ref_name }}
          path: artifacts
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag \
            --title "Piqae TypeScript SDK ${GITHUB_REF_NAME#sdk-v}" --generate-notes
