name: Publish Piqae TypeScript SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package @piqae/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="sdk-v$(node -p "require('./sdk/typescript/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Expected tag ${expected}; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Verify generated contract types
        run: pnpm --filter @piqae/sdk generate:check
      - name: Check, test, and build
        run: |
          pnpm --filter @piqae/sdk check
          pnpm --filter @piqae/sdk test
          pnpm --filter @piqae/sdk build
          pnpm --filter @piqae/sdk lint
          pnpm --filter @piqae/sdk smoke:package
      - name: Create package tarball
        working-directory: sdk/typescript
        run: |
          mkdir -p ../../artifacts
          npm pack --pack-destination ../../artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piqae-sdk-${{ github.ref_name }}
          path: artifacts/piqae-sdk-*.tgz
          if-no-files-found: error
      - name: Publish to npm with trusted provenance
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: sdk/typescript
        run: |
          if [ "${GITHUB_REPOSITORY}" != "piqae/piqae" ]; then
            echo "npm publishing is enabled only after the repository is piqae/piqae." >&2
            exit 1
          fi
          npm install --global npm@11.19.0
          npm publish --access public --provenance
