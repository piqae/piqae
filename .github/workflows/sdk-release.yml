name: Publish Piqae TypeScript SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package @piqae/sdk
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="sdk-v$(node -p "require('./sdk/typescript/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Expected tag ${expected}; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Verify generated contract types
        run: pnpm --filter @piqae/sdk generate:check
      - name: Check, test, and build
        run: |
          pnpm --filter @piqae/sdk check
          pnpm --filter @piqae/sdk test
          pnpm --filter @piqae/sdk build
          pnpm --filter @piqae/sdk lint
          pnpm --filter @piqae/sdk smoke:package
      - name: Create package tarball
        working-directory: sdk/typescript
        run: |
          mkdir -p ../../artifacts
          npm pack --pack-destination ../../artifacts
          cd ../../artifacts
          sha256sum piqae-sdk-*.tgz > SHA256SUMS-sdk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piqae-sdk-${{ github.ref_name }}
          path: |
            artifacts/piqae-sdk-*.tgz
            artifacts/SHA256SUMS-sdk
          if-no-files-found: error
          retention-days: 14
      - name: Publish to npm with trusted provenance
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: sdk/typescript
        env:
          CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
        run: |
          if [ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]; then
            echo "npm publishing is enabled only in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi
          npm install --global npm@11.19.0
          npm publish --access public --provenance
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@piqae'
      - name: Mirror package to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --registry https://npm.pkg.github.com --access public
      - name: Attach SDK package to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/piqae-sdk-*.tgz \
            artifacts/SHA256SUMS-sdk \
            --verify-tag \
            --title "Piqae TypeScript SDK ${GITHUB_REF_NAME#sdk-v}" \
            --generate-notes
