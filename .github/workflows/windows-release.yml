name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without a leading v
        required: true
        default: "0.1.1"
      publish:
        description: Publish a signed stable release
        required: true
        type: boolean
        default: false
      publish_unsigned_preview:
        description: Publish an explicitly unsigned GitHub prerelease from a v*-windows-preview.* tag
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: SemVer release version without a leading v
        required: true
        type: string
      publish:
        description: Promote after the native-release environment gate
        required: true
        type: boolean
      publish_unsigned_preview:
        description: Publish an explicitly unsigned GitHub prerelease
        required: false
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package x86_64 Windows
    runs-on: ${{ vars.PIQAE_RELEASE_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 90
    environment: native-signing
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      publish: ${{ steps.release.outputs.publish }}
      publish_unsigned_preview: ${{ steps.release.outputs.publish_unsigned_preview }}
      signed: ${{ steps.release.outputs.signed }}
      signing_provider: ${{ steps.release.outputs.signing_provider }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: x86_64-pc-windows-msvc
      WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER || 'artifact-signing' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_RFC3161_TIMESTAMP_URL }}
      WINDOWS_EXPECTED_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_EXPECTED_CERTIFICATE_SUBJECT }}
      WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT }}
      SM_HOST: ${{ vars.DIGICERT_SM_HOST }}
      SM_API_KEY: ${{ secrets.DIGICERT_SM_API_KEY }}
      SM_CLIENT_CERT_FILE_B64: ${{ secrets.DIGICERT_SM_CLIENT_CERT_FILE_B64 }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.DIGICERT_SM_CLIENT_CERT_PASSWORD }}
      SM_KEYPAIR_ALIAS: ${{ secrets.DIGICERT_SM_KEYPAIR_ALIAS }}
      WINSPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.WINSPARKLE_ED25519_PRIVATE_KEY_BASE64 }}
      WINSPARKLE_PUBLIC_KEY: ${{ vars.WINSPARKLE_ED25519_PUBLIC_KEY }}
      WINDOWS_UPDATE_FEED_URL: https://downloads.piqae.com/releases/stable/appcast-windows.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Windows packaging scripts
        shell: pwsh
        run: '& "packaging/windows/Test-WindowsPackaging.ps1"'

      - name: Resolve version and signing mode
        id: release
        shell: pwsh
        run: |
          $versionArguments = @{
            RefType = "${{ github.ref_type }}"
            RefName = "${{ github.ref_name }}"
            RequestedVersion = "${{ inputs.version }}"
            UnsignedPreview = "${{ inputs.publish_unsigned_preview }}" -eq "true"
          }
          $version = & "packaging/windows/Resolve-WindowsReleaseVersion.ps1" @versionArguments
          "version=$version" >> $env:GITHUB_OUTPUT

          if ($env:WINDOWS_SIGNING_PROVIDER -notin @("artifact-signing", "pfx", "digicert-keylocker")) {
            throw "WINDOWS_SIGNING_PROVIDER must be 'artifact-signing', 'pfx', or 'digicert-keylocker'."
          }
          $authenticodeRequirements = if ($env:WINDOWS_SIGNING_PROVIDER -eq "artifact-signing") {
            [ordered]@{
              azure_client_id = $env:AZURE_CLIENT_ID
              azure_tenant_id = $env:AZURE_TENANT_ID
              azure_subscription_id = $env:AZURE_SUBSCRIPTION_ID
              artifact_signing_endpoint = $env:ARTIFACT_SIGNING_ENDPOINT
              artifact_signing_account = $env:ARTIFACT_SIGNING_ACCOUNT_NAME
              artifact_signing_certificate_profile = $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME
            }
          } elseif ($env:WINDOWS_SIGNING_PROVIDER -eq "digicert-keylocker") {
            [ordered]@{
              digicert_host = $env:SM_HOST
              digicert_api_key = $env:SM_API_KEY
              digicert_client_certificate = $env:SM_CLIENT_CERT_FILE_B64
              digicert_client_certificate_password = $env:SM_CLIENT_CERT_PASSWORD
              digicert_keypair_alias = $env:SM_KEYPAIR_ALIAS
            }
          } else {
            [ordered]@{
              authenticode_certificate = $env:WINDOWS_PFX_BASE64
              authenticode_password = $env:WINDOWS_PFX_PASSWORD
            }
          }
          $requirements = [ordered]@{
            timestamp_url = $env:WINDOWS_TIMESTAMP_URL
            expected_certificate_subject = $env:WINDOWS_EXPECTED_CERTIFICATE_SUBJECT
            winsparkle_private_key = $env:WINSPARKLE_PRIVATE_KEY_BASE64
            winsparkle_public_key = $env:WINSPARKLE_PUBLIC_KEY
          }
          if ($env:WINDOWS_SIGNING_PROVIDER -ne "artifact-signing") {
            $requirements["expected_certificate_thumbprint"] = $env:WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT
          }
          foreach ($entry in $authenticodeRequirements.GetEnumerator()) {
            $requirements[$entry.Key] = $entry.Value
          }
          $forceUnsignedPreview = "${{ inputs.publish_unsigned_preview }}" -eq "true"
          $present = if ($forceUnsignedPreview) {
            0
          } else {
            @($requirements.GetEnumerator() | Where-Object { $_.Value }).Count
          }
          if ($present -eq 0) {
            "signed=false" >> $env:GITHUB_OUTPUT
            "artifact_name=piqae-windows-x86_64-unsigned-preview" >> $env:GITHUB_OUTPUT
            "UNSIGNED PREVIEW: signing and automatic updates were explicitly disabled." |
              Out-File -Encoding ascii "SIGNING-STATUS.txt"
          } elseif ($present -eq $requirements.Count) {
            $artifactSigningTimestamp = "http://timestamp.acs.microsoft.com"
            if (
              -not $env:WINDOWS_TIMESTAMP_URL.StartsWith("https://") -and
              -not (
                $env:WINDOWS_SIGNING_PROVIDER -eq "artifact-signing" -and
                $env:WINDOWS_TIMESTAMP_URL -eq $artifactSigningTimestamp
              )
            ) {
              throw "WINDOWS_RFC3161_TIMESTAMP_URL must use HTTPS, except for Microsoft's documented Artifact Signing timestamp endpoint."
            }
            if (-not $env:WINDOWS_UPDATE_FEED_URL.StartsWith("https://")) {
              throw "WINDOWS_UPDATE_FEED_URL must use HTTPS."
            }
            if ($env:WINDOWS_SIGNING_PROVIDER -eq "artifact-signing") {
              if ($env:ARTIFACT_SIGNING_ENDPOINT -notmatch '^https://[a-z0-9-]+\.codesigning\.azure\.net/?$') {
                throw "AZURE_ARTIFACT_SIGNING_ENDPOINT must be an official regional HTTPS codesigning.azure.net endpoint."
              }
            } else {
              $expectedThumbprint = $env:WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT -replace "\s", ""
              if ($expectedThumbprint -notmatch "^[0-9A-Fa-f]{40}$") {
                throw "WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT must be a 40-character SHA-1 certificate thumbprint."
              }
            }
            "signed=true" >> $env:GITHUB_OUTPUT
            "signing_provider=$env:WINDOWS_SIGNING_PROVIDER" >> $env:GITHUB_OUTPUT
            "artifact_name=piqae-windows-x86_64-signed" >> $env:GITHUB_OUTPUT
            "SIGNED RELEASE: expected Authenticode signer and WinSparkle Ed25519 gates are configured." |
              Out-File -Encoding ascii "SIGNING-STATUS.txt"
          } else {
            $missing = $requirements.GetEnumerator() |
              Where-Object { -not $_.Value } |
              ForEach-Object Key
            throw "Signing configuration is partial. Missing: $($missing -join ', ')"
          }
          $signed = $present -eq $requirements.Count
          $publish = "${{ inputs.publish }}" -eq "true"
          $publishUnsignedPreview = "${{ inputs.publish_unsigned_preview }}" -eq "true"
          if ($publish -and $publishUnsignedPreview) {
            throw "Signed stable publication and unsigned preview publication are mutually exclusive."
          }
          if (
            $publish -and (
              "${{ github.ref_type }}" -ne "tag" -or
              "${{ github.ref_name }}" -notmatch "^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$" -or
              "${{ github.ref_protected }}" -ne "true"
            )
          ) {
            throw "Stable publication requires a protected v* tag ref."
          }
          if ($publish -and -not $signed) {
            throw "Stable publication requires Authenticode and WinSparkle signing."
          }
          if ($publishUnsignedPreview) {
            if ($signed) {
              throw "Unsigned preview publication refuses a signed candidate."
            }
            if (
              "${{ github.repository }}" -ne "piqae/piqae" -or
              "${{ github.ref_type }}" -ne "tag" -or
              "${{ github.ref_name }}" -notmatch "^v[0-9]+\.[0-9]+\.[0-9]+-windows-preview\.[0-9]+$" -or
              "${{ github.ref_protected }}" -ne "true"
            ) {
              throw "Public unsigned previews require a protected v<version>-windows-preview.<number> tag in piqae/piqae."
            }
            if ("${{ github.ref_name }}" -notmatch "^v$([regex]::Escape($version))-windows-preview\.[0-9]+$") {
              throw "The preview tag version must match the requested package version '$version'."
            }
          }
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "publish_unsigned_preview=$($publishUnsignedPreview.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: windows-release-x86_64

      - name: Check component versions
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read Cargo package metadata."
          }
          $expected = "${{ steps.release.outputs.version }}"
          $components = @(
            "piqae-agent",
            "piqaectl",
            "piqae-executor-windows",
            "piqae-shell-windows"
          )
          foreach ($component in $components) {
            $package = @($metadata.packages | Where-Object name -eq $component)
            if ($package.Count -ne 1) {
              throw "Expected exactly one Cargo package named '$component'."
            }
            if ($package[0].version -cne $expected) {
              throw "Release version '$expected' differs from $component version '$($package[0].version)'."
            }
          }

      - name: Build Windows binaries
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          cargo build --locked --release --target ${{ env.TARGET }} --bins
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-windows
          -p piqae-shell-windows

      - name: Stage release files
        shell: pwsh
        run: |
          $source = "target\$env:TARGET\release"
          $stage = "artifacts\stage"
          New-Item -ItemType Directory -Force "$stage\service", "$stage\LICENSES" | Out-Null
          Copy-Item `
            "$source\piqae-agent.exe", `
            "$source\piqaectl.exe", `
            "$source\piqae-executor-windows.exe", `
            "$source\piqae-profile-host-windows.exe", `
            "$source\piqae-shell-windows.exe" `
            $stage
          Copy-Item "packaging\windows\*" "$stage\service" -Recurse
          Copy-Item "LICENSE", "NOTICE", "README.md", "SIGNING-STATUS.txt" $stage
          Copy-Item "LICENSES\*" "$stage\LICENSES" -Recurse
          & "packaging/windows/Fetch-Pdfium.ps1" -DestinationDirectory $stage

      - name: Stage pinned WinSparkle runtime and signing tool
        if: steps.release.outputs.signed == 'true'
        id: winsparkle
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP "winsparkle-tool.exe"
          & "packaging/windows/Fetch-WinSparkle.ps1" `
            -DestinationDirectory "artifacts\stage" `
            -SigningToolOutputPath $tool
          if (-not (Test-Path -LiteralPath $tool)) {
            throw "Pinned WinSparkle signing tool is missing."
          }
          "tool=$tool" >> $env:GITHUB_OUTPUT

      - name: Write update configuration
        shell: pwsh
        run: |
          $output = "artifacts\stage\update-config.json"
          if ("${{ steps.release.outputs.signed }}" -eq "true") {
            & "packaging/windows/New-UpdateConfig.ps1" `
              -OutputPath $output `
              -SignedRelease `
              -FeedUrl $env:WINDOWS_UPDATE_FEED_URL `
              -Ed25519PublicKey $env:WINSPARKLE_PUBLIC_KEY
          } else {
            & "packaging/windows/New-UpdateConfig.ps1" -OutputPath $output
          }

      - name: Materialize DigiCert client identity
        if: steps.release.outputs.signed == 'true' && steps.release.outputs.signing_provider == 'digicert-keylocker'
        shell: pwsh
        run: |
          $clientCertificate = Join-Path $env:RUNNER_TEMP "digicert-client-auth.p12"
          [IO.File]::WriteAllBytes(
            $clientCertificate,
            [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64)
          )
          "SM_CLIENT_CERT_FILE=$clientCertificate" >> $env:GITHUB_ENV

      - name: Configure DigiCert KeyLocker remote signer
        if: steps.release.outputs.signed == 'true' && steps.release.outputs.signing_provider == 'digicert-keylocker'
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1
        with:
          use-binary-sha256-checksum: true
          use-github-caching-service: true

      - name: Synchronize DigiCert public certificate
        if: steps.release.outputs.signed == 'true' && steps.release.outputs.signing_provider == 'digicert-keylocker'
        shell: pwsh
        run: |
          smctl windows certsync --keypair-alias $env:SM_KEYPAIR_ALIAS
          if ($LASTEXITCODE -ne 0) {
            throw "DigiCert KeyLocker certificate synchronization failed."
          }

      - name: Authenticate to Azure with GitHub OIDC
        if: steps.release.outputs.signed == 'true' && steps.release.outputs.signing_provider == 'artifact-signing'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Artifact Signing-sign staged Piqae binaries
        if: steps.release.outputs.signed == 'true' && steps.release.outputs.signing_provider == 'artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\artifacts\stage
          files-folder-filter: piqae-*.exe,piqaectl.exe
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.WINDOWS_TIMESTAMP_URL }}
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Authenticode-sign staged Piqae binaries
        if: steps.release.outputs.signed == 'true' && steps.release.outputs.signing_provider != 'artifact-signing'
        id: authenticode
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "piqae-authenticode.pfx"
          if ("${{ steps.release.outputs.signing_provider }}" -eq "pfx") {
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
            )
            "certificate=$certificate" >> $env:GITHUB_OUTPUT
          }
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter "signtool.exe" `
            -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw "Windows SDK signtool.exe was not found."
          }
          "signtool=$signTool" >> $env:GITHUB_OUTPUT
          $binaries = Get-ChildItem "artifacts\stage" -File |
            Where-Object { $_.Name -like "piqae-*.exe" -or $_.Name -eq "piqaectl.exe" }
          foreach ($binary in $binaries) {
            $signArguments = @(
              "sign", "/fd", "SHA256", "/td", "SHA256",
              "/tr", $env:WINDOWS_TIMESTAMP_URL
            )
            if ("${{ steps.release.outputs.signing_provider }}" -eq "digicert-keylocker") {
              $signArguments += @(
                "/sha1",
                ($env:WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT -replace "\s", "")
              )
            } else {
              $signArguments += @("/f", $certificate, "/p", $env:WINDOWS_PFX_PASSWORD)
            }
            $signArguments += $binary.FullName
            & $signTool @signArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed for $($binary.Name)."
            }
            & "packaging/windows/Assert-AuthenticodeSigner.ps1" `
              -Path $binary.FullName `
              -ExpectedSubject $env:WINDOWS_EXPECTED_CERTIFICATE_SUBJECT `
              -ExpectedThumbprint $env:WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT
          }

      - name: Verify staged Piqae Authenticode signatures
        if: steps.release.outputs.signed == 'true'
        shell: pwsh
        run: |
          $binaries = Get-ChildItem "artifacts\stage" -File |
            Where-Object { $_.Name -like "piqae-*.exe" -or $_.Name -eq "piqaectl.exe" }
          foreach ($binary in $binaries) {
            $arguments = @{
              Path = $binary.FullName
              ExpectedSubject = $env:WINDOWS_EXPECTED_CERTIFICATE_SUBJECT
            }
            if ("${{ steps.release.outputs.signing_provider }}" -ne "artifact-signing") {
              $arguments["ExpectedThumbprint"] = $env:WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT
            } else {
              $arguments["AllowRotatingCertificate"] = $true
            }
            & "packaging/windows/Assert-AuthenticodeSigner.ps1" @arguments
          }

      - name: Verify preview binaries are not represented as signed
        if: steps.release.outputs.signed != 'true'
        shell: pwsh
        run: |
          $binaries = Get-ChildItem "artifacts\stage" -File |
            Where-Object { $_.Name -like "piqae-*.exe" -or $_.Name -eq "piqaectl.exe" }
          foreach ($binary in $binaries) {
            $signature = Get-AuthenticodeSignature -LiteralPath $binary.FullName
            if ($signature.Status -eq "Valid") {
              throw "$($binary.Name) is signed but this workflow selected unsigned-preview mode."
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $source = (Resolve-Path "artifacts\stage").Path
          $output = New-Item -ItemType Directory -Force "artifacts\release"
          $updateConfig = (Resolve-Path "artifacts\stage\update-config.json").Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $arguments = @(
            "/DSourceDir=$source"
            "/DOutputDir=$($output.FullName)"
            "/DAppVersion=${{ steps.release.outputs.version }}"
            "/DUpdateConfigFile=$updateConfig"
            "packaging\windows\Piqae.iss"
          )
          if (
            "${{ steps.release.outputs.signed }}" -eq "true" -and
            "${{ steps.release.outputs.signing_provider }}" -ne "artifact-signing"
          ) {
            if ("${{ steps.release.outputs.signing_provider }}" -eq "digicert-keylocker") {
              $thumbprint = $env:WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT -replace "\s", ""
              $signCommand = (
                '"{0}" sign /fd SHA256 /td SHA256 /tr "{1}" /sha1 "{2}" $f' -f
                "${{ steps.authenticode.outputs.signtool }}",
                $env:WINDOWS_TIMESTAMP_URL,
                $thumbprint
              )
            } else {
              $signCommand = (
                '"{0}" sign /fd SHA256 /td SHA256 /tr "{1}" /f "{2}" /p "{3}" $f' -f
                "${{ steps.authenticode.outputs.signtool }}",
                $env:WINDOWS_TIMESTAMP_URL,
                "${{ steps.authenticode.outputs.certificate }}",
                $env:WINDOWS_PFX_PASSWORD
              )
            }
            $arguments = @(
              "/Spiqaesign=$signCommand",
              "/DInnoSignToolName=piqaesign"
            ) + $arguments
          }
          & $compiler @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Artifact Signing-sign Windows installer
        if: steps.release.outputs.signed == 'true' && steps.release.outputs.signing_provider == 'artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\artifacts\release
          files-folder-filter: piqae-windows-x86_64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.WINDOWS_TIMESTAMP_URL }}
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Verify installer Authenticode signature
        if: steps.release.outputs.signed == 'true'
        shell: pwsh
        run: |
          $installer = "artifacts\release\piqae-windows-x86_64-setup.exe"
          $arguments = @{
            Path = $installer
            ExpectedSubject = $env:WINDOWS_EXPECTED_CERTIFICATE_SUBJECT
          }
          if ("${{ steps.release.outputs.signing_provider }}" -ne "artifact-signing") {
            $arguments["ExpectedThumbprint"] = $env:WINDOWS_EXPECTED_CERTIFICATE_THUMBPRINT
          } else {
            $arguments["AllowRotatingCertificate"] = $true
          }
          & "packaging/windows/Assert-AuthenticodeSigner.ps1" @arguments

      - name: Verify preview installer is unsigned
        if: steps.release.outputs.signed != 'true'
        shell: pwsh
        run: |
          $installer = "artifacts\release\piqae-windows-x86_64-setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -eq "Valid") {
            throw "Installer is signed but this workflow selected unsigned-preview mode."
          }

      - name: Generate signed WinSparkle appcast
        if: steps.release.outputs.signed == 'true'
        shell: pwsh
        run: |
          $installer = Resolve-Path "artifacts\release\piqae-windows-x86_64-setup.exe"
          $privateKey = Join-Path $env:RUNNER_TEMP "winsparkle-ed25519.key"
          [IO.File]::WriteAllBytes(
            $privateKey,
            [Convert]::FromBase64String($env:WINSPARKLE_PRIVATE_KEY_BASE64)
          )
          $publicKeyOutput = & "${{ steps.winsparkle.outputs.tool }}" public-key `
            --private-key-file $privateKey |
            Out-String
          if ($LASTEXITCODE -ne 0 -or -not $publicKeyOutput.Contains($env:WINSPARKLE_PUBLIC_KEY)) {
            throw "WinSparkle private key does not match WINSPARKLE_ED25519_PUBLIC_KEY."
          }
          $signatureOutput = & "${{ steps.winsparkle.outputs.tool }}" sign `
            --private-key-file $privateKey `
            $installer.Path |
            Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "WinSparkle update signing failed."
          }
          if ($signatureOutput -notmatch 'sparkle:edSignature="([^"]+)"') {
            throw "WinSparkle tool did not return an Ed25519 signature."
          }
          $signature = $Matches[1]
          $installerLength = (Get-Item -LiteralPath $installer.Path).Length
          $publicName = "piqae-windows-${{ steps.release.outputs.version }}-x86_64-setup.exe"
          $download = "https://downloads.piqae.com/releases/stable/$publicName"
          $notes = "https://piqae.com/downloads"
          & "packaging/windows/New-WinSparkleAppcast.ps1" `
            -OutputPath "artifacts\release\appcast-windows.xml" `
            -Version "${{ steps.release.outputs.version }}" `
            -DownloadUrl $download `
            -Length $installerLength `
            -Ed25519Signature $signature `
            -PublishedAt ([datetime]::UtcNow) `
            -ReleaseNotesUrl $notes

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts/stage
          format: spdx-json
          output-file: artifacts/release/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write checksums and release status
        shell: pwsh
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          Copy-Item "SIGNING-STATUS.txt" "artifacts\release\SIGNING-STATUS.txt"
          if ("${{ steps.release.outputs.signed }}" -ne "true") {
            $source = "artifacts\release\piqae-windows-x86_64-setup.exe"
            $preview = "artifacts\release\piqae-windows-${{ steps.release.outputs.version }}-x86_64-unsigned-preview-setup.exe"
            Move-Item -LiteralPath $source -Destination $preview
          }
          if ($env:REPOSITORY_PRIVATE -eq "true") {
            Add-Content `
              "artifacts\release\SIGNING-STATUS.txt" `
              "GitHub provenance attestation unavailable for private repositories on the current plan."
          } else {
            Add-Content `
              "artifacts\release\SIGNING-STATUS.txt" `
              "GitHub provenance attestation is generated by the following workflow step."
          }
          $files = Get-ChildItem "artifacts\release" -File |
            Where-Object Name -ne "SHA256SUMS"
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Out-File -Encoding ascii "artifacts\release\SHA256SUMS"

      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: github.event.repository.private == false
        with:
          subject-path: artifacts/release/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always() && steps.release.outputs.signed == 'true'
        shell: pwsh
        run: |
          Remove-Item `
            (Join-Path $env:RUNNER_TEMP "piqae-authenticode.pfx"), `
            (Join-Path $env:RUNNER_TEMP "digicert-client-auth.p12"), `
            (Join-Path $env:RUNNER_TEMP "winsparkle-ed25519.key") `
            -Force `
            -ErrorAction SilentlyContinue

  evidence:
    name: Audit Windows release evidence
    needs: package
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-evidence.yml
    with:
      artifact_name: ${{ needs.package.outputs.artifact_name }}
      release_name: windows-${{ needs.package.outputs.version }}

  publish_unsigned_preview:
    name: Publish unsigned Windows prerelease
    needs: [package, evidence]
    if: needs.package.outputs.publish_unsigned_preview == 'true'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: native-release
    permissions:
      actions: read
      contents: write
    concurrency:
      group: piqae-native-preview-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: artifacts

      - name: Verify and stage the explicitly unsigned preview
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          installer="artifacts/piqae-windows-${RELEASE_VERSION}-x86_64-unsigned-preview-setup.exe"
          test -f "$installer"
          tr -d '\r' < artifacts/SIGNING-STATUS.txt \
            | grep -Fqx "UNSIGNED PREVIEW: signing and automatic updates were explicitly disabled."
          (cd artifacts && sha256sum --check SHA256SUMS)
          if find artifacts -maxdepth 1 -type f -name 'appcast-*.xml' | grep -q .; then
            echo "Unsigned preview publication refuses update appcasts." >&2
            exit 1
          fi
          installer_name=$(basename "$installer")
          sbom_name="piqae-windows-${RELEASE_VERSION}-unsigned-preview-SBOM.spdx.json"
          status_name="piqae-windows-${RELEASE_VERSION}-unsigned-preview-SIGNING-STATUS.txt"
          mkdir -p promotion
          install -m 0644 "$installer" "promotion/$installer_name"
          install -m 0644 artifacts/SBOM.spdx.json "promotion/$sbom_name"
          install -m 0644 artifacts/SIGNING-STATUS.txt "promotion/$status_name"
          installer_sha=$(sha256sum "promotion/$installer_name" | awk '{print $1}')
          published_at=$(git show -s --format=%cI "$GITHUB_SHA")
          printf '%s  %s\n' "$installer_sha" "$installer_name" \
            > "promotion/$installer_name.sha256"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg file "$installer_name" \
            --arg sha "$installer_sha" \
            --arg now "$published_at" \
            --arg repository_url "https://github.com/$GITHUB_REPOSITORY" \
            --arg release_url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            '{
              schemaVersion: 1,
              channel: "preview",
              currentVersion: $version,
              updatedAt: $now,
              releasesUrl: "https://piqae.com/downloads",
              repositoryUrl: $repository_url,
              olderReleases: [],
              artifacts: [{
                id: "windows-x86_64",
                platform: "windows",
                title: "Piqae for Windows",
                version: $version,
                fileName: $file,
                architectures: ["x86_64"],
                minimumOs: "Windows 10 or 11, 64-bit",
                status: "preview",
                statusReason: "Unsigned evaluation build; Microsoft Artifact Signing and Windows certification gates remain open.",
                downloadUrl: ("https://downloads.piqae.com/releases/preview/" + $file),
                releaseUrl: $release_url,
                sha256: $sha,
                checksumUrl: ("https://downloads.piqae.com/releases/preview/" + $file + ".sha256"),
                signing: { status: "unsigned", label: "Unsigned Windows preview" },
                notes: [
                  "Windows will show an Unknown publisher or Microsoft Defender SmartScreen warning.",
                  "Automatic updates are disabled; use only for evaluation."
                ]
              }]
            }' > promotion/manifest.json
          jq -e \
            --arg version "$RELEASE_VERSION" \
            '.schemaVersion == 1
             and .channel == "preview"
             and .currentVersion == $version
             and (.artifacts | length == 1)
             and .artifacts[0].status == "preview"
             and .artifacts[0].signing.status == "unsigned"
             and (.artifacts[0].downloadUrl | startswith("https://downloads.piqae.com/releases/preview/"))
             and (.artifacts[0].sha256 | test("^[a-f0-9]{64}$"))' \
            promotion/manifest.json >/dev/null
          manifest_sha=$(sha256sum promotion/manifest.json | awk '{print $1}')
          printf '%s  manifest.json\n' "$manifest_sha" > promotion/manifest.json.sha256

      - name: Upload and promote verified unsigned preview objects
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIQAE_RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIQAE_RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PIQAE_RELEASES_S3_ENDPOINT: ${{ secrets.PIQAE_RELEASES_S3_ENDPOINT }}
          PIQAE_RELEASES_S3_BUCKET: ${{ secrets.PIQAE_RELEASES_S3_BUCKET }}
          PIQAE_RELEASES_S3_REGION: ${{ secrets.PIQAE_RELEASES_S3_REGION }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          prefix="native/releases/$RELEASE_VERSION/windows-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          installer_name="piqae-windows-${RELEASE_VERSION}-x86_64-unsigned-preview-setup.exe"
          sbom_name="piqae-windows-${RELEASE_VERSION}-unsigned-preview-SBOM.spdx.json"
          status_name="piqae-windows-${RELEASE_VERSION}-unsigned-preview-SIGNING-STATUS.txt"
          declare -A content_types=(
            ["$installer_name"]="application/vnd.microsoft.portable-executable"
            ["$installer_name.sha256"]="text/plain"
            ["$sbom_name"]="application/spdx+json"
            ["$status_name"]="text/plain"
            ["manifest.json"]="application/json"
            ["manifest.json.sha256"]="text/plain"
          )
          for name in "$installer_name" "$installer_name.sha256" "$sbom_name" "$status_name" manifest.json manifest.json.sha256; do
            packaging/release/publish-s3-object.sh immutable \
              "promotion/$name" "$prefix/$name" "${content_types[$name]}"
          done
          # Preview manifest is the channel commit point. Stable keys and
          # appcasts are deliberately unreachable from this job.
          for name in "$installer_name" "$installer_name.sha256" "$sbom_name" "$status_name" manifest.json.sha256 manifest.json; do
            packaging/release/publish-s3-object.sh promote \
              "$prefix/$name" "native/preview/$name" "${content_types[$name]}"
          done

      - name: Verify public unsigned preview routes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          base=https://downloads.piqae.com/releases/preview
          installer_name="piqae-windows-${RELEASE_VERSION}-x86_64-unsigned-preview-setup.exe"
          sbom_name="piqae-windows-${RELEASE_VERSION}-unsigned-preview-SBOM.spdx.json"
          status_name="piqae-windows-${RELEASE_VERSION}-unsigned-preview-SIGNING-STATUS.txt"
          smoke_dir=$(mktemp -d)
          trap 'rm -rf -- "$smoke_dir"' EXIT
          manifest="$smoke_dir/manifest.json"
          curl --fail --location --silent --show-error --max-time 30 \
            "$base/manifest.json" --output "$manifest"
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg download "$base/$installer_name" \
            '.channel == "preview"
             and .currentVersion == $version
             and any(.artifacts[];
               .id == "windows-x86_64"
               and .version == $version
               and .status == "preview"
               and .signing.status == "unsigned"
               and .downloadUrl == $download)' \
            "$manifest" >/dev/null
          curl --fail --location --silent --show-error --max-time 30 \
            --range 0-0 "$base/$installer_name" --output /dev/null
          curl --fail --location --silent --show-error --max-time 30 \
            "$base/$installer_name.sha256" \
            | grep -Fx "$(jq -r '.artifacts[0].sha256' "$manifest")  $installer_name"
          curl --fail --location --silent --show-error --max-time 30 \
            "$base/$sbom_name" | jq -e '.spdxVersion | startswith("SPDX-")' >/dev/null
          curl --fail --location --silent --show-error --max-time 30 \
            "$base/$status_name" \
            | tr -d '\r' \
            | grep -Fx "UNSIGNED PREVIEW: signing and automatic updates were explicitly disabled."
          manifest_checksum="$smoke_dir/manifest.json.sha256"
          curl --fail --location --silent --show-error --max-time 30 \
            "$base/manifest.json.sha256" --output "$manifest_checksum"
          (cd "$smoke_dir" && sha256sum --check manifest.json.sha256)
          if curl --fail --location --silent --show-error --max-time 10 \
            "$base/appcast-windows.xml" --output /dev/null; then
            echo "Unsigned preview publication must not expose a Windows appcast." >&2
            exit 1
          fi

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/windows-preview-notes.md"
          printf '%s\n' \
            '# Unsigned Windows Preview' \
            '' \
            '**This installer is not Authenticode-signed. Windows will show an Unknown publisher / Microsoft Defender SmartScreen warning.**' \
            '' \
            'Use this preview only for evaluation. It has no automatic update feed and Windows remains outside Piqae production support until the documented physical-printer, clean-install, recovery, and signing gates pass.' \
            '' \
            'Verify the downloaded installer against `SHA256SUMS` and the GitHub build-provenance attestation before running it.' \
            > "$notes_file"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = true
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --prerelease \
              --title "Piqae ${RELEASE_VERSION} — unsigned Windows preview" \
              --notes-file "$notes_file"
          fi
          gh release upload "$GITHUB_REF_NAME" promotion/* --clobber

  publish:
    name: Promote signed Windows release
    needs: [package, evidence]
    if: needs.package.outputs.publish == 'true'
    runs-on: ${{ vars.PIQAE_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: native-release
    permissions:
      contents: write
    concurrency:
      group: piqae-native-stable-promotion
      cancel-in-progress: false
    env:
      CANONICAL_REPOSITORY: ${{ vars.PIQAE_CANONICAL_REPOSITORY || 'piqae/piqae' }}
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: artifacts

      - name: Stage public Windows artifacts and metadata
        shell: bash
        run: |
          if [[ "${{ needs.package.outputs.signed }}" != true ]]; then
            echo "Stable publication refuses a non-signed candidate." >&2
            exit 1
          fi
          installer_name="piqae-windows-${RELEASE_VERSION}-x86_64-setup.exe"
          sbom_name="piqae-windows-${RELEASE_VERSION}-SBOM.spdx.json"
          mkdir -p promotion
          install -m 0644 \
            artifacts/piqae-windows-x86_64-setup.exe \
            "promotion/$installer_name"
          install -m 0644 artifacts/appcast-windows.xml promotion/appcast-windows.xml
          install -m 0644 artifacts/SBOM.spdx.json "promotion/$sbom_name"
          installer_sha=$(sha256sum "promotion/$installer_name" | awk '{print $1}')
          published_at=$(git show -s --format=%cI "$GITHUB_SHA")
          printf '%s  %s\n' "$installer_sha" "$installer_name" \
            > "promotion/$installer_name.sha256"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg file "$installer_name" \
            --arg sha "$installer_sha" \
            --arg now "$published_at" \
            '{
              platform: "windows",
              publishedAt: $now,
              artifact: {
                id: "windows-x86_64",
                platform: "windows",
                title: "Piqae for Windows",
                version: $version,
                fileName: $file,
                architectures: ["x86_64"],
                minimumOs: "Windows 10 or 11, 64-bit",
                status: "preview",
                statusReason: "Signed distribution; physical-printer, clean-install, and complete update-rollback certification remain release gates.",
                downloadUrl: ("https://downloads.piqae.com/releases/stable/" + $file),
                releaseUrl: "https://piqae.com/downloads",
                sha256: $sha,
                checksumUrl: ("https://downloads.piqae.com/releases/stable/" + $file + ".sha256"),
                signing: {
                  status: "verified",
                  label: "Authenticode and WinSparkle Ed25519 verified"
                },
                notes: [
                  "Per-user Windows node and native driver-profile host.",
                  "The signed WinSparkle feed and native tray integration are included; automatic rollback remains a separate release gate."
                ]
              }
            }' > promotion/windows.json

      - name: Attach signed Windows assets to the draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "GitHub release publishing is enabled only in $CANONICAL_REPOSITORY." >&2
            exit 1
          fi
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json isDraft --jq '.isDraft' | grep -Fx true
          else
            gh release create "$tag" --draft --verify-tag \
              --title "Piqae $tag" \
              --notes "Preview candidate. Review checksums, provenance, signatures, notarisation evidence, and the support matrix before publishing."
          fi
          gh release upload "$tag" \
            promotion/piqae-windows-* \
            promotion/appcast-windows.xml \
            --clobber

      - name: Upload and verify immutable Windows release
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIQAE_RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIQAE_RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PIQAE_RELEASES_S3_ENDPOINT: ${{ secrets.PIQAE_RELEASES_S3_ENDPOINT }}
          PIQAE_RELEASES_S3_BUCKET: ${{ secrets.PIQAE_RELEASES_S3_BUCKET }}
          PIQAE_RELEASES_S3_REGION: ${{ secrets.PIQAE_RELEASES_S3_REGION }}
        run: |
          prefix="native/releases/$RELEASE_VERSION/windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          installer_name="piqae-windows-${RELEASE_VERSION}-x86_64-setup.exe"
          sbom_name="piqae-windows-${RELEASE_VERSION}-SBOM.spdx.json"
          packaging/release/publish-s3-object.sh immutable \
            "promotion/$installer_name" "$prefix/$installer_name" \
            application/vnd.microsoft.portable-executable
          packaging/release/publish-s3-object.sh immutable \
            "promotion/$installer_name.sha256" "$prefix/$installer_name.sha256" text/plain
          packaging/release/publish-s3-object.sh immutable \
            "promotion/$sbom_name" "$prefix/$sbom_name" application/spdx+json
          packaging/release/publish-s3-object.sh immutable \
            promotion/appcast-windows.xml "$prefix/appcast-windows.xml" application/xml
          packaging/release/publish-s3-object.sh immutable \
            promotion/windows.json "$prefix/windows.json" application/json

      - name: Promote Windows artifacts and signed appcast
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIQAE_RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIQAE_RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PIQAE_RELEASES_S3_ENDPOINT: ${{ secrets.PIQAE_RELEASES_S3_ENDPOINT }}
          PIQAE_RELEASES_S3_BUCKET: ${{ secrets.PIQAE_RELEASES_S3_BUCKET }}
          PIQAE_RELEASES_S3_REGION: ${{ secrets.PIQAE_RELEASES_S3_REGION }}
        run: |
          prefix="native/releases/$RELEASE_VERSION/windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          installer_name="piqae-windows-${RELEASE_VERSION}-x86_64-setup.exe"
          sbom_name="piqae-windows-${RELEASE_VERSION}-SBOM.spdx.json"
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$installer_name" "native/stable/$installer_name" \
            application/vnd.microsoft.portable-executable
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$installer_name.sha256" "native/stable/$installer_name.sha256" text/plain
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$installer_name" native/stable/piqae-windows-x86_64-setup.exe \
            application/vnd.microsoft.portable-executable
          packaging/release/publish-s3-object.sh promote \
            "$prefix/$sbom_name" "native/stable/$sbom_name" application/spdx+json
          # The appcast is the commit point and is promoted only after its
          # Authenticode- and Ed25519-verified installer is available.
          packaging/release/publish-s3-object.sh promote \
            "$prefix/appcast-windows.xml" native/stable/appcast-windows.xml application/xml

      - name: Merge and promote stable release manifest
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIQAE_RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIQAE_RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PIQAE_RELEASES_S3_ENDPOINT: ${{ secrets.PIQAE_RELEASES_S3_ENDPOINT }}
          PIQAE_RELEASES_S3_BUCKET: ${{ secrets.PIQAE_RELEASES_S3_BUCKET }}
          PIQAE_RELEASES_S3_REGION: ${{ secrets.PIQAE_RELEASES_S3_REGION }}
        run: |
          if packaging/release/publish-s3-object.sh fetch \
            native/stable/manifest.json promotion/current-manifest.json
          then
            jq -e \
              '.schemaVersion == 1
               and (.artifacts | type == "array")
               and all(.artifacts[];
                 .status != "supported"
                 and .signing.status == "verified"
                 and (.sha256 | test("^[a-f0-9]{64}$"))
                 and (.downloadUrl | startswith("https://downloads.piqae.com/releases/stable/")))' \
              promotion/current-manifest.json >/dev/null
          else
            code=$?
            if [[ "$code" -ne 3 ]]; then
              exit "$code"
            fi
            jq -n \
              --arg repository_url "https://github.com/$CANONICAL_REPOSITORY" \
              '{
              schemaVersion: 1,
              channel: "stable",
              currentVersion: "0.0.0",
              updatedAt: null,
              artifacts: [],
              olderReleases: [],
              releasesUrl: "https://piqae.com/downloads",
              repositoryUrl: $repository_url
            }' > promotion/current-manifest.json
          fi
          jq \
            --slurpfile platform promotion/windows.json \
            --arg repository_url "https://github.com/$CANONICAL_REPOSITORY" \
            --arg version "$RELEASE_VERSION" \
            --arg now "$(jq -r '.publishedAt' promotion/windows.json)" \
            '.channel = "stable"
             | .currentVersion = $version
             | .updatedAt = $now
             | .repositoryUrl = $repository_url
             | .artifacts = ([.artifacts[] | select(.id != $platform[0].artifact.id)] + [$platform[0].artifact])' \
            promotion/current-manifest.json > promotion/manifest.json
          jq -e \
            '.schemaVersion == 1
             and .channel == "stable"
             and all(.artifacts[];
               .status != "supported"
               and .signing.status == "verified"
               and (.sha256 | test("^[a-f0-9]{64}$"))
               and (.downloadUrl | startswith("https://downloads.piqae.com/releases/stable/")))' \
            promotion/manifest.json >/dev/null
          manifest_sha=$(sha256sum promotion/manifest.json | awk '{print $1}')
          printf '%s  manifest.json\n' "$manifest_sha" > promotion/manifest.json.sha256
          immutable_manifest="native/releases/$RELEASE_VERSION/windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/manifest.json"
          immutable_checksum="$immutable_manifest.sha256"
          packaging/release/publish-s3-object.sh immutable \
            promotion/manifest.json "$immutable_manifest" application/json
          packaging/release/publish-s3-object.sh immutable \
            promotion/manifest.json.sha256 "$immutable_checksum" text/plain
          packaging/release/publish-s3-object.sh promote \
            "$immutable_checksum" native/stable/manifest.json.sha256 text/plain
          # The shared manifest is the final stable-channel commit point.
          packaging/release/publish-s3-object.sh promote \
            "$immutable_manifest" native/stable/manifest.json application/json

      - name: Verify public Windows update feed and manifest
        shell: bash
        run: |
          appcast=$(mktemp)
          curl --fail --location --silent --show-error --max-time 30 \
            https://downloads.piqae.com/releases/stable/appcast-windows.xml \
            --output "$appcast"
          enclosure=$(xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="enclosure"]/@url)' \
            "$appcast")
          expected="https://downloads.piqae.com/releases/stable/piqae-windows-${RELEASE_VERSION}-x86_64-setup.exe"
          if [[ "$enclosure" != "$expected" ]]; then
            echo "The public Windows appcast does not reference the promoted installer." >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --max-time 30 \
            --range 0-0 "$enclosure" --output /dev/null
          curl --fail --location --silent --show-error --max-time 30 \
            https://downloads.piqae.com/releases/stable/manifest.json \
            | jq -e \
              --arg version "$RELEASE_VERSION" \
              --arg download "$expected" \
              '.currentVersion == $version
               and any(.artifacts[];
                 .id == "windows-x86_64"
                 and .version == $version
                 and .downloadUrl == $download)' \
              >/dev/null
