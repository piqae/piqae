name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI scope
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      dependency_policy: ${{ steps.scope.outputs.dependency_policy }}
      macos_packaging: ${{ steps.scope.outputs.macos_packaging }}
      macos_rust: ${{ steps.scope.outputs.macos_rust }}
      macos_shell: ${{ steps.scope.outputs.macos_shell }}
      openapi: ${{ steps.scope.outputs.openapi }}
      release_tooling: ${{ steps.scope.outputs.release_tooling }}
      rust_server: ${{ steps.scope.outputs.rust_server }}
      rust_shared: ${{ steps.scope.outputs.rust_shared }}
      sdk: ${{ steps.scope.outputs.sdk }}
      terraform: ${{ steps.scope.outputs.terraform }}
      web: ${{ steps.scope.outputs.web }}
      windows_installer: ${{ steps.scope.outputs.windows_installer }}
      windows_rust: ${{ steps.scope.outputs.windows_rust }}
      windows_shell: ${{ steps.scope.outputs.windows_shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == schedule ]]; then
            python3 release/tools/ci_changed_paths.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null
          then
            git ls-tree -r --name-only -z "$HEAD_SHA" |
              python3 release/tools/ci_changed_paths.py --nul >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
              python3 release/tools/ci_changed_paths.py --nul >> "$GITHUB_OUTPUT"
          fi

  rust-linux:
    name: Rust (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust_server == 'true' || needs.changes.outputs.rust_shared == 'true'
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install CUPS development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcups2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy -p piqae-control-plane --all-targets --features otlp --locked -- -D warnings
      - run: cargo test -p piqae-control-plane --features otlp --locked

  rust-macos:
    name: Rust (macos-latest)
    needs: changes
    if: needs.changes.outputs.macos_rust == 'true'
    runs-on: ${{ vars.PIQAE_CI_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check macOS node packages
        run: >-
          cargo clippy --locked --all-targets
          -p piqae-agent
          -p piqae-executor-cups
          -- -D warnings
      - name: Test macOS node packages
        run: cargo test --locked -p piqae-agent -p piqae-executor-cups

  macos-shell:
    name: macOS menu shell
    needs: changes
    if: needs.changes.outputs.macos_shell == 'true'
    runs-on: ${{ vars.PIQAE_CI_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: shells/macos/.build
          key: swiftpm-macos-${{ hashFiles('shells/macos/Package.resolved', 'shells/macos/Package.swift') }}
      - run: swift test --package-path shells/macos

  rust-windows:
    name: Rust (windows-latest)
    needs: changes
    if: needs.changes.outputs.windows_rust == 'true' || needs.changes.outputs.windows_installer == 'true'
    runs-on: ${{ vars.PIQAE_CI_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Windows node packages
        run: >-
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-windows
          -p piqae-shell-windows
          -- -D warnings
      - name: Test Windows node packages
        run: >-
          cargo test --locked --target x86_64-pc-windows-msvc
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-windows
          -p piqae-shell-windows
      - name: Build Windows binaries
        if: needs.changes.outputs.windows_installer == 'true'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          cargo build --locked --release --target x86_64-pc-windows-msvc --bins
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-windows
          -p piqae-shell-windows
      - name: Stage installer input
        if: needs.changes.outputs.windows_installer == 'true'
        shell: pwsh
        run: |
          $source = "target\x86_64-pc-windows-msvc\release"
          $stage = "artifacts\piqae-windows-x86_64"
          New-Item -ItemType Directory -Force "$stage\service", "$stage\LICENSES" | Out-Null
          Copy-Item "$source\piqae-agent.exe", "$source\piqaectl.exe", "$source\piqae-executor-windows.exe", "$source\piqae-profile-host-windows.exe", "$source\piqae-shell-windows.exe" $stage
          Copy-Item "packaging\windows\*" "$stage\service" -Recurse
          Copy-Item "LICENSE", "NOTICE", "README.md" $stage
          Copy-Item "LICENSES\*" "$stage\LICENSES" -Recurse
          & "packaging/windows/Fetch-Pdfium.ps1" -DestinationDirectory $stage
      - name: Install Inno Setup
        if: needs.changes.outputs.windows_installer == 'true'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile development installer
        if: needs.changes.outputs.windows_installer == 'true'
        shell: pwsh
        run: |
          $source = (Resolve-Path "artifacts\piqae-windows-x86_64").Path
          $output = (Resolve-Path "artifacts").Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DSourceDir=$source" "/DOutputDir=$output" "/DAppVersion=0.1.1-ci.$env:GITHUB_RUN_NUMBER" "packaging\windows\Piqae.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "artifacts\piqae-windows-x86_64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($installer))" |
            Out-File -Encoding ascii "$installer.sha256"
      - name: Upload short-lived development installer
        if: needs.changes.outputs.windows_installer == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piqae-windows-installer
          path: artifacts/piqae-windows-x86_64-setup.exe*
          if-no-files-found: error
          retention-days: 3

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @piqae/web check
      - run: pnpm --filter @piqae/web test
      - name: Build the Node web artifact
        run: pnpm --filter @piqae/web build
      - name: Validate Piqae edge routing
        run: |
          node --test deploy/cloudflare/domain-router/router.test.mjs
          pnpm dlx wrangler@4.115.0 deploy --dry-run \
            --config deploy/cloudflare/domain-router/wrangler.jsonc

  sdk:
    name: SDK
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @piqae/sdk generate:check
      - run: pnpm --filter @piqae/sdk check
      - run: pnpm --filter @piqae/sdk test
      - name: Build and lint the SDK package
        run: |
          pnpm --filter @piqae/sdk build
          pnpm --filter @piqae/sdk lint
      - name: Install the packed SDK in a clean consumer
        run: pnpm --filter @piqae/sdk smoke:package

  web-sdk-compatibility:
    name: Web and SDK
    needs: [changes, sdk, web]
    if: always()
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Preserve the existing required-check contract
        env:
          SDK_REQUIRED: ${{ needs.changes.outputs.sdk }}
          SDK_RESULT: ${{ needs.sdk.result }}
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          if [[ "$SDK_REQUIRED" == true && "$SDK_RESULT" != success ]]; then
            echo "SDK validation did not succeed." >&2
            exit 1
          fi
          if [[ "$WEB_REQUIRED" == true && "$WEB_RESULT" != success ]]; then
            echo "Web validation did not succeed." >&2
            exit 1
          fi

  supply-chain:
    name: Supply chain
    needs: changes
    if: needs.changes.outputs.dependency_policy == 'true'
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check --allow warnings --hide-inclusion-graph

  openapi:
    name: API contract
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm --package=@redocly/cli@1.34.3 dlx redocly lint contracts/openapi/piqae-v1.yaml

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  macos-shell-compatibility:
    name: macOS menu shell
    needs: [changes, rust-macos, macos-shell]
    if: always()
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Preserve the existing required-check contract
        env:
          RUST_REQUIRED: ${{ needs.changes.outputs.macos_rust }}
          RUST_RESULT: ${{ needs.rust-macos.result }}
          SHELL_REQUIRED: ${{ needs.changes.outputs.macos_shell }}
          SHELL_RESULT: ${{ needs.macos-shell.result }}
        run: |
          [[ "$RUST_REQUIRED" != true || "$RUST_RESULT" == success ]]
          [[ "$SHELL_REQUIRED" != true || "$SHELL_RESULT" == success ]]

  windows-installer-compatibility:
    name: Windows development installer
    needs: [changes, rust-windows]
    if: always()
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Preserve the existing required-check contract
        env:
          REQUIRED: ${{ needs.changes.outputs.windows_rust }}
          INSTALLER_REQUIRED: ${{ needs.changes.outputs.windows_installer }}
          RESULT: ${{ needs.rust-windows.result }}
        run: |
          if [[ ("$REQUIRED" == true || "$INSTALLER_REQUIRED" == true) && "$RESULT" != success ]]; then
            echo "Combined Windows Rust and installer validation did not succeed." >&2
            exit 1
          fi

  result:
    name: CI result
    needs:
      - changes
      - macos-shell-compatibility
      - macos-shell
      - openapi
      - rust-linux
      - rust-macos
      - rust-windows
      - sdk
      - supply-chain
      - terraform
      - web
      - web-sdk-compatibility
      - windows-installer-compatibility
    if: always()
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every selected job to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          MACOS_COMPATIBILITY: ${{ needs.macos-shell-compatibility.result }}
          OPENAPI: ${{ needs.openapi.result }}
          RUST_LINUX: ${{ needs.rust-linux.result }}
          RUST_MACOS: ${{ needs.rust-macos.result }}
          RUST_WINDOWS: ${{ needs.rust-windows.result }}
          SDK: ${{ needs.sdk.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          TERRAFORM: ${{ needs.terraform.result }}
          WEB: ${{ needs.web.result }}
          WEB_SDK_COMPATIBILITY: ${{ needs.web-sdk-compatibility.result }}
          WINDOWS_COMPATIBILITY: ${{ needs.windows-installer-compatibility.result }}
        run: |
          for result in \
            "$CHANGES" \
            "$MACOS_COMPATIBILITY" \
            "$OPENAPI" \
            "$RUST_LINUX" \
            "$RUST_MACOS" \
            "$RUST_WINDOWS" \
            "$SDK" \
            "$SUPPLY_CHAIN" \
            "$TERRAFORM" \
            "$WEB" \
            "$WEB_SDK_COMPATIBILITY" \
            "$WINDOWS_COMPATIBILITY"
          do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "A selected CI job ended with '$result'." >&2
              exit 1
            fi
          done
