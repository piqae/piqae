name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI scope
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      macos_packaging: ${{ steps.scope.outputs.macos_packaging }}
      macos_rust: ${{ steps.scope.outputs.macos_rust }}
      macos_shell: ${{ steps.scope.outputs.macos_shell }}
      openapi: ${{ steps.scope.outputs.openapi }}
      release_tooling: ${{ steps.scope.outputs.release_tooling }}
      rust_server: ${{ steps.scope.outputs.rust_server }}
      rust_shared: ${{ steps.scope.outputs.rust_shared }}
      mcp: ${{ steps.scope.outputs.mcp }}
      sdk: ${{ steps.scope.outputs.sdk }}
      shopify: ${{ steps.scope.outputs.shopify }}
      terraform: ${{ steps.scope.outputs.terraform }}
      web: ${{ steps.scope.outputs.web }}
      windows_installer: ${{ steps.scope.outputs.windows_installer }}
      windows_rust: ${{ steps.scope.outputs.windows_rust }}
      windows_shell: ${{ steps.scope.outputs.windows_shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == schedule ]]; then
            python3 release/tools/ci_changed_paths.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null
          then
            git ls-tree -r --name-only -z "$HEAD_SHA" |
              python3 release/tools/ci_changed_paths.py --nul >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
              python3 release/tools/ci_changed_paths.py --nul >> "$GITHUB_OUTPUT"
          fi

  rust-linux:
    name: Rust (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust_server == 'true' || needs.changes.outputs.rust_shared == 'true'
    # The Rust jobs are compile-bound and dominate wall-clock, while the Node
    # jobs on PIQAE_CI_LINUX_RUNNER are install-bound. Giving the Rust jobs
    # their own variable lets cores be bought where they convert into time.
    runs-on: ${{ vars.PIQAE_CI_RUST_RUNNER || vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install CUPS development libraries
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          . /etc/os-release
          printf 'deb https://archive.ubuntu.com/ubuntu %s main universe\ndeb https://archive.ubuntu.com/ubuntu %s-updates main universe\ndeb https://security.ubuntu.com/ubuntu %s-security main universe\n' \
            "$VERSION_CODENAME" "$VERSION_CODENAME" "$VERSION_CODENAME" \
            | sudo tee /etc/apt/piqae-ci.list >/dev/null
          sudo apt-get \
            -o Dir::Etc::sourcelist=/etc/apt/piqae-ci.list \
            -o Dir::Etc::sourceparts=- \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo apt-get \
            -o Dir::Etc::sourcelist=/etc/apt/piqae-ci.list \
            -o Dir::Etc::sourceparts=- \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=60 \
            --yes \
            --no-install-recommends \
            install libcups2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The otlp feature changes the resolved feature set, so cargo rebuilds the
  # control plane and its dependency tree from scratch for it. Serialising that
  # behind the default build added about 63s to a 226s job for no extra
  # coverage; running it beside the default build keeps every command and flag
  # identical and returns that time. It stays required by `CI result`.
  rust-linux-otlp:
    name: Rust (ubuntu-latest, otlp)
    needs: changes
    if: needs.changes.outputs.rust_server == 'true' || needs.changes.outputs.rust_shared == 'true'
    runs-on: ${{ vars.PIQAE_CI_RUST_RUNNER || vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          # A distinct key: sharing one with the default build would make each
          # job evict the other's artifacts on every run.
          shared-key: ci-linux-otlp
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p piqae-control-plane --all-targets --features otlp --locked -- -D warnings
      - run: cargo test -p piqae-control-plane --features otlp --locked
      - run: cargo clippy -p piqae-control-plane --all-targets --features sentry --locked -- -D warnings
      - run: cargo test -p piqae-control-plane --features sentry --locked
      - run: cargo clippy -p piqae-control-plane --all-targets --features otlp,sentry --locked -- -D warnings

  # Every database-backed suite answers "skipped" and reports a pass when
  # PIQAE_TEST_DATABASE_URL is unset, so CI ran none of them: schema upgrades,
  # the WorkOS identity projection, cloud billing, cross-node reroute fencing,
  # and platform-account HTTP authorization were only ever exercised by a
  # release check on a contributor's machine. Run them here against a real
  # database, through the wrapper that fails closed on a skip.
  rust-postgres:
    name: Rust (PostgreSQL evidence)
    needs: changes
    if: needs.changes.outputs.rust_server == 'true' || needs.changes.outputs.rust_shared == 'true'
    runs-on: ${{ vars.PIQAE_CI_RUST_RUNNER || vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: piqae_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d piqae_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PIQAE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/piqae_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci-linux-postgres
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Require every database boundary to produce evidence
        run: python3 release/tools/check_postgres_release_tests.py

  rust-macos:
    name: Rust (macos-latest)
    needs: changes
    if: needs.changes.outputs.macos_rust == 'true'
    runs-on: ${{ vars.PIQAE_CI_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check macOS node packages
        run: >-
          cargo clippy --locked --all-targets
          -p piqae-agent
          -p piqae-executor-cups
          -- -D warnings
      - name: Test macOS node packages
        run: cargo test --locked -p piqae-agent -p piqae-executor-cups

  macos-shell:
    name: macOS menu shell
    needs: changes
    if: needs.changes.outputs.macos_shell == 'true'
    runs-on: ${{ vars.PIQAE_CI_MACOS_RUNNER || 'macos-latest' }}
    # A cold exact linked-runtime build takes about 12 minutes before SDK,
    # Xcode project, and Simulator validation. Keep every gate in one job so
    # they consume the same XCFramework, with bounded headroom for cold hosts.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            shells/macos/.build
            sdk/apple/.build
            .piqae-test-fixtures/apple-sdk-derived-data
            .piqae-test-fixtures/apple-node-app-derived-data
          key: swiftpm-macos-${{ hashFiles('shells/macos/Package.resolved', 'shells/macos/Package.swift', 'sdk/apple/Package.resolved', 'sdk/apple/Package.swift') }}
      - name: Test macOS menu shell
        run: swift test --package-path shells/macos
      - name: Test and build Apple node SDK
        run: release/tools/test_apple_node_sdk.sh
      - name: Build the linked Apple node runtime once for SDK and app validation
        run: sdk/apple/scripts/build-xcframework.sh --replace
      - name: Validate the linked Apple node runtime
        run: release/tools/test_apple_node_sdk_linked.sh use-existing
      - name: Install deterministic Apple project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Validate generated project and linked standalone app in Simulator
        run: release/tools/test_apple_node_app.sh

  rust-windows:
    name: Rust (windows-latest)
    needs: changes
    if: needs.changes.outputs.windows_rust == 'true' || needs.changes.outputs.windows_installer == 'true'
    runs-on: ${{ vars.PIQAE_CI_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5
        with:
          dotnet-version: 8.0.x
      - name: Check Windows node packages
        run: >-
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-windows
          -p piqae-shell-windows
          -p piqae-local-ipc
          -p piqae-node-host-api
          -p piqae-node-runtime
          -p piqae-node-client
          -p piqae-node-ffi
          -- -D warnings
      - name: Test Windows node packages
        run: >-
          cargo test --locked --target x86_64-pc-windows-msvc
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-windows
          -p piqae-shell-windows
          -p piqae-local-ipc
          -p piqae-node-host-api
          -p piqae-node-runtime
          -p piqae-node-client
          -p piqae-node-ffi
      - name: Validate and package native node SDKs
        shell: pwsh
        run: ./release/tools/test_windows_node_sdk.ps1
      - name: Build Windows binaries
        if: needs.changes.outputs.windows_installer == 'true'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          cargo build --locked --release --target x86_64-pc-windows-msvc --bins
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-windows
          -p piqae-shell-windows
      - name: Stage installer input
        if: needs.changes.outputs.windows_installer == 'true'
        shell: pwsh
        run: |
          $source = "target\x86_64-pc-windows-msvc\release"
          $stage = "artifacts\piqae-windows-x86_64"
          New-Item -ItemType Directory -Force "$stage\service", "$stage\LICENSES" | Out-Null
          Copy-Item "$source\piqae-agent.exe", "$source\piqaectl.exe", "$source\piqae-executor-windows.exe", "$source\piqae-profile-host-windows.exe", "$source\piqae-shell-windows.exe" $stage
          Copy-Item "packaging\windows\*" "$stage\service" -Recurse
          Copy-Item "LICENSE", "NOTICE", "README.md" $stage
          Copy-Item "LICENSES\*" "$stage\LICENSES" -Recurse
          & "packaging/windows/Fetch-Pdfium.ps1" -DestinationDirectory $stage
      - name: Install Inno Setup
        if: needs.changes.outputs.windows_installer == 'true'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile development installer
        if: needs.changes.outputs.windows_installer == 'true'
        shell: pwsh
        run: |
          $source = (Resolve-Path "artifacts\piqae-windows-x86_64").Path
          $output = (Resolve-Path "artifacts").Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DSourceDir=$source" "/DOutputDir=$output" "/DAppVersion=0.1.1-ci.$env:GITHUB_RUN_NUMBER" "packaging\windows\Piqae.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "artifacts\piqae-windows-x86_64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($installer))" |
            Out-File -Encoding ascii "$installer.sha256"
      - name: Upload short-lived development installer
        if: needs.changes.outputs.windows_installer == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piqae-windows-installer
          path: artifacts/piqae-windows-x86_64-setup.exe*
          if-no-files-found: error
          retention-days: 3

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @piqae/web check
      - run: pnpm --filter @piqae/web test
      - name: Build the Node web artifact
        run: pnpm --filter @piqae/web build
      - name: Validate Piqae edge routing
        run: |
          node --test deploy/cloudflare/domain-router/router.test.mjs
          pnpm dlx wrangler@4.115.0 deploy --dry-run \
            --config deploy/cloudflare/domain-router/wrangler.jsonc

  sdk:
    name: SDK
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @piqae/sdk generate:check
      - run: pnpm --filter @piqae/sdk check
      - run: pnpm --filter @piqae/sdk test
      - name: Validate the neutral PrintPacket package
        run: |
          pnpm --filter @printpacket/core generate:check
          pnpm --filter @printpacket/core check
          pnpm --filter @printpacket/core test
          pnpm --filter @printpacket/core build
          pnpm --filter @printpacket/core lint
          pnpm --filter @printpacket/core smoke:package
      - name: Build and lint the SDK package
        run: |
          pnpm --filter @piqae/sdk build
          pnpm --filter @piqae/sdk lint
      - name: Install the packed SDK in a clean consumer
        run: pnpm --filter @piqae/sdk smoke:package

  mcp:
    name: MCP
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build the workspace SDK dependency
        run: pnpm --filter @piqae/sdk build
      - name: Validate the MCP package
        run: |
          pnpm --filter @piqae/mcp-server check
          pnpm --filter @piqae/mcp-server test
          pnpm --filter @piqae/mcp-server format:check
          pnpm --filter @piqae/mcp-server smoke:package

  shopify:
    name: Shopify
    needs: changes
    if: needs.changes.outputs.shopify == 'true'
    runs-on: ${{ vars.PIQAE_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: piqae_shopify_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d piqae_shopify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PIQAE_REQUIRE_POSTGRES_TESTS: "1"
      PIQAE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/piqae_shopify_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build the workspace SDK dependency
        run: pnpm --filter @piqae/sdk build
      - run: pnpm --filter @piqae/shopify-app check
      - run: pnpm --filter @piqae/shopify-app test
      - run: pnpm --filter @piqae/shopify-app test:postgres
      - run: pnpm --filter @piqae/shopify-app format:check
      - name: Verify clean Shopify production image dependencies
        run: docker build --target shopify-production-build --file deploy/docker/Dockerfile.shopify .
      - name: Verify fail-closed release configuration rendering
        working-directory: apps/shopify
        env:
          SHOPIFY_CLIENT_ID: ci-client-id
          SHOPIFY_APP_URL: https://shopify-ci.example.com
        run: |
          pnpm release:config
          ! grep -Eq 'example\.invalid|development-client-id' shopify.app.release.toml
          grep -F 'https://shopify-ci.example.com/auth/callback' shopify.app.release.toml
      - run: pnpm --filter @piqae/shopify-app build

  openapi:
    name: API contract
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm --package=@redocly/cli@1.34.3 dlx redocly lint contracts/openapi/piqae-v1.yaml

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  result:
    name: CI result
    needs:
      - changes
      - macos-shell
      - mcp
      - openapi
      - rust-linux
      - rust-linux-otlp
      - rust-macos
      - rust-postgres
      - rust-windows
      - sdk
      - shopify
      - terraform
      - web
    if: always()
    runs-on: ${{ vars.PIQAE_CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every selected job to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          MACOS_SHELL: ${{ needs.macos-shell.result }}
          MCP: ${{ needs.mcp.result }}
          OPENAPI: ${{ needs.openapi.result }}
          RUST_LINUX: ${{ needs.rust-linux.result }}
          RUST_LINUX_OTLP: ${{ needs.rust-linux-otlp.result }}
          RUST_MACOS: ${{ needs.rust-macos.result }}
          RUST_POSTGRES: ${{ needs.rust-postgres.result }}
          RUST_WINDOWS: ${{ needs.rust-windows.result }}
          SDK: ${{ needs.sdk.result }}
          SHOPIFY: ${{ needs.shopify.result }}
          TERRAFORM: ${{ needs.terraform.result }}
          WEB: ${{ needs.web.result }}
        run: |
          for result in \
            "$CHANGES" \
            "$MACOS_SHELL" \
            "$MCP" \
            "$OPENAPI" \
            "$RUST_LINUX" \
            "$RUST_LINUX_OTLP" \
            "$RUST_MACOS" \
            "$RUST_POSTGRES" \
            "$RUST_WINDOWS" \
            "$SDK" \
            "$SHOPIFY" \
            "$TERRAFORM" \
            "$WEB"
          do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "A selected CI job ended with '$result'." >&2
              exit 1
            fi
          done
