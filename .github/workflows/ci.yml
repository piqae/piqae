name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install CUPS development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcups2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: runner.os == 'Linux'
        run: cargo clippy -p piqae-control-plane --all-targets --features otlp --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test -p piqae-control-plane --features otlp --locked

  web:
    name: Web and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Verify generated SDK types
        run: pnpm --filter @piqae/sdk generate:check
      - name: Build and lint the SDK package
        run: |
          pnpm --filter @piqae/sdk build
          pnpm --filter @piqae/sdk lint
      - name: Install the packed SDK in a clean consumer
        run: pnpm --filter @piqae/sdk smoke:package
      - name: Build the Node web artifact
        run: pnpm --filter @piqae/web build
      - name: Validate Piqae edge routing
        run: |
          node --test deploy/cloudflare/domain-router/router.test.mjs
          pnpm dlx wrangler@4.115.0 deploy --dry-run \
            --config deploy/cloudflare/domain-router/wrangler.jsonc

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check --allow warnings --hide-inclusion-graph

  openapi:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm --package=@redocly/cli@1.34.3 dlx redocly lint contracts/openapi/piqae-v1.yaml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  macos-shell:
    name: macOS menu shell
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift build --package-path shells/macos

  windows-installer:
    name: Windows development installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: windows-installer
      - name: Build Windows binaries
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          cargo build --locked --release --target x86_64-pc-windows-msvc --bins
          -p piqae-agent
          -p piqaectl
          -p piqae-executor-windows
          -p piqae-shell-windows
      - name: Stage installer input
        shell: pwsh
        run: |
          $source = "target\x86_64-pc-windows-msvc\release"
          $stage = "artifacts\piqae-windows-x86_64"
          New-Item -ItemType Directory -Force "$stage\service", "$stage\LICENSES" | Out-Null
          Copy-Item "$source\piqae-agent.exe", "$source\piqaectl.exe", "$source\piqae-executor-windows.exe", "$source\piqae-profile-host-windows.exe", "$source\piqae-shell-windows.exe" $stage
          Copy-Item "packaging\windows\*" "$stage\service" -Recurse
          Copy-Item "LICENSE", "README.md" $stage
          Copy-Item "LICENSES\*" "$stage\LICENSES" -Recurse
          & "packaging/windows/Fetch-Pdfium.ps1" -DestinationDirectory $stage
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $source = (Resolve-Path "artifacts\piqae-windows-x86_64").Path
          $output = (Resolve-Path "artifacts").Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DSourceDir=$source" "/DOutputDir=$output" "/DAppVersion=0.1.0-ci.$env:GITHUB_RUN_NUMBER" "packaging\windows\Piqae.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "artifacts\piqae-windows-x86_64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($installer))" |
            Out-File -Encoding ascii "$installer.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piqae-windows-installer
          path: artifacts/piqae-windows-x86_64-setup.exe*
          if-no-files-found: error
