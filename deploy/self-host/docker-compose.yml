name: spool

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spool
      POSTGRES_USER: spool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spool -d spool"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spool}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/spool
        mc anonymous set none local/spool
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spool}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  server:
    image: ${SPOOL_IMAGE:-ghcr.io/c4coffeeco/spool/server:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${SPOOL_PORT:-8080}:8080"
    environment:
      SPOOL_ENVIRONMENT: production
      SPOOL_BIND: 0.0.0.0:8080
      SPOOL_DATABASE_URL: postgres://spool:${POSTGRES_PASSWORD}@postgres:5432/spool
      SPOOL_OBJECT_STORE: s3
      SPOOL_S3_ENDPOINT: http://minio:9000
      SPOOL_S3_BUCKET: spool
      SPOOL_S3_REGION: us-east-1
      SPOOL_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-spool}
      SPOOL_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SPOOL_S3_ALLOW_HTTP: "true"
      SPOOL_WEBHOOK_MASTER_KEY: ${SPOOL_WEBHOOK_MASTER_KEY:?set SPOOL_WEBHOOK_MASTER_KEY}
      SPOOL_BOOTSTRAP_API_KEY: ${SPOOL_BOOTSTRAP_API_KEY:-}
      SPOOL_PUBLIC_API_ORIGIN: ${SPOOL_PUBLIC_API_ORIGIN:?set SPOOL_PUBLIC_API_ORIGIN}
      SPOOL_AUTH_MODE: ${SPOOL_AUTH_MODE:-bootstrap}
      SPOOL_OIDC_ISSUER: ${SPOOL_OIDC_ISSUER:-}
      SPOOL_OIDC_CLIENT_ID: ${SPOOL_OIDC_CLIENT_ID:-}
      SPOOL_OIDC_CLIENT_SECRET: ${SPOOL_OIDC_CLIENT_SECRET:-}
      SPOOL_COOKIE_KEY: ${SPOOL_COOKIE_KEY:?set SPOOL_COOKIE_KEY}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    healthcheck:
      test: ["CMD", "/usr/local/bin/spool-server", "healthcheck", "--url", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    profiles: ["dashboard"]
    image: ${SPOOL_WEB_IMAGE:-ghcr.io/c4coffeeco/spool/web:latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${SPOOL_WEB_PORT:-3000}:3000"
    environment:
      ORIGIN: ${SPOOL_DASHBOARD_ORIGIN:?set SPOOL_DASHBOARD_ORIGIN}
      SPOOL_AUTH_MODE: ${SPOOL_WEB_AUTH_MODE:-workos}
      PUBLIC_SPOOL_DASHBOARD_MODE: live
      PUBLIC_SPOOL_API_URL: http://server:8080
      SPOOL_DASHBOARD_API_KEY: ${SPOOL_BOOTSTRAP_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_REDIRECT_URI: ${SPOOL_DASHBOARD_ORIGIN}/auth/callback
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  object-data:
