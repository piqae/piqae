{{- if and .Values.gateway.enabled .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ default (include "spool.fullname" .) .Values.gateway.name }}
  labels:
    {{- include "spool.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.gateway.annotations | nindent 4 }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.create=true" .Values.gateway.className }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
---
{{- end }}
{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "spool.fullname" . }}
  labels:
    {{- include "spool.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.name is required unless fullname is intended" (default (include "spool.fullname" .) .Values.gateway.name) }}
      {{- with .Values.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "spool.fullname" . }}-api
          port: 8080
{{- end }}
