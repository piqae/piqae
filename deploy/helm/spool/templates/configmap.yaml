apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spool.fullname" . }}-config
  labels:
    {{- include "spool.labels" . | nindent 4 }}
data:
  SPOOL_ENVIRONMENT: {{ .Values.config.environment | quote }}
  SPOOL_BIND: "0.0.0.0:8080"
  SPOOL_AUTH_MODE: {{ .Values.config.authMode | quote }}
  SPOOL_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  SPOOL_OIDC_JWKS_URL: {{ .Values.config.oidcJwksUrl | quote }}
  SPOOL_OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  SPOOL_OIDC_BINDING_CLAIM: {{ .Values.config.oidcBindingClaim | quote }}
  SPOOL_OIDC_BINDING_VALUE: {{ .Values.config.oidcBindingValue | quote }}
  SPOOL_OIDC_ORGANIZATION_CLAIM: {{ .Values.config.oidcOrganizationClaim | quote }}
  SPOOL_OIDC_PERMISSIONS_CLAIM: {{ .Values.config.oidcPermissionsClaim | quote }}
  SPOOL_OIDC_ALLOW_UNRESTRICTED: "false"
  SPOOL_OBJECT_STORE: "s3"
  SPOOL_S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  SPOOL_S3_BUCKET: {{ required "config.s3Bucket is required" .Values.config.s3Bucket | quote }}
  SPOOL_S3_REGION: {{ .Values.config.s3Region | quote }}
  SPOOL_S3_ALLOW_HTTP: {{ .Values.config.s3AllowHttp | quote }}
  SPOOL_S3_VIRTUAL_HOSTED_STYLE: {{ .Values.config.s3VirtualHostedStyle | quote }}
  RUST_LOG: {{ .Values.config.rustLog | quote }}
