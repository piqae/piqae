{{- $root := . -}}
{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "piqae.fullname" $root }}-{{ $name }}
  labels:
    {{- include "piqae.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "piqae.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "piqae.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- with $root.Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- with $root.Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "piqae.serviceAccountName" $root }}
      automountServiceAccountToken: {{ $root.Values.serviceAccount.automountServiceAccountToken }}
      securityContext: {{ toYaml $root.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: piqae
          image: {{ include "piqae.image" (dict "image" $root.Values.image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext: {{ toYaml $root.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: {{ include "piqae.fullname" $root }}-config }
          env:
            - name: PIQAE_SERVICE_ROLE
              value: {{ $name | quote }}
            - name: PIQAE_RUN_MIGRATIONS_ON_STARTUP
              value: "false"
            - name: PIQAE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "piqae.secretName" $root }}, key: {{ $root.Values.secrets.keys.databaseUrl }} } }
            - name: PIQAE_WEBHOOK_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "piqae.secretName" $root }}, key: {{ $root.Values.secrets.keys.webhookMasterKey }} } }
            - name: PIQAE_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ include "piqae.secretName" $root }}, key: {{ $root.Values.secrets.keys.s3AccessKeyId }} } }
            - name: PIQAE_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "piqae.secretName" $root }}, key: {{ $root.Values.secrets.keys.s3SecretAccessKey }} } }
            {{- with $root.Values.config.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe:
            httpGet: { path: /v1/health, port: http }
            failureThreshold: {{ $root.Values.probes.startup.failureThreshold }}
            periodSeconds: {{ $root.Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: {{ $root.Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ $root.Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: { path: /v1/ready, port: http }
            periodSeconds: {{ $root.Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ $root.Values.probes.readiness.failureThreshold }}
          resources: {{ toYaml $component.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
      {{- if $root.Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        {{- range $root.Values.topologySpreadConstraints.topologyKeys }}
        - maxSkew: 1
          topologyKey: {{ . }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "piqae.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: {{ $name }}
        {{- end }}
      {{- end }}
      {{- if eq $root.Values.affinity.podAntiAffinity "preferred" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "piqae.selectorLabels" $root | nindent 20 }}
                    app.kubernetes.io/component: {{ $name }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}nodeSelector: {{ toYaml . | nindent 8 }}{{- end }}
      {{- with $root.Values.tolerations }}tolerations: {{ toYaml . | nindent 8 }}{{- end }}
{{- end }}
{{- end }}
