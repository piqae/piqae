{{- $root := . -}}
{{- range $name, $component := .Values.components }}
{{- if and $component.enabled $component.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "piqae.fullname" $root }}-{{ $name }}
  labels:
    {{- include "piqae.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    {{- include "piqae.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - { name: http, port: {{ $component.service.port }}, targetPort: http, protocol: TCP }
{{- end }}
{{- end }}
