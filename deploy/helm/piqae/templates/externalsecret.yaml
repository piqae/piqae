{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "piqae.fullname" . }}-runtime
  labels:
    {{- include "piqae.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "piqae.fullname" . }}-runtime
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.keys.databaseUrl }}
      remoteRef: { key: {{ required "externalSecret.remoteKeys.databaseUrl is required" .Values.externalSecret.remoteKeys.databaseUrl | quote }} }
    - secretKey: {{ .Values.secrets.keys.webhookMasterKey }}
      remoteRef: { key: {{ required "externalSecret.remoteKeys.webhookMasterKey is required" .Values.externalSecret.remoteKeys.webhookMasterKey | quote }} }
    - secretKey: {{ .Values.secrets.keys.s3AccessKeyId }}
      remoteRef: { key: {{ required "externalSecret.remoteKeys.s3AccessKeyId is required" .Values.externalSecret.remoteKeys.s3AccessKeyId | quote }} }
    - secretKey: {{ .Values.secrets.keys.s3SecretAccessKey }}
      remoteRef: { key: {{ required "externalSecret.remoteKeys.s3SecretAccessKey is required" .Values.externalSecret.remoteKeys.s3SecretAccessKey | quote }} }
{{- end }}
