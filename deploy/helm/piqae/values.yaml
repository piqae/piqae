nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/piqae/piqae/server
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

config:
  environment: production
  authMode: oidc
  oidcIssuer: https://api.workos.com/user_management/client_replace-me
  oidcJwksUrl: ""
  oidcAudience: ""
  oidcBindingClaim: client_id
  oidcBindingValue: ""
  oidcOrganizationClaim: org_id
  oidcPermissionsClaim: permissions
  s3Endpoint: ""
  s3Bucket: piqae
  s3Region: auto
  s3AllowHttp: false
  s3VirtualHostedStyle: false
  rustLog: info,sqlx=warn
  documentActiveKeyId: legacy-v1
  extraEnv: []

secrets:
  existingSecret: piqae-runtime
  keys:
    databaseUrl: PIQAE_DATABASE_URL
    webhookMasterKey: PIQAE_WEBHOOK_MASTER_KEY
    documentMasterKey: PIQAE_DOCUMENT_MASTER_KEY
    documentDecryptionKeys: PIQAE_DOCUMENT_DECRYPTION_KEYS
    s3AccessKeyId: PIQAE_S3_ACCESS_KEY_ID
    s3SecretAccessKey: PIQAE_S3_SECRET_ACCESS_KEY

externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1beta1
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  remoteKeys:
    databaseUrl: ""
    webhookMasterKey: ""
    s3AccessKeyId: ""
    s3SecretAccessKey: ""

# The current server safely combines HTTP, agent sync and leased background
# work. These pools provide independent scaling/failure domains now; role
# isolation can later be activated without changing routing or pod identities.
components:
  api:
    enabled: true
    replicas: 3
    service:
      enabled: true
      port: 8080
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      cpuUtilization: 65
      memoryUtilization: 75
  sync:
    enabled: true
    replicas: 2
    service:
      enabled: true
      port: 8080
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 20
      cpuUtilization: 60
      memoryUtilization: 75
  worker:
    enabled: true
    replicas: 2
    service:
      enabled: false
      port: 8080
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: "1", memory: 1Gi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      cpuUtilization: 70
      memoryUtilization: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
  runAsNonRoot: true

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  topologyKeys:
    - topology.kubernetes.io/zone
    - kubernetes.io/hostname
affinity:
  podAntiAffinity: preferred
nodeSelector: {}
tolerations: []

migration:
  enabled: true
  image:
    repository: ghcr.io/piqae/piqae/migrate
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

dashboard:
  enabled: false
  replicas: 2
  image:
    repository: ghcr.io/piqae/piqae/web
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  origin: ""
  authMode: workos
  existingSecret: piqae-dashboard
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 512Mi }

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

gateway:
  enabled: false
  create: false
  className: ""
  name: ""
  namespace: ""
  annotations: {}
  listeners: []
  hostnames: []

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  ingressPodSelector: {}
  egress:
    restricted: false
    dnsNamespaceSelector:
      kubernetes.io/metadata.name: kube-system
    databaseCIDRs: []
    databasePort: 5432
    objectStoreCIDRs: []
    objectStorePort: 443
    additionalRules: []

terminationGracePeriodSeconds: 45
