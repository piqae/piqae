version: 1
platforms:
  windows_10_11_x86_64:
    tier: disabled
    reason: physical PDF and RAW release gates have not run
  macos_13_plus_aarch64:
    tier: preview
    reason: v0.1.11 is Developer ID signed, Apple notarised and stapled with SBOM, checksum and repository-bound provenance; clean-install, update/rollback and physical printing gates remain open
  macos_15_x86_64:
    tier: preview
    reason: v0.1.11 is Developer ID signed, Apple notarised and stapled with SBOM, checksum and repository-bound provenance; clean-install, update/rollback and physical printing gates remain open
  ubuntu_22_04_24_04_x86_64:
    tier: preview
    reason: v0.1.11 x86_64 packaging, checksum, SBOM and provenance evidence exists; clean-install, upgrade/rollback and physical printing gates have not run
  debian_12_x86_64:
    tier: preview
    reason: v0.1.11 x86_64 packaging, checksum, SBOM and provenance evidence exists; clean-install, upgrade/rollback and physical printing gates have not run
  linux_aarch64:
    tier: preview
    reason: v0.1.11 aarch64 packaging, checksum, SBOM and provenance evidence exists; clean-install, upgrade/rollback and low-power hardware gates have not run
features:
  durable_job_registration:
    tier: preview
    reason: durable database and object-store paths are tested locally but have no production soak evidence
  offline_node_delivery:
    tier: preview
    reason: lease expiry and reconnect paths are tested, but long-running fleet evidence is incomplete
  primary_standby_target_routing:
    tier: preview
    reason: new jobs select a ready binding, but already-waiting jobs are not automatically reassigned
  automatic_waiting_job_reassignment:
    tier: preview
    reason: atomic pre-acceptance reassignment is implemented, but PostgreSQL fault injection and fleet duplicate-prevention soak evidence are incomplete
  compose_self_hosting:
    tier: preview
    reason: configuration renders locally but backup, restore, and upgrade drills are operator-owned
  kubernetes_self_hosting:
    tier: preview
    reason: Helm policy renders and validates locally but Kind disruption and rollback evidence is incomplete
  signed_automatic_node_updates:
    tier: disabled
    reason: signed coordinated app/node updates and component rollback are implemented, but destructive fault-injection and physical-printer certification remain release gates
  legacy_compatibility:
    tier: preview
    reason: only the documented compatibility subset is covered by fixtures
  platform_service_accounts:
    tier: disabled
    reason: cross-resource/concurrency isolation, operator attribution, selector rejection, and full redaction evidence are incomplete
  multi_integrator_node_runtime:
    tier: preview
    reason: isolated connector runtime and macOS consent flow are implemented, but Windows/Linux native consent, signed packages, fleet concurrency and revocation soak evidence are incomplete
  content_confidential_printing:
    tier: disabled
    reason: encrypted transport and local decryption are implemented for evaluation but lack independent cryptographic review, hardware-backed keys and physical release evidence
  macos_embedded_node_onboarding:
    tier: preview
    reason: Piqae-branded application-link consent and proof-of-possession are tested in source and included in signed/notarised v0.1.11 Preview packaging; clean-install, update/rollback and fleet evidence remain open
  windows_linux_embedded_node_onboarding:
    tier: disabled
    reason: only the shared headless stdin transaction exists; native application-link registration and local consent shells are not implemented
