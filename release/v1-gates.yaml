version: 1
product: spool
release: v1.0.0
required:
  - id: contracts
    command: cargo test -p spool-domain -p spool-protocol --locked
  - id: rust
    command: cargo test --workspace --locked
  - id: clippy
    command: cargo clippy --workspace --all-targets --locked -- -D warnings
  - id: web
    command: pnpm check && pnpm test && pnpm build
  - id: openapi
    command: pnpm --package=@redocly/cli@1.34.3 dlx redocly lint contracts/openapi/spool-v1.yaml
  - id: native_shell
    command: swift build --package-path shells/macos
manual:
  - id: compatibility
    evidence: PrintNode fixture suite and compatibility endpoint report
  - id: restart_recovery
    evidence: forced-restart and lease-expiry report
  - id: tenant_isolation
    evidence: database and HTTP cross-tenant isolation report
  - id: physical_windows
    evidence: Windows 10/11 PDF and RAW runs on every advertised driver class
  - id: code_signing
    evidence: Windows Authenticode and macOS notarisation verification
platforms:
  windows_x86_64:
    required: true
    default_tier: disabled
  macos_aarch64:
    required: false
    default_tier: preview
  macos_x86_64:
    required: false
    default_tier: preview
  linux_x86_64:
    required: false
    default_tier: preview
  linux_aarch64:
    required: false
    default_tier: preview
