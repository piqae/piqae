version: 1
product: piqae
release: v1.0.0
required:
  - id: contracts
    command: cargo test -p piqae-domain -p piqae-protocol --locked
  - id: rust
    command: cargo test --workspace --locked
  - id: clippy
    command: cargo clippy --workspace --all-targets --locked -- -D warnings
  - id: web
    command: pnpm check && pnpm test && pnpm build
  - id: openapi
    command: pnpm --package=@redocly/cli@1.34.3 dlx redocly lint contracts/openapi/piqae-v1.yaml
  - id: native_shell
    command: swift build --package-path shells/macos
  - id: release_policy
    command: ruby release/tools/check_release_policy.rb
  - id: release_evidence
    command: python3 -m unittest discover -s release/tools -p 'test_*.py' -v
  - id: deployment_rendering
    command: ./deploy/validate.sh
  - id: production_configuration
    command: python3 release/tools/check_production_readiness.py --mode structural
  - id: streaming_faults
    command: cargo test -p piqae-object-store --test stream_faults --locked
  - id: offline_recovery
    command: cargo test -p piqae-agent-storage --test offline_recovery --locked
  - id: postgres_release_evidence
    command: python3 release/tools/check_postgres_release_tests.py
  - id: platform_service_account_policy
    command: python3 release/tools/check_platform_service_account_policy.py
  - id: platform_service_account_coverage
    command: python3 release/tools/audit_platform_service_account_coverage.py
manual:
  - id: compatibility
    evidence: the legacy provider fixture suite and compatibility endpoint report
  - id: restart_recovery
    evidence: forced-restart and lease-expiry report
  - id: tenant_isolation
    evidence: database and HTTP cross-tenant isolation report
  - id: physical_windows
    evidence: Windows 10/11 PDF and RAW runs on every advertised driver class
  - id: code_signing
    evidence: Windows Authenticode and macOS notarisation verification
  - id: regional_dr
    evidence: fenced cross-region promotion, reconciliation, RPO, and RTO report
  - id: external_security_review
    evidence: resolved independent security assessment for the release candidate
  - id: production_soak
    evidence: no-loss and duplicate-handoff fleet soak covering the release candidate
  - id: production_runtime_roles
    evidence: API/sync/worker role isolation and a migration-only rollout with no startup DDL
  - id: hosted_integrations
    evidence: canonical Free/Pro Stripe webhooks, WorkOS, Sentry source maps, Cloud SQL, and native GCS end-to-end report
platforms:
  windows_x86_64:
    required: true
    default_tier: disabled
  macos_aarch64:
    required: false
    default_tier: preview
  macos_x86_64:
    required: false
    default_tier: preview
  linux_x86_64:
    required: false
    default_tier: preview
  linux_aarch64:
    required: false
    default_tier: preview
