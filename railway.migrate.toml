# One-shot Railway migration service. It builds the same reviewed control-plane
# image as the API, runs append-only migrations, and exits without opening a
# public listener.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile.server"

[deploy]
startCommand = "/usr/local/bin/piqae-server migrate"
restartPolicyType = "NEVER"
