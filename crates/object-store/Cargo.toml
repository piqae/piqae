[package]
name = "spool-object-store"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
async-trait = "0.1"
bytes = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
