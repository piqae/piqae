[package]
name = "spool-object-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
apache-object-store = { package = "object_store", version = "0.14.1", features = ["aws", "gcp"] }
bytes = "1"
futures = "0.3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
