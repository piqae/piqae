[package]
name = "piqae-control-plane"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[features]
default = []
otlp = [
  "dep:opentelemetry",
  "dep:opentelemetry-http",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
]

[[bin]]
name = "piqae-server"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
async-stream = "0.3"
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chacha20poly1305 = "0.10"
ed25519-dalek.workspace = true
futures.workspace = true
http.workspace = true
hex.workspace = true
hmac = "0.13"
jsonwebtoken = "9"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry-http = { version = "0.32", default-features = false, optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "internal-logs", "trace"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["experimental_trace_batch_span_processor_with_async_runtime", "internal-logs", "rt-tokio", "trace"], optional = true }
p256.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true
uuid.workspace = true

piqae-domain.workspace = true
piqae-document-renderer.workspace = true
piqae-object-store = { path = "../object-store", version = "0.1.2" }
piqae-protocol.workspace = true
piqae-auth = { path = "../auth", version = "0.1.2" }
piqae-storage-postgres = { path = "../storage-postgres", version = "0.1.2" }
piqae-webhooks = { path = "../webhooks", version = "0.1.2" }

[dev-dependencies]
aes-gcm.workspace = true
hkdf.workspace = true
http-body-util = "0.1"
sqlx.workspace = true

[lints]
workspace = true
