[package]
name = "piqae-agent"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "piqae-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
piqae-agent-client = { path = "../agent-client", version = "0.1.0" }
piqae-agent-core = { path = "../agent-core", version = "0.1.0" }
piqae-agent-storage = { path = "../agent-storage", version = "0.1.0" }
piqae-domain.workspace = true
piqae-executor-supervisor = { path = "../executor-supervisor", version = "0.1.0" }
piqae-local-api = { path = "../local-api", version = "0.1.0" }
piqae-local-ipc = { path = "../local-ipc", version = "0.1.0" }
piqae-protocol.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.19", features = ["io"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
