[package]
name = "piqae-agent"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "piqae-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aes-gcm.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
reqwest.workspace = true
p256.workspace = true
hkdf.workspace = true
rand.workspace = true
sha2.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
piqae-agent-client = { path = "../agent-client", version = "0.1.2" }
piqae-agent-core = { path = "../agent-core", version = "0.1.2" }
piqae-agent-storage = { path = "../agent-storage", version = "0.1.2" }
piqae-domain.workspace = true
piqae-document-renderer.workspace = true
piqae-executor-supervisor = { path = "../executor-supervisor", version = "0.1.2" }
piqae-local-api = { path = "../local-api", version = "0.1.2" }
piqae-local-ipc = { path = "../local-ipc", version = "0.1.2" }
piqae-native-logging = { path = "../native-logging", version = "0.1.10" }
piqae-protocol.workspace = true
piqae-support-packs = { path = "../support-packs", version = "0.1.11" }
tokio.workspace = true
tokio-util = { version = "0.7.19", features = ["io"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
