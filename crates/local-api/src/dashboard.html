<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piqae Queue</title><style>
:root{font:14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f7f7f8}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{font-size:22px;margin:0 0 5px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#777;margin:28px 0 10px}.muted{color:#777}.card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1.2fr) minmax(150px,1fr) auto;gap:16px;align-items:center;padding:12px 14px;border-top:1px solid #eee}.row:first-child{border-top:0}.title{min-width:0;font-weight:500}.title,.id,.state{overflow-wrap:anywhere}.printer{white-space:nowrap;font:12px ui-monospace,SFMono-Regular,monospace}.state{font-variant-numeric:tabular-nums}.id{font:12px ui-monospace,SFMono-Regular,monospace;color:#666}.connector{display:block;padding:18px}.connector-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.connector-title{min-width:0}.connector-title .title{font-size:15px}.badge{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#eef1f4;color:#48515a;font-size:12px}.badge.error{background:#fff1e8;color:#8a4100}.connection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.field{min-width:0}.field dt{color:#777;font-size:12px;margin-bottom:4px}.field dd{margin:0;overflow-wrap:anywhere}.connector-actions{display:flex;gap:8px;align-items:center;margin-top:16px}.recovery{margin:14px 0 0;padding:10px 12px;border-radius:7px;background:#fff4df;color:#714b00}.button,button{font:inherit;color:inherit;text-decoration:none;border:1px solid #ccc;border-radius:6px;background:#fff;padding:6px 10px;cursor:pointer}.button:hover,button:hover{background:#f3f3f3}button:disabled{opacity:.45;cursor:not-allowed}.notice{padding:20px;color:#666}dialog{border:1px solid #ccc;border-radius:10px;max-width:440px;padding:20px;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#0004}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:860px){main{padding:20px 12px}.row{grid-template-columns:minmax(0,1fr) auto}.row .printer,.row .state{grid-column:1}.printer{white-space:normal;overflow-wrap:anywhere}.connection-grid{grid-template-columns:1fr}.connector-head{display:block}.connector-head .badge{margin-top:10px}.connector-actions{flex-wrap:wrap}}
</style></head><body><main><header><div><h1>Queue</h1><div class="muted">This node’s retained print history</div></div><button id="refresh">Refresh</button></header>
<h2>Print history</h2><section id="jobs" class="card"><div class="notice">Loading…</div></section><button id="more" hidden style="margin-top:10px">Load older</button>
<h2>Connections</h2><section id="connectors" class="card"><div class="notice">Loading…</div></section>
<dialog id="confirm"><strong>Print this job again?</strong><p>This creates a new print attempt. A completed state only reports what the node or operating-system queue observed; it does not prove paper output.</p><div class="actions"><button id="cancel">Cancel</button><button id="approve">Reprint</button></div></dialog>
</main><script>
const jobs=document.querySelector('#jobs'),connectors=document.querySelector('#connectors'),more=document.querySelector('#more'),dialog=document.querySelector('#confirm');let offset=0,pending=null;const seenJobs=new Set();
const esc=v=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};
function connectionKind(item){return item.authorization_type==='platform_customer'?'Managed customer':item.authorization_type==='workspace'?'Workspace':'Third-party connection'}
function shortId(value){return value?`<div class="id">${esc(value)}</div>`:'<span class="muted">Not recorded</span>'}
async function load(append=false){const response=await fetch(`/local/queue/data?offset=${offset}`,{cache:'no-store'});if(!response.ok){jobs.innerHTML='<div class="notice">The local session expired. Open Queue from Piqae again.</div>';return}const data=await response.json();if(!append){jobs.innerHTML='';seenJobs.clear()}for(const job of data.history.jobs){if(seenJobs.has(job.job_id))continue;seenJobs.add(job.job_id);jobs.insertAdjacentHTML('beforeend',`<div class="row"><div class="title">${esc(job.title)}<div class="id">${esc(job.job_id)}</div></div><div class="printer muted">${esc(job.printer_id)}</div><div class="state">${esc(job.state).replaceAll('_',' ')}</div><button data-job="${esc(job.job_id)}" ${job.can_reprint?'':'disabled'}>${job.can_reprint?'Reprint':'Content unavailable'}</button></div>`)}if(!jobs.children.length)jobs.innerHTML='<div class="notice">No retained jobs on this node.</div>';offset=data.history.next_offset??offset;more.hidden=data.history.next_offset===null;connectors.innerHTML=data.connectors.length?'':'<div class="notice">Local only — no cloud or server connections.</div>';for(const item of data.connectors){const kind=connectionKind(item),unauthorized=item.connection==='unauthorized',status=unauthorized?`${item.connection} · ${item.last_sync_error_code||'credentials rejected'}`:item.connection,refresh=item.inventory_refresh_pending?' · refresh pending':'',owner=item.authorization_type==='platform_customer'?(item.display_name||'Platform service'):(item.workspace_name||item.display_name),manage=item.manage_url?`<a class="button" href="${esc(item.manage_url)}" target="_blank" rel="noopener noreferrer">${unauthorized?'Reconnect with owner':'Open owner'}</a>`:'',recovery=unauthorized?`<p class="recovery">This connection’s identity was rejected. ${item.manage_url?'Open its owner to create a new connection, then approve it on this node.':'Return to the workspace or app that created it and start Connect another computer. The node cannot safely invent that owner’s sign-in address.'}</p>`:'';connectors.insertAdjacentHTML('beforeend',`<article class="connector"><div class="connector-head"><div class="connector-title"><div class="title">${esc(item.display_name||item.workspace_name||'Piqae connection')}</div><div class="muted">${esc(kind)} · owned by ${esc(owner||'Unknown owner')}</div></div><span class="badge ${unauthorized?'error':''}">${esc(status).replaceAll('_',' ')}</span></div><dl class="connection-grid"><div class="field"><dt>Connected workspace</dt><dd>${esc(item.workspace_name||'Unnamed workspace')}${shortId(item.workspace_id)}</dd></div><div class="field"><dt>Environment</dt><dd>${shortId(item.environment_id)}</dd></div><div class="field"><dt>Service / platform</dt><dd>${item.requesting_service_account_id?shortId(item.requesting_service_account_id):esc(kind)}</dd></div><div class="field"><dt>Server</dt><dd class="id">${esc(item.endpoint)}</dd></div><div class="field"><dt>Printer access</dt><dd>${esc(item.permission).replaceAll('_',' ')} · ${item.eligible_printer_count}/${item.local_printer_count} eligible</dd></div><div class="field"><dt>Inventory</dt><dd>Revision ${item.inventory_revision}${refresh}</dd></div></dl>${recovery}<div class="connector-actions">${manage}<button data-connector="${esc(item.connector_id)}">Disconnect</button><span class="id">${esc(item.connector_id)}</span></div></article>`)}}
jobs.addEventListener('click',e=>{const button=e.target.closest('[data-job]');if(button){pending=button.dataset.job;dialog.showModal()}});connectors.addEventListener('click',async e=>{const button=e.target.closest('[data-connector]');if(!button||!confirm('Disconnect this service from Piqae on this computer?'))return;button.disabled=true;const response=await fetch(`/v1/local/connectors/${encodeURIComponent(button.dataset.connector)}`,{method:'DELETE'});if(!response.ok){button.disabled=false;alert('The connection could not be removed. Try again.');return}offset=0;await load()});document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#approve').onclick=async()=>{const key=crypto.randomUUID();const response=await fetch(`/local/queue/jobs/${encodeURIComponent(pending)}/reprint`,{method:'POST',headers:{'content-type':'application/json','x-piqae-local-action':'reprint'},body:JSON.stringify({idempotency_key:key,confirmed:true})});dialog.close();if(!response.ok){const body=await response.json().catch(()=>({message:'Reprint was not accepted'}));alert(body.message)}else{offset=0;await load()}};document.querySelector('#refresh').onclick=()=>{offset=0;load()};more.onclick=()=>load(true);load();
</script></body></html>
