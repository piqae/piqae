<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piqae Queue</title><style>
:root{font:14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f7f7f8}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{font-size:22px;margin:0 0 5px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#777;margin:28px 0 10px}.muted{color:#777}.card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(180px,2fr) minmax(130px,1fr) minmax(140px,1fr) auto;gap:16px;align-items:center;padding:12px 14px;border-top:1px solid #eee}.row:first-child{border-top:0}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{font-variant-numeric:tabular-nums}.connector{grid-template-columns:minmax(170px,1fr) 1fr 1fr}.id{font:12px ui-monospace,SFMono-Regular,monospace;color:#666}button{font:inherit;border:1px solid #ccc;border-radius:6px;background:#fff;padding:6px 10px;cursor:pointer}button:hover{background:#f3f3f3}button:disabled{opacity:.45;cursor:not-allowed}.notice{padding:20px;color:#666}dialog{border:1px solid #ccc;border-radius:10px;max-width:440px;padding:20px;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#0004}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:680px){main{padding:20px 12px}.row{grid-template-columns:1fr auto}.row .printer,.row .id{grid-column:1}.connector{grid-template-columns:1fr}.connector>*{grid-column:1}}
</style></head><body><main><header><div><h1>Queue</h1><div class="muted">This node’s retained print history</div></div><button id="refresh">Refresh</button></header>
<h2>Print history</h2><section id="jobs" class="card"><div class="notice">Loading…</div></section><button id="more" hidden style="margin-top:10px">Load older</button>
<h2>Connections</h2><section id="connectors" class="card"><div class="notice">Loading…</div></section>
<dialog id="confirm"><strong>Print this job again?</strong><p>This creates a new print attempt. A completed state only reports what the node or operating-system queue observed; it does not prove paper output.</p><div class="actions"><button id="cancel">Cancel</button><button id="approve">Reprint</button></div></dialog>
</main><script>
const jobs=document.querySelector('#jobs'),connectors=document.querySelector('#connectors'),more=document.querySelector('#more'),dialog=document.querySelector('#confirm');let offset=0,pending=null;const seenJobs=new Set();
const esc=v=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};
async function load(append=false){const response=await fetch(`/local/queue/data?offset=${offset}`,{cache:'no-store'});if(!response.ok){jobs.innerHTML='<div class="notice">The local session expired. Open Queue from Piqae again.</div>';return}const data=await response.json();if(!append){jobs.innerHTML='';seenJobs.clear()}for(const job of data.history.jobs){if(seenJobs.has(job.job_id))continue;seenJobs.add(job.job_id);jobs.insertAdjacentHTML('beforeend',`<div class="row"><div class="title">${esc(job.title)}<div class="id">${esc(job.job_id)}</div></div><div class="printer muted">${esc(job.printer_id)}</div><div class="state">${esc(job.state)}</div><button data-job="${esc(job.job_id)}" ${job.can_reprint?'':'disabled'}>${job.can_reprint?'Reprint':'Content unavailable'}</button></div>`)}if(!jobs.children.length)jobs.innerHTML='<div class="notice">No retained jobs on this node.</div>';offset=data.history.next_offset??offset;more.hidden=data.history.next_offset===null;connectors.innerHTML=data.connectors.length?'':'<div class="notice">Local only — no cloud or server connections.</div>';for(const item of data.connectors){connectors.insertAdjacentHTML('beforeend',`<div class="row connector"><div><div>${esc(item.endpoint)}</div><div class="id">${esc(item.connector_id)}</div></div><div>${esc(item.connection)}</div><div>${esc(item.permission)}${item.allowed_printer_ids.length?` · ${item.allowed_printer_ids.length} printers`:''}</div></div>`)}}
jobs.addEventListener('click',e=>{const button=e.target.closest('[data-job]');if(button){pending=button.dataset.job;dialog.showModal()}});document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#approve').onclick=async()=>{const key=crypto.randomUUID();const response=await fetch(`/local/queue/jobs/${encodeURIComponent(pending)}/reprint`,{method:'POST',headers:{'content-type':'application/json','x-piqae-local-action':'reprint'},body:JSON.stringify({idempotency_key:key,confirmed:true})});dialog.close();if(!response.ok){const body=await response.json().catch(()=>({message:'Reprint was not accepted'}));alert(body.message)}else{offset=0;await load()}};document.querySelector('#refresh').onclick=()=>{offset=0;load()};more.onclick=()=>load(true);load();
</script></body></html>
