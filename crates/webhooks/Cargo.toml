[package]
name = "spool-webhooks"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
thiserror = "2"
